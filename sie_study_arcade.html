  {id:"q-u2-6", unit:"u2", q:"Under Form 144, the volume limit for a 90-day selling period is the greater of 1% of outstanding shares or:", choices:["The average daily volume over 1 week","The average weekly trading volume over the last 4 weeks","Total shares ever issued","The average weekly volume over the last year"], answer:1, explain:"Use only the most recent 4 weeks of average weekly trading volume — ignore older data."},
  {id:"q-u2-7", unit:"u2", q:"Stock rights (preemptive rights) typically have a subscription period of about:", choices:["30–45 days","6 months","1 year","2 years"], answer:0, explain:"Rights are short-term, usually with a 30–45 day subscription period."},
  {id:"q-u2-8", unit:"u2", q:"Rights allow existing shareholders to buy newly issued shares at a price that is:", choices:["Above current market price","Below current market price","Always equal to par value","Set by a lottery"], answer:1, explain:"Rights let shareholders buy new shares at a discount to the current market price."},
  {id:"q-u2-9", unit:"u2", q:"Warrants are typically:", choices:["Short-term and standalone","Long-term, often attached to bonds/preferred stock as a sweetener","Only issued to the board of directors","The same thing as a proxy"], answer:1, explain:"Warrants are long-term and often bundled with bonds or preferred stock to make them more attractive."},
  {id:"q-u2-10", unit:"u2", q:"An investor has 100 shares at $60 before a 2:1 forward split. After the split, they have:", choices:["50 shares at $120","200 shares at $30","100 shares at $30","200 shares at $60"], answer:1, explain:"2:1 split doubles shares (200) and halves price ($30); total value stays $6,000."},
  {id:"q-u2-11", unit:"u2", q:"An investor has 100 shares at $5 before a 1:4 reverse split. After the split, they have:", choices:["400 shares at $1.25","25 shares at $20","25 shares at $5","100 shares at $20"], answer:1, explain:"1:4 reverse split: 100 × 1/4 = 25 shares; $500 ÷ 25 = $20/share."},
  {id:"q-u2-12", unit:"u2", q:"Which corporate action creates a brand-new company while shareholders KEEP their original shares?", choices:["Merger","Acquisition","Spin-off","Tender offer"], answer:2, explain:"In a spin-off, shareholders get new company shares AND keep their original shares."},
  {id:"q-u2-13", unit:"u2", q:"In a merger, what happens to the original companies' shares?", choices:["They double in value","They are canceled; shareholders get new company shares","Nothing changes","They become treasury stock automatically"], answer:1, explain:"Old shares are canceled and replaced with shares of the newly combined company."},
  {id:"q-u2-14", unit:"u2", q:"Which corporate actions are normally CASH offers that create a taxable event?", choices:["Stock splits and stock dividends","Buybacks and tender offers","Spin-offs and mergers","Proxy votes"], answer:1, explain:"Buybacks and tender offers are typically cash transactions, treated as a taxable sale."},
  {id:"q-u2-15", unit:"u2", q:"Receiving STOCK (not cash) in a merger or spin-off is generally:", choices:["Taxed as ordinary income immediately","Not a taxable event","Taxed at 50% of value","Always tax-exempt forever"], answer:1, explain:"Receiving shares (no cash) is generally not a taxable event."},
  {id:"q-u2-16", unit:"u2", q:"Issuers must generally notify shareholders of a corporate action at least how many days before the record date?", choices:["1 day","10 days","30 days","90 days"], answer:1, explain:"Notice must generally be given at least 10 days before the record date."},
  {id:"q-u2-17", unit:"u2", q:"A proxy is best described as:", choices:["A type of preferred stock","A limited power of attorney to vote on a shareholder's behalf","A corporate merger document","A dividend reinvestment plan"], answer:1, explain:"A proxy works like an absentee ballot / limited power of attorney for voting."},
  {id:"q-u2-18", unit:"u2", q:"For a MAJOR matter (like a merger), if a customer holding stock in street name doesn't return a proxy, the broker-dealer:", choices:["May vote however it wants","May not vote the shares","Must vote against the proposal","Must vote with the majority"], answer:1, explain:"On major matters, an undirected member firm may NOT vote the customer's shares."},
  {id:"q-u2-19", unit:"u2", q:"For a MINOR matter, if no proxy is returned, the member firm generally:", choices:["May vote as recommended by issuer management","May not vote at all","Must contact the customer by phone","Automatically votes against"], answer:0, explain:"On minor matters, the firm may vote the shares as recommended by management."},
  {id:"q-u2-20", unit:"u2", q:"When stock is held in 'street name,' who is the beneficial owner?", choices:["The broker-dealer","The customer","The transfer agent","The SEC"], answer:1, explain:"The broker-dealer is the nominal/named owner, but the customer remains the beneficial owner with all ownership rights."},

  // ---- Unit 3 ----
  {id:"q-u3-1", unit:"u3", q:"Which type of bond has its ENTIRE principal mature at one time?", choices:["Serial bond","Term bond","Balloon bond","Zero-coupon bond"], answer:1, explain:"A term bond's entire principal matures on a single date (may have a sinking fund)."},
  {id:"q-u3-2", unit:"u3", q:"In bond pricing, 1 point equals:", choices:["$1","$10","$100","$1,000"], answer:1, explain:"1 point = 1% of $1,000 par value = $10."},
  {id:"q-u3-3", unit:"u3", q:"If market interest rates rise, bond prices generally:", choices:["Rise","Fall","Stay exactly the same","Double"], answer:1, explain:"Bond prices and interest rates move inversely."},
  {id:"q-u3-4", unit:"u3", q:"A bond quoted at 90 is priced at:", choices:["$90","$900","$9,000","$90,000"], answer:1, explain:"90 points × $10/point = $900."},
  {id:"q-u3-5", unit:"u3", q:"The formula for Current Yield is:", choices:["Par value ÷ market price","Annual coupon payment ÷ market price","Market price ÷ annual coupon","Coupon rate × par value"], answer:1, explain:"Current Yield = annual coupon payment ÷ current market price."},
  {id:"q-u3-6", unit:"u3", q:"For a bond trading at a DISCOUNT, the correct yield order from LOWEST to HIGHEST is:", choices:["YTC < YTM < CY < Coupon","Coupon < CY < YTM < YTC","CY < Coupon < YTC < YTM","Coupon = CY = YTM = YTC"], answer:1, explain:"Discount bond: Coupon < Current Yield < YTM < YTC."},
  {id:"q-u3-7", unit:"u3", q:"100 basis points equal:", choices:["0.1%","1%","10%","100%"], answer:1, explain:"1 basis point = 1/100 of 1%, so 100 basis points = 1%."},
  {id:"q-u3-8", unit:"u3", q:"A bond quoted 'on a basis of 5.83' refers to its:", choices:["Current yield","Nominal yield","Yield to maturity (YTM)","Par value"], answer:2, explain:"A yield quoted 'on a basis of' refers to the Yield to Maturity."},
  {id:"q-u3-9", unit:"u3", q:"A call feature on a bond primarily benefits the:", choices:["Investor","Issuer","Underwriter","Transfer agent"], answer:1, explain:"Call features let the issuer redeem debt early, usually when rates fall — this benefits the issuer."},
  {id:"q-u3-10", unit:"u3", q:"A put feature on a bond primarily benefits the:", choices:["Issuer","Bondholder (investor)","SEC","Underwriter"], answer:1, explain:"Put features let the investor force early repayment, typically used when rates rise."},
  {id:"q-u3-11", unit:"u3", q:"How is interest on a zero-coupon bond taxed?", choices:["Never taxed","All at once when sold","Annually as it accretes, even though paid at maturity","Only if held over 10 years"], answer:2, explain:"Zero-coupon bond interest accretes annually and is taxed each year (phantom income)."},
  {id:"q-u3-12", unit:"u3", q:"S&P's top four bond ratings, from highest to lowest, are:", choices:["A, AA, AAA, BBB","AAA, AA, A, BBB","BBB, A, AA, AAA","AAA, BBB, AA, A"], answer:1, explain:"Highest to lowest: AAA, AA, A, BBB."},
  {id:"q-u3-13", unit:"u3", q:"Bonds rated BB/Ba or lower are called:", choices:["Investment grade bonds","High-yield (junk) bonds","Municipal bonds","Treasury bonds"], answer:1, explain:"BB/Ba and below = high-yield/junk bonds, with greater default risk."},
  {id:"q-u3-14", unit:"u3", q:"All else equal, which bond is MORE volatile — a 10-year bond or a 5-year bond with the same coupon?", choices:["The 5-year bond","The 10-year bond","They're equally volatile","Volatility doesn't relate to maturity"], answer:1, explain:"Longer time to maturity means more price volatility."},
  {id:"q-u3-15", unit:"u3", q:"In a corporate bankruptcy, which creditor class is paid FIRST?", choices:["Common stockholders","Subordinated debt holders","Secured debt holders","Preferred stockholders"], answer:2, explain:"Secured debt holders are paid first, from the sale of collateral."},
  {id:"q-u3-16", unit:"u3", q:"A debenture is:", choices:["Secured by real estate","Unsecured debt backed by the issuer's full faith and credit","A type of municipal note","Backed by a third-party guarantor"], answer:1, explain:"Debentures are unsecured bonds — the most senior unsecured debt."},
  {id:"q-u3-17", unit:"u3", q:"Which Treasury securities are issued at a discount with no stated interest rate?", choices:["T-notes and T-bonds","TIPS and T-notes","T-bills and STRIPS","GNMA and FNMA"], answer:2, explain:"T-bills and STRIPS are the only Treasury securities issued at a discount without a stated rate."},
  {id:"q-u3-18", unit:"u3", q:"Treasury notes (T-notes) have a maturity range of:", choices:["Less than 1 year","2–10 years","10–30 years","30–50 years"], answer:1, explain:"T-notes are intermediate-term, maturing in 2–10 years."},
  {id:"q-u3-19", unit:"u3", q:"Which agency security is backed by the full faith and credit of the U.S. government?", choices:["FNMA (Fannie Mae)","FHLMC (Freddie Mac)","GNMA (Ginnie Mae)","SLMA (Sallie Mae)"], answer:2, explain:"GNMA (Ginnie Mae) is the only agency security with that backing."},
  {id:"q-u3-20", unit:"u3", q:"General Obligation (GO) municipal bonds are backed by:", choices:["Project revenue","The municipality's taxing power","Corporate collateral","The U.S. Treasury"], answer:1, explain:"GO bonds are backed by the issuer's taxing authority — also called full faith and credit bonds."},
  {id:"q-u3-21", unit:"u3", q:"Revenue bonds are backed by:", choices:["The municipality's taxing power","Revenue from the specific project financed","Federal guarantees","The state's general fund only"], answer:1, explain:"Revenue bonds are self-supporting, paid from the revenue of the project they financed."},
  {id:"q-u3-22", unit:"u3", q:"Municipal bond interest is generally exempt from:", choices:["State tax only","Federal income tax","Capital gains tax","All taxes with no exceptions"], answer:1, explain:"Muni interest is usually federally tax-exempt (and state-exempt if you live in the issuing state); capital gains are still taxable."},
  {id:"q-u3-23", unit:"u3", q:"A municipal bond yields 7% and an investor is in the 30% tax bracket. What is the taxable-equivalent yield?", choices:["7.7%","10%","4.9%","21%"], answer:1, explain:"7% ÷ (100% − 30%) = 7% ÷ 0.70 = 10%."},
  {id:"q-u3-24", unit:"u3", q:"Money market instruments have a maturity of:", choices:["1 year or less","1–5 years","5–10 years","10+ years"], answer:0, explain:"By definition, money market securities mature in 1 year or less."},
  {id:"q-u3-25", unit:"u3", q:"Commercial paper's maximum maturity is:", choices:["90 days","180 days","270 days","365 days"], answer:2, explain:"Commercial paper matures in 1–270 days (most within 90 days)."},
  {id:"q-u3-26", unit:"u3", q:"In a REVERSE repo, the dealer:", choices:["Sells securities and agrees to buy them back later","Buys securities and agrees to sell them back later at a higher price","Never returns the securities","Only trades with the Federal Reserve"], answer:1, explain:"Reverse repo: the dealer buys securities from an investor and resells them later at a higher price."},
  {id:"q-u3-27", unit:"u3", q:"CMOs (Collateralized Mortgage Obligations) divide mortgage pools into:", choices:["Warrants","Tranches with different maturities and risk","Rights offerings","Proxy classes"], answer:1, explain:"CMOs are divided into tranches, with principal repaid to one tranche at a time."},
  {id:"q-u1-21", unit:"u1", q:"Who is responsible for overseeing company management and declaring dividends?", choices:["The SEC","The Board of Directors","FINRA","The transfer agent"], answer:1, explain:"The BOD, elected by common shareholders, oversees management and declares dividends."},
  {id:"q-u1-22", unit:"u1", q:"Which document must a company file annually with the SEC that provides audited financial statements?", choices:["10-Q","8-K","10-K","Proxy statement"], answer:2, explain:"The 10-K is the annual report filed with the SEC containing audited financials."},
  {id:"q-u1-23", unit:"u1", q:"Preferred stockholders typically do NOT have which right that common stockholders have?", choices:["Fixed dividend priority","Voting rights","Priority over common in liquidation","Callable feature"], answer:1, explain:"Preferred stock generally lacks voting rights; that's a trade-off for its fixed dividend priority."},
  {id:"q-u1-24", unit:"u1", q:"A company that pays shareholders in units of its own product instead of cash has issued a:", choices:["Cash dividend","Stock dividend","Product dividend","Liquidating dividend"], answer:2, explain:"A product dividend distributes the company's own goods instead of cash or stock."},
  {id:"q-u1-25", unit:"u1", q:"A common shareholder's right to sell their shares to anyone without company approval is called:", choices:["Preemptive right","Right to freely transfer shares","Right to inspect books","Cumulative voting"], answer:1, explain:"Common shareholders can freely transfer/sell shares without needing issuer approval."},
  {id:"q-u1-26", unit:"u1", q:"Participating preferred stock entitles the holder to:", choices:["Only the fixed stated dividend","The fixed dividend plus a share of extra dividends paid to common","Voting rights equal to common","Conversion into bonds"], answer:1, explain:"Participating preferred receives its fixed dividend plus a proportional share of any additional dividends distributed to common shareholders."},
  {id:"q-u1-27", unit:"u1", q:"Directors are typically elected by:", choices:["The SEC","FINRA","A vote of common shareholders","The preferred shareholders only"], answer:2, explain:"Common shareholders elect the board of directors, typically via statutory or cumulative voting."},
  {id:"q-u1-28", unit:"u1", q:"A shareholder's right to review certain corporate records, such as a list of shareholders, is an example of the:", choices:["Right to transfer shares","Right to information","Preemptive right","Right to a dividend"], answer:1, explain:"Shareholders have a right to certain information/records about the company, such as financial disclosures and shareholder lists."},
  {id:"q-u2-21", unit:"u2", q:"One benefit of an ADR for a U.S. investor is that dividends are paid:", choices:["In the foreign currency only","In U.S. dollars","Only as stock dividends","Directly by the foreign government"], answer:1, explain:"ADRs convert foreign dividends into U.S. dollars for the holder, avoiding currency conversion hassle."},
  {id:"q-u2-22", unit:"u2", q:"A foreign government withholds tax on dividends paid to an ADR holder. The U.S. investor may be able to offset this by claiming a:", choices:["Foreign tax credit","Capital loss","Wash sale deduction","Alternative minimum credit"], answer:0, explain:"Investors can often claim a foreign tax credit on their U.S. return for taxes withheld abroad."},
  {id:"q-u2-23", unit:"u2", q:"A company executes a 3-for-2 forward split. An investor holding 100 shares at $60 will now hold:", choices:["150 shares at $40","150 shares at $60","200 shares at $30","100 shares at $90"], answer:0, explain:"3:2 split: 100 x 3/2 = 150 shares; price adjusts to 60 x 2/3 = $40, keeping total value the same."},
  {id:"q-u2-24", unit:"u2", q:"A company executes a 2-for-1 forward split. An investor holding 50 shares at $80 will now hold:", choices:["100 shares at $40","50 shares at $160","25 shares at $160","100 shares at $80"], answer:0, explain:"2:1 split doubles shares and halves price: 50→100 shares, $80→$40, same total value."},
  {id:"q-u2-25", unit:"u2", q:"Warrants are often issued attached to a bond as a:", choices:["Sinking fund requirement","Sweetener to make the offering more attractive","Form of collateral","Tax shelter"], answer:1, explain:"Warrants attached to a bond or preferred stock sweeten the deal and can later be detached and traded."},
  {id:"q-u2-26", unit:"u2", q:"A company offers to buy shares from any shareholder willing to sell at a stated price within a set window. This is a:", choices:["Buyback","Tender offer","Rights offering","Stock split"], answer:1, explain:"A tender offer is a formal, public offer to all shareholders to purchase shares at a set price during a window."},
  {id:"q-u2-27", unit:"u2", q:"Selling restricted/control securities under Rule 144 above certain thresholds requires filing which form with the SEC?", choices:["Form 144","10-K","Proxy statement","Form 8-K"], answer:0, explain:"Form 144 is filed with the SEC when selling restricted/control securities above certain thresholds under Rule 144."},
  {id:"q-u2-28", unit:"u2", q:"Compared to a direct shareholder of the foreign company, an ADR holder's voting rights are generally:", choices:["Identical — ADRs always pass through a full vote","Limited — the depositary bank is not required to pass voting rights through to ADR holders","Nonexistent — ADR holders can never vote under any circumstances","Greater — ADR holders get extra votes as compensation for currency risk"], answer:1, explain:"The depositary bank holds the actual shares and is not required to pass voting rights through to ADR holders, so ADR holders generally have limited or no effective vote compared to a direct shareholder."},
  {id:"q-u3-28", unit:"u3", q:"On the exam, the term \"series bond\" most likely refers to:", choices:["A bond maturity type, alongside term/serial/balloon bonds","A type of collateral, like an equipment trust certificate", "A savings bond, such as a Series EE or Series I bond","A municipal revenue bond"], answer:2, explain:"\"Series\" is not a bond maturity structure or collateral type — it's a common exam trick, since \"series bond\" normally points to savings bonds like Series EE or Series I."},
  {id:"q-u3-29", unit:"u3", q:"Series EE and Series I savings bonds differ from Treasury notes/bonds in that they:", choices:["Trade actively on the secondary market","Are non-marketable and redeemed directly with the Treasury","Pay dividends instead of interest","Are issued by municipalities"], answer:1, explain:"Savings bonds are non-marketable — they can't be sold to other investors, only redeemed with the Treasury."},
  {id:"q-u3-30", unit:"u3", q:"A sinking fund is established by a corporation to:", choices:["Pay shareholder dividends","Set aside money over time to help redeem bonds at or before maturity","Fund a stock buyback","Cover legal fees in bankruptcy"], answer:1, explain:"A sinking fund sets aside cash periodically to help retire term bonds, reducing default risk."},
  {id:"q-u3-31", unit:"u3", q:"A \"nonrated\" bond means:", choices:["The bond is guaranteed to default","No rating agency has evaluated the bond","The bond is exempt from taxes","The bond has no maturity date"], answer:1, explain:"Nonrated simply means no agency rating exists — it doesn't automatically imply poor quality, but often raises perceived risk due to lack of information."},
  {id:"q-u3-32", unit:"u3", q:"In a corporate bankruptcy liquidation, administrative claimants (attorneys, courts, appraisers, liquidators) are paid:", choices:["Before secured creditors, ahead of everyone", "After secured creditors, but before any other unsecured debt or stockholders", "Only after all other creditors and stockholders are paid", "At the same time as common stockholders"], answer:1, explain:"Administrative claimants are paid after secured creditors collect from their collateral, but before general unsecured creditors, subordinated debt, and stockholders."},
  {id:"q-u3-33", unit:"u3", q:"An equipment trust certificate is backed by:", choices:["Real estate","Specific equipment, such as railcars or aircraft","General revenue of the issuer","Tax receipts"], answer:1, explain:"Equipment trust certificates pledge specific equipment as collateral, common with transportation companies."},
  {id:"q-u3-34", unit:"u3", q:"Unlike STRIPS, Treasury receipts are:", choices:["Directly issued and backed by the U.S. Treasury","Created by a broker-dealer holding the underlying Treasury securities in custody","Only available to institutions","Municipal instruments"], answer:1, explain:"Treasury receipts are privately created by broker-dealers; STRIPS are created and backed directly by the Treasury itself."},
  {id:"q-u3-35", unit:"u3", q:"Bonds issued by Puerto Rico, Guam, or the U.S. Virgin Islands are:", choices:["Taxable at the federal level only","Triple tax-exempt (federal, state, and local) for all U.S. investors","Subject to state tax only for residents","Fully taxable like corporate bonds"], answer:1, explain:"Territory bonds are triple tax-exempt for all U.S. investors regardless of the investor's state of residence."},
  {id:"q-u3-36", unit:"u3", q:"A Variable-Rate Demand Note (VRDN) allows the holder to:", choices:["Convert the note into common stock","Put the note back to the issuer/agent at par on short notice","Receive a fixed rate for the life of the note","Have zero interest rate risk while holding to a stated 30-year maturity with no early redemption"], answer:1, explain:"VRDNs have a put feature letting holders sell back at par on short notice, despite a long stated maturity."},
  {id:"q-u3-37", unit:"u3", q:"Which best describes a negotiable (jumbo) CD?", choices:["Cannot be sold before maturity","Typically under $10,000 and FDIC-insured only up to face value","Usually $100,000+ and tradable on the secondary market before maturity","Issued only by the U.S. Treasury"], answer:2, explain:"Negotiable/jumbo CDs are large ($100k+) and can be sold on the secondary market instead of incurring an early withdrawal penalty."},
  {id:"q-u3-38", unit:"u3", q:"A corporation issues a bond backed by a portfolio of Treasury securities held in trust. This is best described as a:", choices:["Mortgage bond","Equipment trust certificate","Collateral trust bond","Debenture"], answer:2, explain:"A collateral trust bond is secured by a portfolio of securities (often from another issuer) held in trust, not by real estate or equipment."},
  {id:"q-u3-39", unit:"u3", q:"A bond secured by real estate the corporation owns is called a:", choices:["Collateral trust bond","Mortgage bond","Income bond","Guaranteed bond"], answer:1, explain:"A mortgage bond is backed specifically by real estate the corporation owns."},
  {id:"q-u3-40", unit:"u3", q:"When calculating accrued interest on a CORPORATE bond, the day-count convention used is:", choices:["Actual days elapsed / 365-day year","30-day month / 360-day year","Actual days elapsed / 360-day year","30-day month / 365-day year"], answer:1, explain:"Corporate (and municipal) bonds use a 30-day month / 360-day year convention for accrued interest."},
  {id:"q-u3-41", unit:"u3", q:"When calculating accrued interest on a U.S. TREASURY note, the day-count convention used is:", choices:["30-day month / 360-day year","Actual calendar days elapsed","15-day month / 180-day year","Treasuries don't accrue interest"], answer:1, explain:"Treasury securities use actual calendar days elapsed, unlike the 30/360 convention used for corporate and municipal bonds."},
  {id:"q-u3-42", unit:"u3", q:"Which of the following is a privately-owned, government-sponsored network that raises money by selling debt securities to fund agricultural loans?", choices:["GNMA","Farm Credit System","FHLMC","SLMA"], answer:1, explain:"The Farm Credit System raises funds through Farm Credit debt securities to provide agricultural financing, overseen by the Farm Credit Administration (FCA)."},
  {id:"q-u3-43", unit:"u3", q:"Interest paid by GNMA, FNMA, and FHLMC securities is:", choices:["Exempt from federal tax only","Exempt from state and local tax only","Taxable at both the federal and state/local level","Fully tax-exempt at all levels"], answer:2, explain:"Unlike direct Treasury securities, agency securities (GNMA, FNMA, FHLMC) are taxable at both the federal and state/local level."},
  {id:"q-u3-44", unit:"u3", q:"A short-term municipal note issued in anticipation of BOTH future tax receipts and future project revenue is a:", choices:["TAN","RAN","TRAN","BAN"], answer:2, explain:"A TRAN (Tax and Revenue Anticipation Note) combines the features of a TAN and a RAN."},
  {id:"q-u3-45", unit:"u3", q:"A short-term municipal note issued in anticipation of receiving grant money is called a:", choices:["BAN","GAN","CLN","TRAN"], answer:1, explain:"A GAN (Grant Anticipation Note) is issued in anticipation of grant money, usually from the federal government."},
  {id:"q-u3-46", unit:"u3", q:"A short-term municipal note used to provide interim financing for the construction of housing projects is a:", choices:["Construction loan note (CLN)","Tax anticipation note (TAN)","Equipment trust certificate","Collateral trust bond"], answer:0, explain:"A CLN provides interim financing specifically for housing project construction."},
  {id:"q-u1-29", unit:"u1", q:"Which of the following corporate actions would most likely require shareholder approval?", choices:["Declaring a quarterly dividend","Firing the CEO","Hiring a new CFO","Changing the corporation's name"], answer:3, explain:"Routine management decisions like declaring dividends or hiring/firing executives are within the board's power. A significant change like renaming the corporation typically requires shareholder approval."},
  {id:"q-u2-29", unit:"u2", q:"Which of the following sales is subject to Rule 144 volume limitations?", choices:["A nonaffiliate selling registered stock held one month","A control person selling registered stock held one year","A nonaffiliate selling restricted stock held over six months","None of these"], answer:1, explain:"Control persons are always subject to Rule 144 volume limits, whether their stock is registered or restricted. Nonaffiliates have no volume limits on registered stock, and none on restricted stock once the 6-month hold period has passed."},
  {id:"q-u2-30", unit:"u2", q:"A corporation making a tender offer on its own outstanding bonds is most likely doing so in order to:", choices:["Increase its total debt load","Retire the debt early","Convert the debt into equity","Avoid paying any further interest without repaying principal"], answer:1, explain:"Corporations sometimes make a tender offer for their own debt as a way to retire it before maturity."},
  {id:"q-u2-31", unit:"u2", q:"A customer signs and returns a proxy statement for street-name stock but leaves one item on the ballot blank. What must the member firm do with that item?", choices:["Leave those shares unvoted on that item","Vote as recommended by the issuer's management","Contact the customer before voting","Vote against the proposal by default"], answer:1, explain:"When a signed proxy is returned without voting instructions on an item, the member firm must vote as recommended by the issuer's management — regardless of whether the matter is major or minor."},
  {id:"q-u3-47", unit:"u3", q:"The risk that a bond issuer fails to pay interest or principal when due is called:", choices:["Purchasing power risk","Default (credit) risk","Interest rate risk","Reinvestment risk"], answer:1, explain:"Default (credit) risk is the risk that the issuer fails to make interest or principal payments — the worst outcome of owning a bond."},
  {id:"q-u3-48", unit:"u3", q:"A bond that pays a fixed rate of interest is most exposed to which risk during periods of rising inflation?", choices:["Default risk","Purchasing power risk","Call risk","Currency risk"], answer:1, explain:"Purchasing power (inflation) risk affects any fixed payment — as prices rise, that fixed payment buys less over time."},
  {id:"q-u3-49", unit:"u3", q:"Which of the following is generally considered the primary reason an investor purchases bonds?", choices:["Long-term capital appreciation","Steady, predictable income","Tax-free growth in all cases","Voting control of the company"], answer:1, explain:"Bonds are considered the best way to produce steady, predictable current income, since the issuer is obligated to make interest payments or default."}
];

const TIPS = [
  {unit:"u1", mnemonic:"DERP", note:"Dividend dates always happen in this order: Declaration → Ex-dividend → Record → Payable. Buy before the Ex-date to get the dividend."},
  {unit:"u1", mnemonic:"Outstanding = Issued − Treasury", note:"Treasury stock is bought-back stock sitting in the company's pocket — it doesn't vote and doesn't count as outstanding."},
  {unit:"u1", mnemonic:"Statutory = STATic", note:"Statutory voting locks your votes per seat (1 share = 1 vote per seat, can't combine). Cumulative voting lets you stack all your votes on one seat — better for small holders."},
  {unit:"u1", mnemonic:"Debt → Preferred → Common", note:"At bankruptcy, that's the payout order for the 'ownership' side of the balance sheet. Common stockholders are paid last and often get nothing."},
  {unit:"u1", mnemonic:"Preferred par = $100, Bond par = $1,000", note:"Easy mix-up on the exam — preferred stock defaults to $100 par, bonds default to $1,000 par."},
  {unit:"u1", mnemonic:"Cumulative = accumulates, Straight = straight-up lost", note:"Cumulative preferred banks missed dividends as 'arrears' that must be paid later. Straight (noncumulative) just loses them forever."},
  {unit:"u2", mnemonic:"Rights are Quick, Warrants Wait", note:"Rights: short subscription window (30–45 days) to protect existing shareholders' %. Warrants: long-term sweeteners bundled with bonds/preferred stock."},
  {unit:"u2", mnemonic:"Restricted = 6 months, Control = Form 144", note:"Restricted stock just needs a 6-month hold. Control (insider) stock needs Form 144 + the volume limit — the greater of 1% of shares outstanding or the last 4 weeks' average weekly volume."},
  {unit:"u2", mnemonic:"Spin-off = keep AND get", note:"Merger/Acquisition: old shares are canceled, you get new ones. Spin-off: you keep your original shares AND get shares in the new company too."},
  {unit:"u2", mnemonic:"Stock is free, Cash costs you", note:"Receiving stock in a corporate action is generally not taxable. Receiving cash (buybacks, tender offers) is a taxable event."},
  {unit:"u3", mnemonic:"Discount? Climb. Premium? Plunge.", note:"Discount bond: yields climb — Coupon < CY < YTM < YTC. Premium bond: yields fall — Coupon > CY > YTM > YTC. At par, all four are equal."},
  {unit:"u3", mnemonic:"'On a basis of' = YTM", note:"Any time the exam says a bond is quoted 'on a basis of X%,' that X% is the Yield to Maturity."},
  {unit:"u3", mnemonic:"Long & Low = Whoa", note:"Longer maturity + lower coupon rate = more price volatility. A long-term zero-coupon bond is the most volatile of all."},
  {unit:"u3", mnemonic:"Secured, Admin, Unsecured, Subordinated, Preferred, Common", note:"Corporate bankruptcy payout order. Secured debt is paid first from its own collateral, then administrative claims (legal/liquidator costs of running the case), then general unsecured creditors, then subordinated debt, then preferred stock, and common stockholders last."},
  {unit:"u3", mnemonic:"T-bills & STRIPS = discount only", note:"They're the only Treasury securities issued at a discount with no stated interest rate — all the 'interest' shows up at maturity."},
  {unit:"u3", mnemonic:"GNMA is Genuine", note:"Ginnie Mae (GNMA) is the only agency security backed by the full faith and credit of the U.S. government. Fannie and Freddie are not."},
  {unit:"u3", mnemonic:"GO = taxes, Revenue = the project pays", note:"General Obligation bonds are backed by the municipality's taxing power. Revenue bonds are self-supporting from the specific project's income."},
  {unit:"u3", mnemonic:"Tax-equivalent yield: divide by what's left", note:"Municipal yield ÷ (100% − tax bracket). A 7% muni yield at a 30% bracket = 7% ÷ 0.70 = 10% taxable-equivalent yield."}
];

// Facts tested in QUIZ mode that don't have a matching TERMS entry, so they
// never show up in Flashcards / Term Recall / Matching (those three modes
// only pull from TERMS). This tab surfaces them so nothing quizzed goes
// unstudied elsewhere.
const GAPS = [
  {id:"gap-1", unit:"u1", title:"Penny stock risk disclosure (solicited trades)", fact:"Before a customer's FIRST solicited penny stock transaction, the broker-dealer must give them a written risk disclosure document and get back a signed, dated acknowledgment. This is separate from — and in addition to — the suitability determination.", quizRef:"Tested in Quiz: q-u1-5"},
  {id:"gap-2", unit:"u1", title:"Who actually sets the ex-dividend date", fact:"A lot of students assume the company sets its own ex-dividend date. It's actually set by FINRA or the relevant exchange, not the issuer. Buy before that date and you get the dividend; buy on or after it and the seller keeps it.", quizRef:"Tested in Quiz: q-u1-9"},
  {id:"gap-3", unit:"u1", title:"Statutory vs. cumulative voting — the max-votes trap", fact:"With statutory voting, votes CANNOT be combined: shares × 1 vote per open seat is your max for any single seat. With cumulative voting, you multiply shares × total open seats, then stack ALL of those votes on one seat if you want. Same share count, very different math depending on which system applies.", quizRef:"Tested in Quiz: q-u1-11, q-u1-12"},
  {id:"gap-4", unit:"u1", title:"Participating preferred — how the bonus actually gets split", fact:"Participating preferred gets its fixed stated dividend PLUS a proportional share of any extra dividend the board declares on top of what common receives — it doesn't just get an arbitrary bonus, the extra amount is tied to what common shareholders are getting.", quizRef:"Tested in Quiz: q-u1-26"},
  {id:"gap-5", unit:"u2", title:"Control person's 10% includes family holdings", fact:"When counting whether someone crosses the 10% ownership threshold that makes them a \"control person,\" shares held by their immediate family are combined with their own — you can't split ownership across relatives to dodge the control-person rules.", quizRef:"Tested in Quiz: q-u2-5"},
  {id:"gap-6", unit:"u2", title:"Form 144 volume limit — only the last 4 weeks count", fact:"When calculating the average weekly trading volume for the Form 144 limit, only the most recent 4 weeks of data are used — older volume figures are ignored even if they were higher. The limit is the GREATER of that 4-week average or 1% of shares outstanding.", quizRef:"Tested in Quiz: q-u2-6"},
  {id:"gap-7", unit:"u2", title:"Proxy voting: major matters vs. minor matters", fact:"If a customer doesn't return a proxy, a member firm CAN vote street-name shares on routine/minor matters (following management's recommendation), but CANNOT vote them on major matters like a merger or a new stock issuance — the firm must leave those shares unvoted.", quizRef:"Tested in Quiz: q-u2-18, q-u2-19"},
  {id:"gap-8", unit:"u2", title:"Beneficial owner vs. record (street name) owner", fact:"When shares are held in \"street name,\" the brokerage firm is the name on the company's books (the record/nominal owner), but the customer is the beneficial owner — they still keep the dividends, sale proceeds, and (subject to the proxy rules above) generally the vote.", quizRef:"Tested in Quiz: q-u2-20"},
  {id:"gap-9", unit:"u2", title:"Rights vs. Warrants — short vs. long", fact:"Rights are short-term (a 30–45 day subscription window) and protect existing shareholders from dilution during a new offering. Warrants are long-term (often years) and are usually bundled with a bond or preferred stock issue as a sweetener. Easy to mix up since both let you buy stock at a set price.", quizRef:"Tested in Quiz: q-u2-9"},
  {id:"gap-10", unit:"u2", title:"ADR voting rights are limited", fact:"The depositary bank that holds the foreign shares behind an ADR is NOT required to pass voting rights through to ADR holders — so compared to a direct shareholder, an ADR holder generally has limited or no effective vote.", quizRef:"Tested in Quiz: q-u2-28"},
  {id:"gap-11", unit:"u3", title:"Bond prices move inversely to interest rates", fact:"When market interest rates rise, existing bond prices fall (their fixed coupon looks less attractive vs. new higher-rate bonds); when rates fall, existing bond prices rise. This relationship drives almost every bond-pricing question on the exam.", quizRef:"Tested in Quiz: q-u3-3 · also shown in the Tips & Visuals seesaw"},
  {id:"gap-12", unit:"u3", title:"\"Quoted on a basis of X%\"", fact:"Any time a bond is described as quoted \"on a basis of\" a percentage, that percentage IS the Yield to Maturity — it's just exam phrasing for YTM.", quizRef:"Tested in Quiz: q-u3-8"},
  {id:"gap-13", unit:"u3", title:"The full yield-order ladder in one place", fact:"Discount bond (below par): Coupon < Current Yield < YTM < YTC — yields climb. Premium bond (above par): Coupon > Current Yield > YTM > YTC — yields fall. At par: all four yields are equal. Knowing which direction the ladder runs is tested constantly.", quizRef:"Tested in Quiz: q-u3-6"},
  {id:"gap-14", unit:"u3", title:"Call feature vs. Put feature — who benefits", fact:"A call feature lets the ISSUER redeem the bond early (usually when rates fall) — callable bonds pay a slightly HIGHER coupon to compensate the investor for that risk. A put feature lets the INVESTOR force early repayment (usually when rates rise) — put bonds pay a slightly LOWER coupon since the investor holds the advantage.", quizRef:"Tested in Quiz: q-u3-9, q-u3-10"},
  {id:"gap-15", unit:"u3", title:"Secured vs. unsecured vs. subordinated, side by side", fact:"Secured debt is backed by specific collateral (mortgage bonds, equipment trust certificates) and is paid first among creditors. Unsecured debentures rely only on the issuer's general credit. Subordinated debt is unsecured AND explicitly ranked below regular debentures — last among the bondholders, so it typically pays the highest coupon of the three to compensate for that risk.", quizRef:"Tested in Quiz: q-u3-15, q-u3-16"},
  {id:"gap-16", unit:"u3", title:"Only 2 Treasuries are pure discount instruments", fact:"T-bills and Treasury STRIPS are the only Treasury securities issued at a discount with no stated interest rate — all the \"interest\" just shows up as the difference between purchase price and par at maturity. T-notes, T-bonds, and TIPS all pay a stated semiannual coupon.", quizRef:"Tested in Quiz: q-u3-17"},
  {id:"gap-17", unit:"u3", title:"Treasury maturity ladder at a glance", fact:"T-bill: up to 52 weeks. T-note: 2–10 years. T-bond: 10–30 years. The exam often asks you to identify a security purely from its maturity range, so having all three side by side helps more than studying them one at a time.", quizRef:"Tested in Quiz: q-u3-18"},
  {id:"gap-18", unit:"u3", title:"Municipal bond tax nuances", fact:"Muni interest is exempt from federal tax for everyone, and exempt from state/local tax ONLY if the investor lives in the state that issued the bond (\"triple exempt\" muni bonds — like territory bonds — are the exception, exempt everywhere). Capital GAINS on munis, though, are still fully taxable even though the interest is exempt.", quizRef:"Tested in Quiz: q-u3-22"}
];

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function normalizeText(s){
  return (s||"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function isCloseMatch(input, target){
  const a = normalizeText(input), b = normalizeText(target);
  if(!a) return false;
  if(a===b) return true;
  if(a.length>=4 && b.includes(a)) return true;
  if(b.length>=4 && a.includes(b)) return true;
  const bWords = b.split(" ").filter(w=>w.length>2);
  if(bWords.length===0) return false;
  const aWords = new Set(a.split(" ").filter(w=>w.length>2));
  const overlap = bWords.filter(w=>aWords.has(w)).length;
  return overlap/bWords.length >= 0.6;
}

  chosen.forEach(t=>{
    cards.push({key:t.id+"-term", pairId:t.id, type:"term", text:t.term});

  state.m = {cards, selected:null, matchedPairs:0, totalPairs:n, moves:0, startTime:Date.now(), timer:null, elapsed:0, done:false};

/* ---- Learn (bite-sized lessons) ---- */
function startLesson(fam){
  const meta = LESSON_META.find(l=>l.fam===fam);
  if(!meta) return;
  const terms = TERMS.filter(t=>t.fam===fam);
  const termIds = new Set(terms.map(t=>t.id));

  // Build a list of "extra" steps (visual/example first, then checks, in the
  // order they're defined), each tagged with the term id it must follow.
  // Checks are randomly sampled from a larger candidate pool each time the
  // lesson is started, so questions show up more often and in a different
  // mix on replay — but every single one is still anchored to a concept
  // card that's already been shown, so nothing gets asked before it's taught.
  const extras = [];
  if(meta.visual) extras.push({type:"visual", viz:meta.visual.key, after:meta.visual.after});
  if(meta.example){
    const m = MATH_PROBLEMS.find(x=>x.id===meta.example.mathId);
    if(m) extras.push({type:"example", math:m, after:meta.example.after});
  }
  const checkCandidates = (meta.checks||[]).map(c=>{
    const q = QUIZ.find(x=>x.id===c.id);
    return q ? {type:"check", quiz:q, after:c.after} : null;
  }).filter(Boolean);
  const targetChecks = Math.min(checkCandidates.length, Math.max(3, Math.round(terms.length/2)), 8);
  shuffle(checkCandidates).slice(0, targetChecks).forEach(c=>extras.push(c));

  const deck = [];
  const used = new Set();
  terms.forEach(t=>{
    deck.push({type:"concept", term:t});
    extras.forEach(ex=>{
      if(ex.after===t.id && !used.has(ex)){
        deck.push(ex);
        used.add(ex);
      }
    });
  });
  // Safety net: any extra whose anchor term wasn't found in this fam (e.g. a
  // typo) still gets shown, just at the end rather than being silently lost.
  extras.forEach(ex=>{
    if(!used.has(ex) && !termIds.has(ex.after)) deck.push(ex);
  });
  deck.push({type:"done"});
  state.learn = {activeFam:fam, deck, stepIdx:0, checkSelected:null, checkAnswered:false, exampleRevealed:0};
}
function advanceLearn(){
  state.learn.stepIdx++;
  state.learn.checkSelected = null;
  state.learn.checkAnswered = false;
  state.learn.exampleRevealed = 0;

function handleLearnCheck(idx){
  state.learn.checkSelected = idx;

}
function goToNextLesson(){
  const lessons = getActiveLessons();
  const i = lessons.findIndex(l=>l.fam===state.learn.activeFam);
  if(i>=0 && i+1<lessons.length) startLesson(lessons[i+1].fam);

  render();
}

}

  if(!state.learn.activeFam){
    const cardsHtml = lessons.map(l=>{
      const done = progress.learnedLessons.includes(l.fam);
      return `
        <div class="lesson-card ${done?"done":""}" data-fam="${l.fam}">
          <div class="lesson-num">${UNIT_META[l.unit].split(":")[0]} · Lesson ${l.num} ${done?"✅":""}</div>
          <div class="lesson-title">${l.title}</div>
          <p>${l.intro}</p>
        </div>
      `;
    }).join("");
    return `
      <div class="section-title">📖 Learn</div>
      <p class="gap-intro">Short, bite-sized lessons — a handful of concepts at a time with a quick check mixed in, so you never have to sit and read a wall of text.</p>
      <div class="lessons-grid">${cardsHtml}</div>
    `;
  }
  const meta = LESSON_META.find(l=>l.fam===state.learn.activeFam);
  const deck = state.learn.deck;
  const step = deck[state.learn.stepIdx];
  const stepsTotal = deck.length - 1; // exclude the "done" step from the count
  const progressBar = `<div class="learn-progress">${meta.title} · Step ${Math.min(state.learn.stepIdx+1, stepsTotal)} of ${stepsTotal}</div>`;

  if(!step || step.type==="done"){
    if(!progress.learnedLessons.includes(state.learn.activeFam)){
      progress.learnedLessons.push(state.learn.activeFam);
      saveProgress();
    }
    const lessons = getActiveLessons();
    const i = lessons.findIndex(l=>l.fam===state.learn.activeFam);
    const hasNext = i>=0 && i+1<lessons.length;
    return `
      <div class="center">
        <h3>✅ Lesson complete!</h3>
        <p>${meta.title}</p>
        <div class="row">
          ${hasNext ? `<button class="btn" id="learn-next-lesson">Next lesson →</button>` : ""}
          <button class="btn secondary" id="learn-back-list">Back to lessons</button>
        </div>
      </div>
    `;
  }

  if(step.type==="concept"){
    const t = step.term;
    return `
      ${progressBar}
      <div class="learn-card">
        <div class="learn-term">${t.term}</div>
        <p class="learn-def">${t.def}</p>
        <div class="learn-example">💡 ${t.hint}</div>
      </div>
      <div class="row"><button class="btn" id="learn-next">Next →</button></div>
    `;
  }

  if(step.type==="visual"){
    const fn = VIZ_RENDERERS[step.viz];
    return `
      ${progressBar}
      <div class="learn-visual-label">🎬 See it in action</div>
      <div class="viz-grid">${fn ? fn() : ""}</div>
      <div class="row"><button class="btn" id="learn-next">Next →</button></div>
    `;
  }

  if(step.type==="example"){
    const m = step.math;
    const revealed = state.learn.exampleRevealed;
    const totalSteps = m.steps.length;
    const stepsHtml = m.steps.slice(0, revealed).map((s,i)=>`<div class="example-step"><span class="example-step-num">${i+1}</span>${s}</div>`).join("");
    const allRevealed = revealed >= totalSteps;
    return `
      ${progressBar}
      <div class="learn-visual-label">🧮 Worked example</div>
      <div class="example-box">
        <div class="example-prompt">${m.prompt}</div>
        ${stepsHtml ? `<div class="example-steps">${stepsHtml}</div>` : ""}
        ${allRevealed ? `<div class="example-answer">✅ Answer: ${m.prefix||""}${m.answer}${m.suffix?" "+m.suffix:""}</div>` : ""}
      </div>
      <div class="row">
        ${allRevealed
          ? `<button class="btn" id="learn-next">Next →</button>`
          : `<button class="btn" id="learn-reveal-step" data-total="${totalSteps}">${revealed===0?"Show first step":"Show next step"}</button>`}
      </div>
    `;
  }

  // check step
  const q = step.quiz;
  const choicesHtml = q.choices.map((c,i)=>{
    let cls = "quiz-choice";
    if(state.learn.checkAnswered){
      cls += " disabled";
      if(i===q.answer) cls += " correct";
      else if(i===state.learn.checkSelected) cls += " incorrect";
    }
    return `<button class="${cls} learn-check-choice" data-idx="${i}" ${state.learn.checkAnswered?"disabled":""}>${c}</button>`;
  }).join("");
  return `
    ${progressBar}
    <div class="learn-check-label">✏️ Quick check</div>
    <div class="quiz-q">${q.q}</div>
    <div>${choicesHtml}</div>
    ${state.learn.checkAnswered ? `<div class="quiz-explain">💡 ${q.explain}</div><div class="row"><button class="btn" id="learn-next">Next →</button></div>` : ""}
  `;
}

/* ---- Term Recall (word bank shown, but you have to type the match yourself) ---- */
function prepRecallBank(){
  const r = state.recall;
  const card = r.deck[r.index];
  const pool = getActiveTerms().filter(t=>t.id!==card.id);
  const distractorCount = Math.min(4, pool.length);
  // Prefer distractors from the same concept family (e.g. other market-cap tiers,
  // other preferred stock types) so the bank is genuinely confusable, capped so
  // it doesn't get overwhelming, then top up with random terms if needed.
  const sameFamily = shuffle(pool.filter(t=>t.fam===card.fam));
  const others = shuffle(pool.filter(t=>t.fam!==card.fam));
  const maxSameFamily = Math.min(3, sameFamily.length, distractorCount);
  const picked = sameFamily.slice(0, maxSameFamily);
  const remainingNeeded = distractorCount - picked.length;
  picked.push(...others.slice(0, remainingNeeded));
  const distractors = picked.map(t=>t.term);
  r.currentBank = shuffle([card.term, ...distractors]);
  r.checked = false;
  r.lastInput = "";
  r.showHint = false;
}
function startRecall(){
  state.recall = {deck: shuffle(getActiveTerms()), index:0, score:0, checked:false, wasCloseMatch:false, currentBank:[], lastInput:"", showHint:false};
  if(state.recall.deck.length) prepRecallBank();
}
function renderRecall(){
  if(getActiveTerms().length===0) return `<div class="center"><p>No terms available. Select at least one unit above.</p></div>`;
  if(state.recall.deck.length===0) startRecall();
  const r = state.recall;
  if(r.index >= r.deck.length) return renderRecallDone();
  const card = r.deck[r.index];
  const known = progress.known.includes(card.id);
  const bankHtml = r.currentBank.map(t=>`<div class="bank-chip">${t}</div>`).join("");
  return `
    <div class="math-progress">
      <div>Term ${r.index+1} of ${r.deck.length} · Score ${r.score} ${known?"· ✅ previously mastered":""}</div>
    </div>
    <div class="math-card">
      <div class="math-prompt">🔎 ${card.def}</div>
      <div class="bank-label">Word bank — one of these matches. Type it out below:</div>
      <div class="word-bank">${bankHtml}</div>
      <div class="math-input-row">
        <input type="text" class="math-input" id="recall-input" style="width:280px;" placeholder="Type the matching term..." ${r.checked?"disabled":""} value="${r.checked ? (r.lastInput||"") : ""}"/>
        ${r.checked ? "" : `<button class="btn" id="recall-check">Check</button><button class="btn secondary small" id="recall-hint">💡 ${r.showHint?"Hide hint":"Hint"}</button>`}
      </div>
      ${(r.showHint && !r.checked) ? `<div class="hint-box">💡 ${card.hint || "No extra hint for this one — the definition above is your best clue."}</div>` : ""}
      ${r.checked ? `
        <div class="math-feedback ${r.wasCloseMatch?"correct":"incorrect"}">
          ${r.wasCloseMatch ? "✅ Correct!" : "🤔 Not quite."} The term is: <strong>${card.term}</strong>
        </div>
        ${!r.wasCloseMatch ? `<div class="hint-box">💡 Why: ${card.hint || card.def}</div>` : ""}
        <div class="row">
          <button class="btn" id="recall-know">✅ I knew it</button>
          <button class="btn secondary" id="recall-learning">📚 Still learning</button>
        </div>
      ` : ""}
    </div>
  `;
}
function renderRecallDone(){
  const r = state.recall;
  return `
    <div class="center">
      <h3>Recall practice complete!</h3>
      <div class="big-score">${r.score} / ${r.deck.length}</div>
      <div class="row">
        <button class="btn" id="recall-retry">Try again</button>
        <button class="btn secondary" id="recall-home">Back to home</button>
      </div>
    </div>
  `;
}
function checkRecallAnswer(){
  const r = state.recall;
  const card = r.deck[r.index];
  const inputEl = document.getElementById("recall-input");
  const raw = inputEl ? inputEl.value.trim() : "";
  r.lastInput = raw;
  r.checked = true;
  r.wasCloseMatch = isCloseMatch(raw, card.term);
  render();
}
function advanceRecall(markKnown){
  const r = state.recall;
  const card = r.deck[r.index];
  if(markKnown){
    if(!progress.known.includes(card.id)) progress.known.push(card.id);
    r.score++;
  } else {
    progress.known = progress.known.filter(id=>id!==card.id);
  }
  saveProgress();
  r.index++;
  if(r.index < r.deck.length) prepRecallBank();
  render();
  if(markKnown && r.score>0 && r.score%5===0) spawnConfetti();
}

/* ---- Confetti ---- */
function spawnConfetti(){
  const colors = ["#818cf8","#a78bfa","#f472b6","#22d3ee","#fbbf24","#22c55e"];
  for(let i=0;i<40;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random()*100 + "vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.8 + Math.random()*1.4) + "s";
    el.style.opacity = String(0.7 + Math.random()*0.3);
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3400);
  }
}

/* ================= HANDLERS ================= */
function attachHandlers(){
  document.querySelectorAll(".unit-chip").forEach(el=>{
    el.onclick = ()=>{
      const u = el.dataset.unit;
      if(state.activeUnits.has(u)) state.activeUnits.delete(u);
      else state.activeUnits.add(u);
      resetSessions();
      render();
    };
  });
  document.querySelectorAll(".nav-btn").forEach(el=>{
    el.onclick = ()=>{ switchMode(el.dataset.mode); };
  });
  document.querySelectorAll(".mode-card").forEach(el=>{
    el.onclick = ()=>{ switchMode(el.dataset.mode); };
  });

  const resetBtn = document.getElementById("reset-progress");
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm("Reset all saved progress (flashcard mastery, best times, best scores)?")){
      progress = {known:[], quizBest:{}, matchBest:{}, mathBestStreak:0, learnedLessons:[]};
      saveProgress();
      render();
    }
  };

  // Learn
  document.querySelectorAll(".lesson-card").forEach(el=>{
    el.onclick = ()=>{ startLesson(el.dataset.fam); render(); };
  });
  const learnNext = document.getElementById("learn-next");
  if(learnNext) learnNext.onclick = ()=>{ advanceLearn(); };
  const learnReveal = document.getElementById("learn-reveal-step");
  if(learnReveal) learnReveal.onclick = ()=>{ revealExampleStep(parseInt(learnReveal.dataset.total)); };
  document.querySelectorAll(".learn-check-choice").forEach(el=>{
    el.onclick = ()=>{ handleLearnCheck(parseInt(el.dataset.idx)); };
  });
  const learnBackList = document.getElementById("learn-back-list");
  if(learnBackList) learnBackList.onclick = ()=>{ state.learn.activeFam = null; render(); };
  const learnNextLesson = document.getElementById("learn-next-lesson");
  if(learnNextLesson) learnNextLesson.onclick = ()=>{ goToNextLesson(); };

  // Flashcards
  const flashEl = document.getElementById("flash-el");
  if(flashEl) flashEl.onclick = ()=>{ state.fc.flipped = !state.fc.flipped; render(); };
  const fcPrev = document.getElementById("fc-prev");
  if(fcPrev) fcPrev.onclick = ()=>{ if(state.fc.index>0){state.fc.index--; state.fc.flipped=false; render();} };
  const fcNext = document.getElementById("fc-next");
  if(fcNext) fcNext.onclick = ()=>{ advanceFlashcard(); };
  const fcKnow = document.getElementById("fc-know");
  if(fcKnow) fcKnow.onclick = ()=>{
    const card = state.fc.deck[state.fc.index];
    if(!progress.known.includes(card.id)) progress.known.push(card.id);
    saveProgress();
    advanceFlashcard();
  };
  const fcLearning = document.getElementById("fc-learning");
  if(fcLearning) fcLearning.onclick = ()=>{
    const card = state.fc.deck[state.fc.index];
    progress.known = progress.known.filter(id=>id!==card.id);
    saveProgress();
    advanceFlashcard();
  };
  const fcShuffle = document.getElementById("fc-shuffle");
  if(fcShuffle) fcShuffle.onclick = ()=>{ startFlashcards(); render(); };
  const unknownToggle = document.getElementById("unknown-toggle");
  if(unknownToggle) unknownToggle.onchange = (e)=>{ state.fc.unknownOnly = e.target.checked; startFlashcards(); render(); };

  // Matching
  document.querySelectorAll(".match-card").forEach(el=>{
    el.onclick = ()=>{ handleMatchClick(el.dataset.key); };
  });
  const matchRestart = document.getElementById("match-restart");
  if(matchRestart) matchRestart.onclick = ()=>{ startMatching(); render(); };
  const matchAgain = document.getElementById("match-again");
  if(matchAgain) matchAgain.onclick = ()=>{ startMatching(); render(); };

  // Quiz
  document.querySelectorAll(".quiz-count-btn").forEach(el=>{
    el.onclick = ()=>{ state.q.countChoice = el.dataset.count; render(); };
  });
  const quizStartBtn = document.getElementById("quiz-start-btn");
  if(quizStartBtn) quizStartBtn.onclick = ()=>{ startQuiz(); render(); };
  document.querySelectorAll("#quiz-choices .quiz-choice").forEach(el=>{
    el.onclick = ()=>{ handleQuizAnswer(parseInt(el.dataset.idx)); };
  });
  const quizNext = document.getElementById("quiz-next");
  if(quizNext) quizNext.onclick = ()=>{
    state.q.index++;
    state.q.answered = false;
    state.q.selectedIdx = null;
    render();
    if(state.q.index >= state.q.questions.length && state.q.score/state.q.questions.length >= 0.7){
      spawnConfetti();
    }
  };
  const quizRetry = document.getElementById("quiz-retry");
  if(quizRetry) quizRetry.onclick = ()=>{ startQuiz(); render(); };
  const quizRecount = document.getElementById("quiz-recount");
  if(quizRecount) quizRecount.onclick = ()=>{ state.q.awaitingStart = true; render(); };
  const quizHome = document.getElementById("quiz-home");
  if(quizHome) quizHome.onclick = ()=>{ switchMode("home"); };

  // Math word problems
  const mathInput = document.getElementById("math-answer-input");
  if(mathInput){
    mathInput.focus();
    mathInput.onkeydown = (e)=>{ if(e.key==="Enter"){ const btn=document.getElementById("math-check"); if(btn) btn.click(); } };
  }
  const mathCheck = document.getElementById("math-check");
  if(mathCheck) mathCheck.onclick = ()=>{ checkMathAnswer(); };
  const mathToggleSteps = document.getElementById("math-toggle-steps");
  if(mathToggleSteps) mathToggleSteps.onclick = ()=>{ state.math.showSteps = !state.math.showSteps; render(); };
  const mathNext = document.getElementById("math-next");
  if(mathNext) mathNext.onclick = ()=>{
    state.math.index++;
    state.math.checked = false;
    state.math.showSteps = false;
    state.math.lastInput = undefined;
    render();
  };
  const mathRetry = document.getElementById("math-retry");
  if(mathRetry) mathRetry.onclick = ()=>{ startMath(); render(); };
  const mathHome = document.getElementById("math-home");
  if(mathHome) mathHome.onclick = ()=>{ switchMode("home"); };

  // Term Recall
  const recallInput = document.getElementById("recall-input");
  if(recallInput){
    recallInput.focus();
    recallInput.onkeydown = (e)=>{ if(e.key==="Enter"){ const btn=document.getElementById("recall-check"); if(btn) btn.click(); } };
  }
  const recallCheck = document.getElementById("recall-check");
  if(recallCheck) recallCheck.onclick = ()=>{ checkRecallAnswer(); };
  const recallHint = document.getElementById("recall-hint");
  if(recallHint) recallHint.onclick = ()=>{ state.recall.showHint = !state.recall.showHint; render(); };
  const recallKnow = document.getElementById("recall-know");
  if(recallKnow) recallKnow.onclick = ()=>{ advanceRecall(true); };
  const recallLearning = document.getElementById("recall-learning");
  if(recallLearning) recallLearning.onclick = ()=>{ advanceRecall(false); };
  const recallRetry = document.getElementById("recall-retry");
  if(recallRetry) recallRetry.onclick = ()=>{ startRecall(); render(); };
  const recallHome = document.getElementById("recall-home");
  if(recallHome) recallHome.onclick = ()=>{ switchMode("home"); };

  // Tips & Visuals
  document.querySelectorAll("[data-viz]").forEach(el=>{
    el.onclick = ()=>{ handleVizAction(el.dataset.viz); };
  });
}

function handleVizAction(action){
  if(action==="rates-up"){ state.viz.rates="up"; render(); }
  else if(action==="rates-down"){ state.viz.rates="down"; render(); }
  else if(action==="yield-discount"){ state.viz.yieldType="discount"; render(); }
  else if(action==="yield-par"){ state.viz.yieldType="par"; render(); }
  else if(action==="yield-premium"){ state.viz.yieldType="premium"; render(); }
  else if(action==="split-start"){ state.viz.splitPreset="start"; render(); }
  else if(action==="split-forward"){ state.viz.splitPreset="split"; render(); }
  else if(action==="split-reverse"){ state.viz.splitPreset="reverse"; render(); }
  else if(action==="derp-play"){ playDerpSequence(); }
  else if(action==="derp-reset"){ state.viz.derpStep=0; render(); }
  else if(action==="waterfall-play"){ playWaterfallSequence(); }
  else if(action==="waterfall-reset"){ state.viz.waterfallStep=0; render(); }
  else if(action.startsWith("cap-select-")){ state.viz.capSelect = action.replace("cap-select-",""); render(); }
  else if(action.startsWith("rating-select-")){ state.viz.ratingSelect = action.replace("rating-select-",""); render(); }
}

function playDerpSequence(){
  state.viz.derpStep = 0;
  render();
  let step = 0;
  const iv = setInterval(()=>{
    step++;
    state.viz.derpStep = step;
    render();
    if(step>=4) clearInterval(iv);
  }, 650);
}

function playWaterfallSequence(){
  state.viz.waterfallStep = 0;
  render();
  let step = 0;
  const iv = setInterval(()=>{
    step++;
    state.viz.waterfallStep = step;
    render();
    if(step>=WATERFALL_TIERS.length) clearInterval(iv);
  }, 650);
}

function switchMode(mode){
  if(state.m.timer){ clearInterval(state.m.timer); state.m.timer=null; }
  state.mode = mode;
  if(mode==="flashcards") startFlashcards();
  if(mode==="matching") startMatching();
  if(mode==="quiz") state.q.awaitingStart = true;
  if(mode==="math") startMath();
  if(mode==="recall") startRecall();
  if(mode==="learn") state.learn.activeFam = null;
  render();
}

function checkMathAnswer(){
  const m = state.math;
  const p = m.problems[m.index];
  const inputEl = document.getElementById("math-answer-input");
  const raw = inputEl ? inputEl.value.trim() : "";
  const val = parseFloat(raw.replace(/[,$%]/g,""));
  m.lastInput = raw;
  m.checked = true;
  const correct = !isNaN(val) && numbersClose(val, p.answer, p.tolerance);
  m.wasCorrect = correct;
  if(correct){
    m.score++;
    m.streak++;
    if(m.streak > m.bestStreak) m.bestStreak = m.streak;
    if(m.streak>0 && m.streak%3===0) spawnConfetti();
  } else {
    m.streak = 0;
  }
  render();
}

function resetSessions(){
  state.fc.deck = [];
  state.m.cards = [];
  if(state.m.timer){ clearInterval(state.m.timer); state.m.timer=null; }
  state.q.questions = [];
  state.q.awaitingStart = true;
  state.math.problems = [];
  state.recall.deck = [];
  state.learn.activeFam = null;
}

function advanceFlashcard(){
  state.fc.flipped = false;
  if(state.fc.index < state.fc.deck.length-1) state.fc.index++;
  else state.fc.index = 0;
  render();
}

function handleMatchClick(key){
  const m = state.m;
  const card = m.cards.find(c=>c.key===key);
  if(!card || card.matched) return;
  if(m.selected && m.selected.key===key) return;

  if(!m.selected){
    m.selected = card;
    render();
    return;
  }
  m.moves++;
  const first = m.selected;
  if(first.pairId===card.pairId && first.type!==card.type){
    first.matched = true;
    card.matched = true;
    m.matchedPairs++;
    m.selected = null;
    if(m.matchedPairs===m.totalPairs){
      m.done = true;
      clearInterval(m.timer);
      const key2 = activeUnitKey();
      const best = progress.matchBest[key2];
      if(!best || m.elapsed < best){ progress.matchBest[key2] = m.elapsed; saveProgress(); }
      spawnConfetti();
    }
    render();
  } else {
    card.wrong = true;
    first.wrong = true;
    m.selected = null;
    render();
    setTimeout(()=>{
      card.wrong = false;
      first.wrong = false;
      render();
    }, 500);
  }
}

function handleQuizAnswer(idx){
  const q = state.q;
  if(q.answered) return;
  q.answered = true;
  q.selectedIdx = idx;
  const current = q.questions[q.index];
  const chosen = current.shuffledChoices[idx];
  if(chosen.correct){
    q.score++;
  } else {
    const correctChoice = current.shuffledChoices.find(c=>c.correct);
    q.wrong.push({q:current.q, chosen:chosen.text, correct:correctChoice.text});
  }
  render();
}

/* ================= INIT ================= */
render();
</script>
