<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIE Study Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1e1b4b; --bg2:#312e81; --accent:#818cf8; --accent2:#a78bfa;
    --card:#ffffff; --card-back:#4f46e5; --text:#1e1b2e; --muted:#6b7280;
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --gold:#fbbf24;
    --pink:#f472b6; --cyan:#22d3ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(120deg,var(--bg1),var(--bg2) 45%,#5b21b6 75%,#3730a3);
    background-size:300% 300%;
    animation:bgShift 18s ease infinite;
    background-attachment:fixed;
    min-height:100vh; color:#f1f5f9;
    overflow-x:hidden;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(129,140,248,.18), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(244,114,182,.14), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(34,211,238,.12), transparent 45%);
  }
  #app{max-width:1000px; margin:0 auto; padding:20px 16px 60px; position:relative; z-index:1;}
  h1{
    font-size:2.1rem; font-weight:900; margin:6px 0 2px; text-align:center; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--cyan),var(--accent2),var(--pink),var(--gold));
    background-size:300% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:titleGlow 6s linear infinite;
    filter:drop-shadow(0 2px 12px rgba(129,140,248,.35));
  }
  @keyframes titleGlow{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }
  .subtitle{text-align:center; color:#c7d2fe; margin-bottom:18px; font-size:.95rem;}
  .unit-bar{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px;
  }
  .unit-chip{
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.25);
    padding:7px 14px; border-radius:20px; cursor:pointer; font-size:.85rem;
    user-select:none; transition:.15s; color:#e0e7ff;
  }
  .unit-chip.active{background:var(--accent); border-color:var(--accent); color:#1e1b4b; font-weight:600; box-shadow:0 0 14px rgba(129,140,248,.6);}
  .unit-chip.locked{background:#6b7280; border-color:#6b7280; color:#e5e7eb; cursor:not-allowed; box-shadow:none; opacity:.85;}
  .nav-bar{display:flex; gap:10px; justify-content:center; margin-bottom:22px; flex-wrap:wrap;}
  .nav-btn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.2); color:#f1f5f9;
    padding:9px 17px; border-radius:12px; cursor:pointer; font-size:.9rem; font-weight:600;
    transition:.2s; font-family:inherit;
  }
  .nav-btn:hover{background:rgba(255,255,255,.14); transform:translateY(-2px);}
  .nav-btn.active{
    background:linear-gradient(135deg,var(--accent2),var(--pink));
    color:#1e1b4b; font-weight:800; border-color:transparent;
    box-shadow:0 4px 18px rgba(167,139,250,.5); transform:translateY(-2px);
  }
  .card-panel{
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.14);
    border-radius:20px; padding:24px; backdrop-filter:blur(8px);
    box-shadow:0 8px 40px rgba(0,0,0,.25);
  }
  .home-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;}
  .mode-card{
    background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:22px; text-align:center;
    cursor:pointer; transition:.25s cubic-bezier(.34,1.56,.64,1); position:relative; overflow:hidden;
  }
  .mode-card::after{
    content:""; position:absolute; inset:0; border-radius:18px; padding:1px;
    background:linear-gradient(135deg,var(--cyan),var(--pink),var(--gold));
    opacity:0; transition:.25s;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  .mode-card:hover{transform:translateY(-6px) scale(1.02); box-shadow:0 12px 30px rgba(129,140,248,.35);}
  .mode-card:hover::after{opacity:1;}
  .mode-card .emoji{font-size:2.6rem; display:block; margin-bottom:8px; filter:drop-shadow(0 2px 8px rgba(0,0,0,.3));}
  .mode-card h3{margin:4px 0 6px;}
  .mode-card p{color:#c7d2fe; font-size:.85rem; margin:0 0 8px;}
  .mode-card .stat{font-size:.8rem; color:var(--gold); font-weight:700;}
  .btn{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1e1b4b; border:none; padding:11px 22px;
    border-radius:12px; font-weight:800; cursor:pointer; font-size:.9rem;
    transition:.18s; box-shadow:0 4px 14px rgba(129,140,248,.35); font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03); box-shadow:0 6px 20px rgba(129,140,248,.55);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn.secondary{background:rgba(255,255,255,.1); color:#f1f5f9; border:1px solid rgba(255,255,255,.28); box-shadow:none;}
  .btn.secondary:hover{background:rgba(255,255,255,.18); box-shadow:0 4px 14px rgba(255,255,255,.12);}
  .btn.small{padding:7px 14px; font-size:.8rem;}
  .btn:disabled{opacity:.4; cursor:default; transform:none; box-shadow:none;}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
  .top-controls{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;}
  .progress-bar{background:rgba(255,255,255,.12); border-radius:8px; height:8px; overflow:hidden; margin:10px 0;}
  .progress-fill{background:var(--gold); height:100%; transition:.3s;}

  /* Flashcards */
  .flash-wrap{display:flex; flex-direction:column; align-items:center;}
  .flashcard{
    width:100%; max-width:520px; height:280px; perspective:1200px; cursor:pointer; margin:10px auto;
  }
  .flashcard-inner{
    position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; width:100%; height:100%; backface-visibility:hidden;
    border-radius:18px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:28px; font-size:1.25rem; font-weight:600; color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .flash-face.front{background:linear-gradient(145deg,#fff,#e0e7ff);}
  .flash-face.back{background:linear-gradient(145deg,#c7d2fe,#a5b4fc); transform:rotateY(180deg); font-weight:500; font-size:1.05rem;}
  .flash-tag{position:absolute; top:12px; left:16px; font-size:.7rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .flash-hint{color:#c7d2fe; font-size:.8rem; margin-top:8px;}

  /* Matching */
  .match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;}
  @media(max-width:640px){.match-grid{grid-template-columns:repeat(2,1fr);}}
  .match-card{
    background:var(--card); color:var(--text); border-radius:12px; padding:12px;
    min-height:90px; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:.82rem; font-weight:600; cursor:pointer; border:3px solid transparent;
    transition:.15s; box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .match-card.def{font-weight:400; font-size:.78rem; background:#eef2ff;}
  .match-card.selected{border-color:var(--accent); transform:scale(1.03);}
  .match-card.wrong{border-color:var(--bad); animation:shake .3s;}
  .match-card.matched{background:var(--good); color:#fff; opacity:.55; cursor:default; box-shadow:none;}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .match-stats{display:flex; justify-content:center; gap:24px; margin-bottom:6px; font-weight:700; color:var(--gold);}

  /* Quiz */
  .quiz-q{font-size:1.1rem; font-weight:600; margin-bottom:16px;}
  .quiz-choice{
    display:block; width:100%; text-align:left; background:rgba(255,255,255,.07);
    border:1.5px solid rgba(255,255,255,.2); color:#f1f5f9; padding:12px 16px;
    border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:.92rem;
  }
  .quiz-choice.correct{background:var(--good); border-color:var(--good); color:#fff; font-weight:700;}
  .quiz-choice.incorrect{background:var(--bad); border-color:var(--bad); color:#fff; font-weight:700;}
  .quiz-choice.disabled{cursor:default;}
  .quiz-explain{background:rgba(255,255,255,.08); border-radius:10px; padding:12px 16px; margin-top:8px; font-size:.85rem; color:#e0e7ff;}
  .quiz-progress{color:#c7d2fe; font-size:.85rem; margin-bottom:8px;}

  .results-list{text-align:left; margin-top:14px;}
  .result-item{background:rgba(255,255,255,.06); border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:.85rem;}
  .result-item .rq{font-weight:700; margin-bottom:4px;}
  .result-item .ra{color:var(--bad);}
  .result-item .rc{color:var(--good);}
  .big-score{font-size:2.6rem; font-weight:800; text-align:center; color:var(--gold); margin:8px 0;}
  .center{text-align:center;}
  footer{text-align:center; color:#a5b4fc; font-size:.75rem; margin-top:24px;}

  /* Tips & Visuals */
  .section-title{font-size:1.05rem; font-weight:700; margin:6px 0 12px; color:#fff;}
  .tips-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:28px;}
  .tip-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:14px 16px;}
  .tip-card .tip-unit{font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; color:#a5b4fc; font-weight:700;}
  .tip-card .tip-mnemonic{font-weight:800; color:var(--gold); font-size:.95rem; margin:4px 0 6px;}
  .tip-card p{margin:0; font-size:.82rem; color:#e0e7ff; line-height:1.4;}
  .gap-intro{font-size:.85rem; color:#c7d2fe; line-height:1.5; margin:0 0 18px;}
  .gaps-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;}
  .gap-card{background:rgba(255,255,255,.06); border:1px solid rgba(244,114,182,.35); border-radius:14px; padding:14px 16px;}
  .gap-card .gap-unit{font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; color:var(--pink); font-weight:700;}
  .gap-card .gap-title{font-weight:800; color:#fff; font-size:.95rem; margin:4px 0 6px;}
  .gap-card p{margin:0 0 8px; font-size:.82rem; color:#e0e7ff; line-height:1.4;}
  .gap-card .gap-ref{font-size:.7rem; color:#a5b4fc; font-style:italic;}
  .lessons-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px;}
  .lesson-card{background:rgba(255,255,255,.06); border:1px solid rgba(129,140,248,.35); border-radius:14px; padding:14px 16px; cursor:pointer; transition:transform .15s, background .15s;}
  .lesson-card:hover{background:rgba(255,255,255,.1); transform:translateY(-2px);}
  .lesson-card.done{border-color:rgba(34,197,94,.5);}
  .lesson-card .lesson-num{font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; color:#a5b4fc; font-weight:700;}
  .lesson-card .lesson-title{font-weight:800; color:#fff; font-size:1rem; margin:4px 0 6px;}
  .lesson-card p{margin:0; font-size:.82rem; color:#e0e7ff; line-height:1.4;}
  .learn-progress{font-size:.78rem; color:#a5b4fc; margin-bottom:10px; font-weight:600; letter-spacing:.3px;}
  .learn-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:28px 24px; text-align:center; margin-bottom:16px;}
  .learn-card .learn-term{font-size:1.5rem; font-weight:800; color:var(--gold); margin-bottom:10px;}
  .learn-card .learn-def{font-size:1rem; color:#e0e7ff; line-height:1.5; margin:0 0 16px;}
  .learn-card .learn-example{background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.3); border-radius:10px; padding:12px 14px; font-size:.85rem; color:#cffafe; text-align:left;}
  .learn-check-label{font-size:.8rem; color:var(--pink); font-weight:700; margin-bottom:6px;}

  .viz-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;}
  .viz-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:16px; padding:16px;}
  .viz-card h4{margin:0 0 4px; font-size:.95rem;}
  .viz-card .viz-desc{font-size:.78rem; color:#c7d2fe; margin:0 0 10px;}
  .viz-stage{
    background:rgba(0,0,0,.22); border-radius:12px; padding:16px 10px 10px;
    min-height:180px; display:flex; align-items:flex-end; justify-content:center;
    gap:16px; position:relative; overflow:hidden;
  }
  .viz-controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px;}

  /* seesaw bars */
  .bar-col{display:flex; flex-direction:column; align-items:center; gap:6px; width:64px;}
  .bar{width:36px; background:linear-gradient(180deg,var(--accent2),var(--accent)); border-radius:6px 6px 0 0; transition:height .8s cubic-bezier(.4,0,.2,1); height:40px;}
  .bar-label{font-size:.68rem; color:#c7d2fe; text-align:center;}
  .bar-val{font-size:.68rem; font-weight:700; color:#fff;}

  /* DERP timeline */
  .timeline{display:flex; align-items:flex-start; justify-content:space-between; width:100%; padding:20px 6px 0; position:relative;}
  .timeline::before{content:""; position:absolute; top:37px; left:24px; right:24px; height:3px; background:rgba(255,255,255,.2);}
  .tl-node{display:flex; flex-direction:column; align-items:center; gap:6px; z-index:1; width:25%;}
  .tl-dot{width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.75rem; transition:.4s; border:2px solid rgba(255,255,255,.3); color:#fff;}
  .tl-dot.hit{background:var(--gold); color:#1e1b4b; border-color:var(--gold); transform:scale(1.2);}
  .tl-label{font-size:.62rem; color:#c7d2fe; text-align:center;}

  /* waterfall */
  .waterfall{display:flex; flex-direction:column; gap:7px; width:100%;}
  .tier{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:8px 10px; font-size:.75rem; text-align:left; position:relative; overflow:hidden;}
  .tier .fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:rgba(34,197,94,.55); transition:width 1s ease;}
  .tier span{position:relative; z-index:1;}

  /* split visualizer */
  .split-grid{display:grid; gap:5px; transition:.5s;}
  .split-sq{background:var(--gold); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:800; color:#1e1b4b; transition:.5s; aspect-ratio:1;}
  .split-info{font-size:.8rem; color:#fff; font-weight:700; margin-top:8px; text-align:center;}

  /* ratings ladder */
  .rating-ladder{display:flex; flex-direction:column; gap:4px;}
  .rating-rung{display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:8px; cursor:pointer; font-size:.78rem; font-weight:700; color:#fff; border:2px solid transparent; transition:.2s;}
  .rating-rung.investment{background:rgba(34,197,94,.18);}
  .rating-rung.junk{background:rgba(239,68,68,.18);}
  .rating-rung.selected{border-color:#fff;}
  .rating-rung .rr-sp{width:40px;}
  .rating-rung .rr-moody{width:40px; opacity:.75;}
  .rating-rung .rr-cutoff{font-size:.65rem; font-weight:600; color:var(--gold); margin-left:auto;}

  .learn-visual-label{font-size:.8rem; color:var(--cyan); font-weight:700; margin-bottom:6px;}
  .example-box{background:rgba(255,255,255,.06); border:1px solid rgba(251,191,36,.35); border-radius:14px; padding:16px;}
  .example-prompt{font-size:.9rem; color:#fff; margin-bottom:10px; line-height:1.4;}
  .example-steps{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
  .example-step{display:flex; gap:8px; font-size:.82rem; color:#e0e7ff; background:rgba(0,0,0,.18); border-radius:8px; padding:8px 10px; align-items:flex-start;}
  .example-step-num{background:var(--gold); color:#1e1b4b; font-weight:800; font-size:.7rem; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
  .example-answer{font-size:.9rem; font-weight:800; color:var(--good); margin-top:4px;}

  /* Math word problems */
  .math-progress{color:#c7d2fe; font-size:.85rem; margin-bottom:6px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;}
  .math-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:20px;}
  .math-prompt{font-size:1.02rem; line-height:1.5; margin-bottom:16px; font-weight:500;}
  .math-input-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center;}
  .math-input{
    font-family:'Space Mono',monospace; font-size:1.1rem; padding:10px 14px; border-radius:10px;
    border:1.5px solid rgba(255,255,255,.3); background:rgba(255,255,255,.9); color:#1e1b2e;
    width:160px; text-align:center;
  }
  .math-input:focus{outline:2px solid var(--accent2);}
  .math-feedback{margin-top:14px; padding:12px 16px; border-radius:12px; font-weight:700; text-align:center;}
  .math-feedback.correct{background:rgba(34,197,94,.2); border:1px solid var(--good); color:#bbf7d0;}
  .math-feedback.incorrect{background:rgba(239,68,68,.2); border:1px solid var(--bad); color:#fecaca;}
  .math-steps{background:rgba(255,255,255,.07); border-radius:12px; padding:14px 18px; margin-top:12px; font-size:.85rem; color:#e0e7ff;}
  .math-steps ol{margin:6px 0 0; padding-left:20px;}
  .math-steps li{margin-bottom:5px;}
  .streak-badge{display:inline-block; background:linear-gradient(135deg,var(--gold),#f59e0b); color:#1e1b4b; font-weight:800; padding:4px 12px; border-radius:20px; font-size:.78rem;}

  /* Term Recall word bank */
  .bank-label{font-size:.72rem; color:#c7d2fe; text-align:center; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
  .word-bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px;}
  .bank-chip{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); border-radius:10px;
    padding:8px 14px; font-size:.85rem; font-weight:600; color:#e0e7ff;
  }
  .hint-box{background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.5); border-radius:10px; padding:10px 14px; margin:10px 0; font-size:.82rem; color:#fde68a; text-align:left;}

  /* Confetti */
  .confetti-piece{
    position:fixed; top:-20px; width:9px; height:14px; z-index:999; pointer-events:none;
    animation:confettiFall linear forwards; border-radius:2px;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(720deg); opacity:.2; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>🎮 SIE Study Arcade</h1>
  <div class="subtitle">Flashcards · Matching · Quiz — built from your notes</div>
  <div id="screen"></div>
  <footer>Progress is saved in this browser. Ask for more units to be added anytime.</footer>
</div>

<script>
/* ================= DATA ================= */
const UNIT_META = {
  u1: "Unit 1: Equity Securities",
  u2: "Unit 2: Equity Types & Corporate Actions",
  u3: "Unit 3: Debt Securities"
};

const TERMS = [
  // ---- Unit 1 ----
  {id:"u1-1", unit:"u1", fam:"u1-common", term:"Security", def:"An intangible financial asset that can be bought, sold, or gifted (stocks, bonds, mutual funds, options, etc.).", hint:"Example: stocks, bonds, and mutual fund shares all count \u2014 but gold bars or a share of your grandma's antique car do not."},
  {id:"u1-2", unit:"u1", fam:"u1-common", term:"Common stock", def:"Basic ownership in a company. Gives voting rights, possible dividends, and capital appreciation.", hint:"If you own 10 of a company's 1,000 shares, you'd get to vote on things like board elections \u2014 that ownership stake is this."},
  {id:"u1-3", unit:"u1", fam:"u1-common", term:"Preferred stock", def:"Equity with debt-like features. Usually no voting rights, but pays a fixed dividend before common stockholders.", hint:"Picture a stock that acts almost like a bond: it pays you a set amount every quarter, but you rarely get a vote."},
  {id:"u1-4", unit:"u1", fam:"u1-common", term:"Capital appreciation", def:"Increase in an investment's value over time (e.g., stock price rising).", hint:"Example: you buy a stock at $40, it climbs to $65 \u2014 that $25 jump is this kind of gain."},
  {id:"u1-5", unit:"u1", fam:"u1-common", term:"Market capitalization", def:"Company value = outstanding shares × current market price.", hint:"Example: a company with 2 million shares trading at $50 each has one of these worth $100 million."},
  {id:"u1-6", unit:"u1", fam:"u1-common", term:"Authorized stock", def:"The maximum number of shares a company is legally allowed to issue, set in its corporate charter.", hint:"Think of it as a hard cap written into the company's founding paperwork \u2014 they legally can't issue more than this number without amending it."},
  {id:"u1-7", unit:"u1", fam:"u1-common", term:"Issued stock", def:"Authorized shares that have been sold to investors.", hint:"Of a company's legal share ceiling, this is the portion that's actually been handed out to real investors so far."},
  {id:"u1-8", unit:"u1", fam:"u1-common", term:"Outstanding stock", def:"Shares issued and currently held by investors. Outstanding = Issued − Treasury.", hint:"Example: a company issued 500,000 shares, bought back 50,000 of them \u2014 450,000 remain in this category."},
  {id:"u1-9", unit:"u1", fam:"u1-common", term:"Treasury stock", def:"Shares a company issued and later bought back. No voting rights, no dividends, not counted as outstanding.", hint:"Picture a company buying its own stock off the market and just holding onto it \u2014 no vote, no dividend, just sitting there."},
  {id:"u1-10", unit:"u1", fam:"u1-common", term:"Large cap stock", def:"Market cap of $10B+. Usually stable, established, blue-chip, steady dividends.", hint:"Example: a household-name company worth $50 billion falls into this size bucket."},
  {id:"u1-11", unit:"u1", fam:"u1-common", term:"Mid cap stock", def:"Market cap of $2B–$10B. Mix of growth and stability.", hint:"Example: a company worth around $5 billion \u2014 bigger than a startup, smaller than a giant \u2014 lands here."},
  {id:"u1-12", unit:"u1", fam:"u1-common", term:"Small cap stock", def:"Market cap of $250M–$2B. Growth-oriented, usually pays few or no dividends.", hint:"Example: a scrappy $800 million company that plows its cash into growth instead of dividends fits here."},
  {id:"u1-13", unit:"u1", fam:"u1-common", term:"Penny stock", def:"An unlisted security trading below $5/share. Highly speculative and risky.", hint:"Example: a stock trading at $1.20 with no exchange listing \u2014 high risk, high speculation territory."},
  {id:"u1-14", unit:"u1", fam:"u1-common", term:"Established customer (penny stock rules)", def:"Someone with a 1+ year account that deposited funds/securities, OR made 3 penny stock purchases of different issuers on different days. Exempt from the suitability statement, but disclosure rules still apply.", hint:"Example: someone who's had a brokerage account open with deposits for 14 months qualifies for this status."},
  {id:"u1-15", unit:"u1", fam:"u1-common", term:"Unsolicited penny stock transaction", def:"A trade the customer initiates themselves — exempt from the suitability statement and disclosure rules that apply to recommended trades.", hint:"Picture a customer calling their broker and saying 'buy me 500 shares of this penny stock' \u2014 no recommendation involved."},
  {id:"u1-16", unit:"u1", fam:"u1-dividends", term:"Cash dividend", def:"Usually paid by check or deposit; normally quarterly; taxed in the year received.", hint:"Example: $50 just shows up in your brokerage account every quarter \u2014 no extra shares, just money."},
  {id:"u1-17", unit:"u1", fam:"u1-dividends", term:"Qualified dividend", def:"A dividend taxed at lower, favorable IRS capital-gains rates.", hint:"This type gets taxed at the friendlier long-term capital-gains rate instead of your regular income rate."},
  {id:"u1-18", unit:"u1", fam:"u1-dividends", term:"Nonqualified dividend", def:"A dividend taxed as ordinary income.", hint:"This type gets taxed exactly like your paycheck \u2014 no special rate break."},
  {id:"u1-19", unit:"u1", fam:"u1-dividends", term:"Stock dividend", def:"Extra shares given instead of cash. Lowers cost basis per share; not taxable when received.", hint:"Example: own 100 shares, get a 10% dividend of this kind, now you own 110 \u2014 no cash changed hands, no tax bill either."},
  {id:"u1-20", unit:"u1", fam:"u1-dividends", term:"DERP (dividend dates)", def:"The order of dividend dates: Declaration, Ex-dividend, Record, Payable.", hint:"Think of the 4 letters as a to-do list order: announce it, cut it off, snapshot the owners, then pay."},
  {id:"u1-21", unit:"u1", fam:"u1-dividends", term:"Declaration date", def:"The date the board of directors approves a dividend and announces the amount, record date, and payable date.", hint:"Picture the board of directors in a meeting saying 'we're paying $1/share, here's the schedule' \u2014 that announcement is this."},
  {id:"u1-22", unit:"u1", fam:"u1-dividends", term:"Ex-dividend date", def:"Set by FINRA or the exchange. Buy before this date to receive the dividend; buy on/after it and the seller keeps the dividend.", hint:"Example: buy the stock the day before this date, you get paid; buy the day of or after, the seller keeps the dividend."},
  {id:"u1-23", unit:"u1", fam:"u1-dividends", term:"Record date", def:"Investors listed as owners on this date receive the dividend.", hint:"Picture a company taking a snapshot of its shareholder list on this date \u2014 whoever's in the photo gets paid."},
  {id:"u1-24", unit:"u1", fam:"u1-dividends", term:"Payable date", def:"The date the dividend is actually paid to shareholders; investors are taxed based on this date/year.", hint:"This is the day the dividend check or deposit actually shows up, not just when it was announced."},
  {id:"u1-25", unit:"u1", fam:"u1-dividends", term:"Statutory voting", def:"Shareholder gets 1 vote per share for each board seat; votes cannot be combined. Benefits larger shareholders.", hint:"Example: with 100 shares and 3 board seats, you can cast at most 100 votes for any single seat \u2014 no stacking allowed."},
  {id:"u1-26", unit:"u1", fam:"u1-dividends", term:"Cumulative voting", def:"Shareholder can combine all their votes and cast them however they want. Benefits smaller shareholders.", hint:"Example: with 100 shares and 3 board seats, you get 300 total votes and could dump all 300 on one candidate."},
  {id:"u1-27", unit:"u1", fam:"u1-dividends", term:"Preemptive rights", def:"The right of existing shareholders to buy newly issued shares first, to maintain their proportionate ownership.", hint:"Example: you own 10% of a company; it issues new shares, and you get first crack at buying enough to stay at 10%."},
  {id:"u1-28", unit:"u1", fam:"u1-dividends", term:"Limited liability", def:"Shareholders can only lose the amount they invested; personal assets are protected from company debts.", hint:"Example: the company goes bankrupt owing millions \u2014 the most a shareholder loses is what they paid for their shares, nothing more."},
  {id:"u1-29", unit:"u1", fam:"u1-dividends", term:"Equity bankruptcy priority", def:"At dissolution, debtholders are paid first, then preferred stockholders, then common stockholders (last, if anything is left).", hint:"Picture a liquidation line: bondholders get paid first, then preferred stockholders, then common stockholders if anything's left."},
  {id:"u1-30", unit:"u1", fam:"u1-preferred", term:"Preferred stock par value", def:"Assume $100 par value for preferred stock on the exam (vs. $1,000 for bonds).", hint:"On this exam, if a question doesn't say otherwise, assume this stock's face value is $100 \u2014 not the $1,000 bonds use."},
  {id:"u1-31", unit:"u1", fam:"u1-preferred", term:"Straight (noncumulative) preferred", def:"No special features; missed dividends are lost and never made up.", hint:"Example: the company skips your dividend this quarter \u2014 with this type, that payment is gone for good, never made up."},
  {id:"u1-32", unit:"u1", fam:"u1-preferred", term:"Cumulative preferred", def:"Unpaid dividends accrue as 'dividends in arrears' and must be paid — plus the current dividend — before common gets paid.", hint:"Example: the company skips 2 years of dividends \u2014 with this type, they owe you both years back before common stockholders see a dime."},
  {id:"u1-33", unit:"u1", fam:"u1-preferred", term:"Callable preferred", def:"Issuer can buy back the stock at a stated price after a specific date; dividends stop on the call date.", hint:"Example: the issuer announces 'we're buying this stock back at $102 starting next year' \u2014 your dividends stop the day they do."},
  {id:"u1-34", unit:"u1", fam:"u1-preferred", term:"Convertible preferred", def:"Can be exchanged for a fixed number of common shares. Lower stated dividend; price tracks the common stock.", hint:"Example: you can trade one share of this for 4 shares of common stock whenever you want \u2014 its price tends to follow the common stock up and down."},
  {id:"u1-35", unit:"u1", fam:"u1-preferred", term:"Adjustable-rate (variable) preferred", def:"Pays a variable dividend tied to a benchmark like T-bills. Not appropriate for investors wanting fixed income.", hint:"Example: this stock's dividend resets every quarter based on the current T-bill rate \u2014 not a fixed number you can count on."},
  {id:"u1-36", unit:"u1", fam:"u1-preferred", term:"Participating preferred", def:"Pays a fixed dividend plus possible extra dividends declared by the board of directors.", hint:"Example: this stock pays its normal 5% dividend, but in a great year the board tacks on an extra bonus payment too."},

  // ---- Unit 2 ----
  {id:"u2-1", unit:"u2", fam:"u2-adr", term:"ADR (American Depositary Receipt)", def:"A U.S. security representing shares of a foreign company, held on deposit by a U.S. bank; trades in USD on U.S. markets.", hint:"Example: you want to own shares of a Japanese electronics company without opening a Japanese brokerage account or converting yen \u2014 a U.S. bank packages it for you in USD."},
  {id:"u2-2", unit:"u2", fam:"u2-adr", term:"ADR risks", def:"Currency risk and political risk of the foreign country, plus normal market/business/value risk. Value rises and falls with the underlying foreign stock.", hint:"Example: even though you bought this in USD on a U.S. exchange, if the yen crashes or Japan's economy tanks, your investment still takes the hit."},
  {id:"u2-3", unit:"u2", fam:"u2-adr", term:"ADR voting rights", def:"The depositary bank is not required to pass through voting or preemptive rights to ADR holders.", hint:"Example: the foreign company holds a shareholder vote, but the U.S. bank holding your shares isn't required to pass your vote along."},
  {id:"u2-4", unit:"u2", fam:"u2-rule144", term:"Rule 144", def:"SEC rule (Securities Act of 1933) covering trading restrictions on restricted stock and control stock.", hint:"Think of this as the rulebook the SEC wrote specifically to control how company insiders and holders of private-deal stock can sell."},
  {id:"u2-5", unit:"u2", fam:"u2-rule144", term:"Restricted stock", def:"Unregistered securities (e.g., from a private placement). Must be held/fully paid for 6 months before it can be sold.", hint:"Example: you bought shares in a private placement deal \u2014 you're legally stuck holding them for at least 6 months before you can sell."},
  {id:"u2-6", unit:"u2", fam:"u2-rule144", term:"Restrictive legend", def:"Wording on a restricted stock certificate warning of the holding-period restriction.", hint:"Picture a stamp of fine print right on the stock certificate warning 'this can't be sold for 6 months.'"},
  {id:"u2-7", unit:"u2", fam:"u2-rule144", term:"Control stock", def:"Registered shares held by control persons/insiders (officers, directors, 10%+ owners). Subject to Rule 144 volume limits when sold.", hint:"Example: the company's CFO owns registered shares \u2014 even though they're registered, selling them is still capped because of who owns them."},
  {id:"u2-8", unit:"u2", fam:"u2-rule144", term:"Control person (affiliate)", def:"An officer, director, or anyone who owns/controls 10%+ of a company; all family holdings are combined when counting the 10%.", hint:"Example: a director owns 6% and their spouse owns 5% \u2014 combined, that's 11%, making both of them this."},
  {id:"u2-9", unit:"u2", fam:"u2-rule144", term:"Form 144", def:"Filed when a control person wants to sell shares; used to calculate how many shares can be sold during a 90-day period.", hint:"Picture an insider filling out SEC paperwork before they're allowed to sell a big chunk of their shares."},
  {id:"u2-10", unit:"u2", fam:"u2-rule144", term:"Form 144 volume limit", def:"The greater of 1% of outstanding shares, or the average weekly trading volume over the most recent 4 weeks.", hint:"Example: 1% of shares outstanding is 50,000, but the last 4 weeks averaged 60,000 shares traded weekly \u2014 the higher number wins as the cap."},
  {id:"u2-11", unit:"u2", fam:"u2-rightswarrants", term:"Stock rights (preemptive rights)", def:"Short-term instruments (30–45 day subscription period) letting existing shareholders buy new shares below market price during an additional public offering.", hint:"Example: a company offers current shareholders a 30-day window to buy new shares at a discount before the general public can."},
  {id:"u2-12", unit:"u2", fam:"u2-rightswarrants", term:"Warrant", def:"A long-term certificate letting the holder buy stock at a set exercise price later. Often attached to bonds/preferred stock as a sweetener.", hint:"Example: buy a corporate bond and get 10 of these tossed in for free \u2014 each lets you buy stock later at a locked-in price."},
  {id:"u2-13", unit:"u2", fam:"u2-splits", term:"Forward stock split", def:"Increases the number of shares and decreases price per share; total value and cost basis total stay the same.", hint:"Example: 100 shares at $80 become 200 shares at $40 \u2014 same total value, just sliced into smaller pieces."},
  {id:"u2-14", unit:"u2", fam:"u2-splits", term:"Reverse stock split", def:"Decreases the number of shares and increases price per share; used when a stock's price falls too low (e.g., toward penny-stock range).", hint:"Example: 600 shares at $2 become 100 shares at $12 \u2014 same total value, just combined into bigger, pricier pieces."},
  {id:"u2-15", unit:"u2", fam:"u2-corpactions", term:"Merger", def:"Two or more companies combine into a new company. Old shares are canceled; shareholders receive shares of the new combined company.", hint:"Example: Company A and Company B combine into brand-new Company C \u2014 your old A and B shares vanish, replaced by C shares."},
  {id:"u2-16", unit:"u2", fam:"u2-corpactions", term:"Acquisition", def:"One company takes over another's operations and assets. The acquired company's shares are canceled for shares of the acquirer.", hint:"Example: Big Company buys Small Company outright \u2014 Small Company's shares disappear, swapped for Big Company shares."},
  {id:"u2-17", unit:"u2", fam:"u2-corpactions", term:"Spin-off", def:"A corporation forms a new company from some of its assets. Shareholders receive new company shares AND keep their original shares.", hint:"Example: a company spins its software division into a new, separate company \u2014 you get shares in the new company AND keep your original shares too."},
  {id:"u2-18", unit:"u2", fam:"u2-corpactions", term:"Stock buyback", def:"A company repurchases its own outstanding shares in the open market, reducing share supply; often an alternative to paying dividends.", hint:"Example: a company spends its own cash to purchase its own stock on the open market, shrinking the total share count."},
  {id:"u2-19", unit:"u2", fam:"u2-corpactions", term:"Tender offer", def:"An offer to buy securities directly from shareholders (not through the secondary market), usually for cash.", hint:"Example: 'We'll pay you $40/share directly, no need to sell on the exchange' \u2014 that direct cash offer to shareholders is this."},
  {id:"u2-20", unit:"u2", fam:"u2-corpactions", term:"Tax treatment of corporate actions", def:"Receiving stock = generally not taxable. Receiving cash (buybacks, tender offers, cash portion of a merger) = taxable capital gain or loss.", hint:"Example: getting extra shares from a spin-off? No tax bill yet. Getting cash from a buyback? That's a taxable sale."},
  {id:"u2-21", unit:"u2", fam:"u2-corpactions", term:"Corporate action notice timing", def:"Issuers must notify shareholders at least 10 days before the record date (or on/before record date, no later than the payment date, for rights offerings if 10 days isn't practical).", hint:"Example: a company plans to pay a dividend with a record date of the 30th \u2014 it generally has to notify shareholders by at least the 20th."},
  {id:"u2-22", unit:"u2", fam:"u2-corpactions", term:"Proxy", def:"A limited power of attorney, like an absentee ballot, letting another person vote on a shareholder's behalf.", hint:"Picture mailing in an absentee ballot instead of showing up to the shareholder meeting in person \u2014 that's basically this."},
  {id:"u2-23", unit:"u2", fam:"u2-corpactions", term:"Street name stock voting (minor matters)", def:"If a customer does NOT return a proxy at all by the 10th day before the annual meeting on a MINOR/routine matter, the member firm may vote the shares as it sees fit (typically following management's recommendation).", hint:"Example: you never return your proxy on a routine matter, and the 10-day deadline passes \u2014 your brokerage firm can go ahead and vote your shares on its own judgment."},
  {id:"u2-24", unit:"u2", fam:"u2-corpactions", term:"Street name stock voting (major matters)", def:"If a customer does NOT return a proxy at all by the 10th day before the annual meeting on a MAJOR matter (e.g., merger, new share issuance), the member firm may NEVER vote the shares \u2014 they go unvoted.", hint:"Example: you never return your proxy on a huge decision like a merger \u2014 no matter how close the deadline gets, your brokerage firm must leave your shares unvoted."},
  {id:"u2-31", unit:"u2", fam:"u2-corpactions", term:"Signed proxy with no voting instructions", def:"If a customer SIGNS AND RETURNS a proxy but doesn't indicate how to vote on a specific item, the member firm must vote those shares as recommended by the issuer's management \u2014 this applies whether the matter is major or minor.", hint:"Example: a customer mails back their proxy card but leaves one item blank \u2014 the brokerage firm votes that item exactly the way the company's management recommended, regardless of how big a deal the item is."},

  // ---- Unit 3 ----
  {id:"u3-1", unit:"u3", fam:"u3-basics", term:"Par value (bond)", def:"The face/principal value of a bond, usually $1,000, paid to the investor at maturity.", hint:"Example: you hold a bond to maturity and the issuer hands you back exactly $1,000 \u2014 that return amount is this."},
  {id:"u3-2", unit:"u3", fam:"u3-basics", term:"Term bond", def:"A bond where the entire principal matures at one time; may have a sinking fund.", hint:"Example: a company issues $10 million in bonds, and every dollar of principal comes due on the same day in 2036."},
  {id:"u3-3", unit:"u3", fam:"u3-basics", term:"Serial bond", def:"A bond where portions of the principal mature over a period of years.", hint:"Example: a $10 million issue where $1 million matures each year from 2027 through 2036 \u2014 a little comes due annually."},
  {id:"u3-4", unit:"u3", fam:"u3-basics", term:"Balloon bond", def:"A combination of serial and term bonds — part of the principal repaid before maturity, majority repaid at final maturity.", hint:"Example: small chunks mature over 10 years, but 70% of the debt comes due all at once in the final year."},
  {id:"u3-5", unit:"u3", fam:"u3-basics", term:"Coupon rate (nominal/stated yield)", def:"The interest rate the issuer agrees to pay, usually stated as a % of par value; it's fixed and doesn't change with market price.", hint:"Example: a bond promises 6% forever \u2014 even if the bond's market price swings wildly, this number never changes."},
  {id:"u3-6", unit:"u3", fam:"u3-basics", term:"Accrued interest", def:"Interest earned to date that the buyer pays the seller when a bond trades between coupon payment dates. Zero-coupon bonds don't have it.", hint:"Example: you buy a bond 3 months after its last interest payment \u2014 you owe the seller those 3 months of interest at settlement."},
  {id:"u3-7", unit:"u3", fam:"u3-basics", term:"Bond point", def:"1% of face value = $10 in bond pricing. A quote of 90 = $900.", hint:"Example: a bond quoted at 96 means $960 \u2014 each one of these equals $10 on a standard $1,000 bond."},
  {id:"u3-8", unit:"u3", fam:"u3-yields", term:"Current Yield (CY)", def:"Annual coupon payment ÷ market price.", hint:"Example: a $70/year coupon on a bond trading at $875 works out to about 8% using this measure."},
  {id:"u3-9", unit:"u3", fam:"u3-yields", term:"Yield to Maturity (YTM)", def:"The annualized return if a bond is held to maturity, factoring in purchase price and par value received at maturity.", hint:"Example: buy a bond at a discount, hold it until it pays off in full at maturity \u2014 the total annualized return you actually earned is this."},
  {id:"u3-10", unit:"u3", fam:"u3-yields", term:"Yield to Call (YTC)", def:"The return on a bond if it's called (redeemed early) before maturity.", hint:"Example: the issuer redeems your bond 5 years early instead of the original 20-year term \u2014 your return based on that early payoff is this."},
  {id:"u3-11", unit:"u3", fam:"u3-yields", term:"Basis point", def:"1/100 of 1%. 100 basis points = 1%.", hint:"Example: a yield moving from 4.25% to 4.60% moved by 35 of these."},
  {id:"u3-12", unit:"u3", fam:"u3-yields", term:"Yield order — discount bond", def:"Coupon < Current Yield < YTM < YTC (yields increase as price is below par).", hint:"Example: bought at $900 instead of $1,000 par \u2014 coupon, current yield, YTM, and YTC each come out a little higher than the last."},
  {id:"u3-13", unit:"u3", fam:"u3-yields", term:"Yield order — premium bond", def:"Coupon > Current Yield > YTM > YTC (yields decrease as price is above par).", hint:"Example: bought at $1,100 instead of $1,000 par \u2014 coupon, current yield, YTM, and YTC each come out a little lower than the last."},
  {id:"u3-14", unit:"u3", fam:"u3-yields", term:"Yield order — par bond", def:"Coupon = Current Yield = YTM = YTC.", hint:"Example: bought at exactly $1,000 \u2014 coupon, current yield, YTM, and YTC would all calculate to the identical number."},
  {id:"u3-15", unit:"u3", fam:"u3-yields", term:"Call feature", def:"Lets the issuer redeem a bond before maturity; benefits the issuer; callable bonds usually pay a slightly higher coupon.", hint:"Example: rates drop, and the issuer says 'we're paying this bond off early so we can refinance cheaper' \u2014 that early-payoff power is this."},
  {id:"u3-16", unit:"u3", fam:"u3-yields", term:"Put feature", def:"Lets the investor force the issuer to repay a bond early; benefits the bondholder; put bonds usually pay a lower coupon.", hint:"Example: rates rise, and the investor says 'I'm forcing you to pay me back early so I can reinvest at a better rate' \u2014 that power is this."},
  {id:"u3-17", unit:"u3", fam:"u3-yields", term:"Convertible feature", def:"Lets the bondholder convert the bond into the issuer's common stock; benefits the investor.", hint:"Example: the bondholder trades their bond in for 20 shares of the company's common stock instead of cash."},
  {id:"u3-18", unit:"u3", fam:"u3-yields", term:"Parity (convertible bonds)", def:"When a bond's value equals the value of the common shares it could convert into.", hint:"Example: converting your bond would get you shares worth exactly $1,000 \u2014 the same as the bond itself \u2014 that break-even point is this."},
  {id:"u3-19", unit:"u3", fam:"u3-yields", term:"Zero-coupon bond", def:"Issued at a deep discount, pays no periodic interest, matures at par. Interest is taxed annually as it accretes (phantom income).", hint:"Example: buy it for $500 today, get no interest checks at all, then collect the full $1,000 face value 20 years later."},
  {id:"u3-20", unit:"u3", fam:"u3-ratings", term:"Investment grade debt", def:"Rated BBB/Baa or higher. Good liquidity, eligible for purchase by banks, insurance companies, and fiduciaries.", hint:"Example: a bond rated A or BBB is considered safe enough for a bank or insurance company to legally buy."},
  {id:"u3-21", unit:"u3", fam:"u3-ratings", term:"High-yield (junk) bond", def:"Rated BB/Ba or lower. Greater default risk, more volatile, pays higher yield.", hint:"Example: a bond rated B pays extra interest because there's real risk the issuer could default."},
  {id:"u3-22", unit:"u3", fam:"u3-ratings", term:"S&P/Fitch top 4 ratings", def:"AAA, AA, A, BBB (highest to lowest), using + / - for intermediate grades.", hint:"Think alphabet-soup, best to worst: three A's, then a B \u2014 those are the top four labels these agencies use."},
  {id:"u3-23", unit:"u3", fam:"u3-ratings", term:"Moody's top 4 ratings", def:"Aaa, Aa, A, Baa (highest to lowest), using 1, 2, 3 for intermediate grades.", hint:"This agency's top four labels look similar to S&P's, but lowercase and using 1/2/3 instead of plus/minus signs."},
  {id:"u3-24", unit:"u3", fam:"u3-ratings", term:"Duration", def:"A measure of a bond's price volatility/sensitivity to interest rate changes. Higher duration = more volatile.", hint:"Example: two bonds with the same maturity \u2014 whichever has the higher number here will swing in price more when rates move."},
  {id:"u3-25", unit:"u3", fam:"u3-ratings", term:"Bond volatility factors", def:"Longer maturity = more volatile. Lower coupon rate = more volatile (zero-coupon bonds are most volatile).", hint:"Example: a 20-year zero-coupon bond is far more sensitive to rate changes than a 5-year bond paying 6% interest \u2014 longer time and lower coupon both crank this up."},
  {id:"u3-26", unit:"u3", fam:"u3-risks", term:"Default (credit) risk", def:"The risk that a bond issuer fails to pay interest or principal — the worst outcome of owning a bond.", hint:"Example: the company running the bond just stops sending interest checks \u2014 that worst-case scenario is this."},
  {id:"u3-27", unit:"u3", fam:"u3-risks", term:"Purchasing power risk", def:"The risk that inflation erodes the value of a bond's (or preferred stock's) fixed payments over time.", hint:"Example: a fixed $50/year payment bought two movie tickets in 1990 \u2014 today it barely covers one, thanks to this."},
  {id:"u3-28", unit:"u3", fam:"u3-corporate", term:"Secured debt", def:"Debt backed by collateral (e.g., mortgage bonds backed by real estate, equipment trust certificates backed by equipment).", hint:"Example: a bond backed by a company's real estate \u2014 if they can't pay, that property gets sold to cover bondholders."},
  {id:"u3-29", unit:"u3", fam:"u3-corporate", term:"Debenture", def:"An unsecured bond backed by the issuer's full faith and credit; the most senior (highest priority) unsecured debt.", hint:"Example: a bond backed by nothing but the company's word and reputation \u2014 no real estate, no equipment, no collateral at all."},
  {id:"u3-30", unit:"u3", fam:"u3-corporate", term:"Guaranteed bond", def:"An unsecured bond backed by a third party (often a parent company) if the issuer defaults. Still unsecured.", hint:"Example: a subsidiary's bond that its parent company has promised to cover if the subsidiary can't pay \u2014 still zero collateral behind it though."},
  {id:"u3-31", unit:"u3", fam:"u3-corporate", term:"Income (adjustment) bond", def:"Pays interest only if the company has enough income, as authorized by the board. Not reliable for income.", hint:"Example: this bond only pays interest in years the company actually turns a profit \u2014 some years, nothing."},
  {id:"u3-32", unit:"u3", fam:"u3-corporate", term:"Subordinated debt", def:"Unsecured debt ranked below debentures (junior debt); usually pays a higher coupon due to higher risk.", hint:"Example: if the company goes bankrupt, this debt gets paid only after every other unsecured creditor has already been made whole."},
  {id:"u3-33", unit:"u3", fam:"u3-corporate", term:"Bankruptcy priority order (corp)", def:"Secured debt → administrative claims (bankruptcy costs, often incl. wages/taxes) → unsecured debt/general creditors → subordinated debt → preferred stock → common stock.", hint:"Picture the full payout line: secured lenders get paid from their own collateral first, then the costs of running the bankruptcy case get cleared, then general unsecured creditors, then this junior debt, then preferred stock, then common stock last."},
  {id:"u3-34", unit:"u3", fam:"u3-govt", term:"Treasury bill (T-bill)", def:"Short-term Treasury debt (up to 52 weeks), issued at a discount, matures at par, no periodic interest.", hint:"Example: pay $9,800 today, collect $10,000 in 26 weeks \u2014 no interest checks in between, just that difference."},
  {id:"u3-35", unit:"u3", fam:"u3-govt", term:"Treasury note (T-note)", def:"Intermediate-term Treasury debt (2–10 years), issued at par, pays semiannual interest.", hint:"Example: a 7-year government IOU that pays you interest twice a year until it matures."},
  {id:"u3-36", unit:"u3", fam:"u3-govt", term:"Treasury bond (T-bond)", def:"Long-term Treasury debt (10–30 years), issued at par, pays semiannual interest.", hint:"Example: a 25-year government IOU paying interest twice a year \u2014 the longest-running type the Treasury issues."},
  {id:"u3-37", unit:"u3", fam:"u3-govt", term:"Treasury STRIPS", def:"Zero-coupon bonds created by separating a Treasury's interest and principal. Backed by the full faith and credit of the U.S. government.", hint:"Example: a bank takes a 10-year Treasury note and separates the interest from the principal, creating a pure zero-coupon piece \u2014 still government-backed."},
  {id:"u3-38", unit:"u3", fam:"u3-govt", term:"TIPS", def:"Treasury Inflation-Protected Securities. Fixed coupon rate; principal adjusts every 6 months for inflation; final principal never less than original par.", hint:"Example: inflation runs hot this year, so this bond's principal balance \u2014 and the interest paid on it \u2014 both bump up to match."},
  {id:"u3-39", unit:"u3", fam:"u3-govt", term:"GNMA (Ginnie Mae)", def:"The only agency security backed by the full faith and credit of the U.S. government. Pass-through mortgage security paying monthly principal & interest; interest is taxable at both the federal AND state/local level. Early mortgage payoffs create prepayment risk for investors.", hint:"Example: this is the one mortgage-backed security where, even if every homeowner defaulted, the U.S. government itself would still make investors whole \u2014 but if homeowners refinance early, investors get their principal back sooner than expected (prepayment risk)."},
  {id:"u3-40", unit:"u3", fam:"u3-govt", term:"FNMA (Fannie Mae)", def:"A government-sponsored enterprise (GSE), publicly held; buys conventional/insured mortgages and issues MBS (monthly pass-through) as well as regular bonds (semiannual interest). NOT backed by the U.S. Treasury; interest is taxable at both federal AND state/local levels.", hint:"Example: this publicly traded company buys conventional mortgages from banks and repackages them into securities \u2014 no government guarantee attached, and interest is taxed at every level, unlike a Treasury."},
  {id:"u3-41", unit:"u3", fam:"u3-govt", term:"FHLMC (Freddie Mac)", def:"A government-sponsored enterprise (GSE); creates a secondary market for mortgages and issues MBS (monthly pass-through) as well as regular bonds (semiannual interest). NOT backed by the U.S. Treasury; interest is taxable at both federal AND state/local levels.", hint:"Example: basically this GSE's twin \u2014 buys mortgages, bundles them, sells the packages, and also issues plain bonds \u2014 also with no government guarantee and fully taxable interest."},
  {id:"u3-42", unit:"u3", fam:"u3-muni", term:"General Obligation (GO) bond", def:"A municipal bond backed by the issuer's taxing power; used for non-revenue-producing projects; usually requires voter approval and is subject to a debt limit.", hint:"Example: a city borrows to build a new park (which earns no revenue) and repays it using property tax collections."},
  {id:"u3-43", unit:"u3", fam:"u3-muni", term:"Revenue bond", def:"A municipal bond backed by the revenue of the specific project financed; self-supporting; not subject to a debt limit; usually no voter approval needed.", hint:"Example: a city borrows to build a toll bridge, and repays bondholders only from the tolls that bridge actually collects."},
  {id:"u3-44", unit:"u3", fam:"u3-muni", term:"TAN (Tax Anticipation Note)", def:"Short-term municipal note that finances operations before tax receipts come in.", hint:"Example: a city needs cash in March but property taxes aren't due until September \u2014 this short-term note bridges that gap."},
  {id:"u3-45", unit:"u3", fam:"u3-muni", term:"RAN (Revenue Anticipation Note)", def:"Short-term municipal note that finances operations before project revenues come in.", hint:"Example: a toll road authority needs cash now but the toll revenue won't arrive until later \u2014 this note bridges that gap."},
  {id:"u3-46", unit:"u3", fam:"u3-muni", term:"BAN (Bond Anticipation Note)", def:"Interim municipal financing used before a long-term bond is issued.", hint:"Example: a city needs construction cash right away but won't formally issue its 20-year bond for another 6 months \u2014 this note covers the interim."},
  {id:"u3-47", unit:"u3", fam:"u3-muni", term:"Tax-equivalent yield", def:"Formula: Municipal yield ÷ (100% − tax bracket). Converts a muni yield into its taxable equivalent for comparison.", hint:"Example: a 7% muni yield for someone in the 30% tax bracket works out to a 10% taxable-equivalent yield once you run the math."},
  {id:"u3-48", unit:"u3", fam:"u3-moneymarket", term:"Money market instrument", def:"Short-term debt with 1 year or less to maturity; high quality, very liquid, low return.", hint:"Example: a 6-month T-bill or 90-day commercial paper \u2014 any safe debt maturing in a year or less lands in this category."},
  {id:"u3-49", unit:"u3", fam:"u3-moneymarket", term:"Jumbo CD", def:"A bank-issued CD with a minimum face value of $100,000. The negotiable version trades in the secondary market and is a money market instrument.", hint:"Example: a $250,000 bank CD that's actually big enough to be resold to another investor before it matures."},
  {id:"u3-50", unit:"u3", fam:"u3-moneymarket", term:"Banker's Acceptance (BA)", def:"A short-term instrument (1–180 days) used to finance international trade; issued at a discount.", hint:"Example: an importer needs a bank-guaranteed short-term IOU to pay for goods shipping in from overseas \u2014 that's this."},
  {id:"u3-51", unit:"u3", fam:"u3-moneymarket", term:"Commercial paper", def:"Unsecured short-term corporate debt (1–270 days, most within 90) used to finance receivables/seasonal needs.", hint:"Example: a company with excellent credit borrows for 60 days, unsecured, just to cover payroll until customer payments come in."},
  {id:"u3-52", unit:"u3", fam:"u3-moneymarket", term:"Repurchase agreement (Repo)", def:"A sale of securities with an agreement to buy them back later at a higher price; a way to raise short-term cash.", hint:"Example: a bank sells securities today for quick cash, agreeing to buy them back tomorrow at a slightly higher price."},
  {id:"u3-53", unit:"u3", fam:"u3-moneymarket", term:"Reverse repo", def:"The dealer buys securities from an investor and agrees to sell them back later at a higher price.", hint:"Example: same deal as a repo, but from the other side \u2014 you're the one buying the securities now, planning to resell them back later for a profit."},
  {id:"u3-54", unit:"u3", fam:"u3-moneymarket", term:"Federal funds", def:"Excess bank reserves held at the Fed that banks loan to other banks, usually overnight.", hint:"Example: Bank A has extra reserves parked at the Fed and lends them overnight to Bank B, which is a little short."},
  {id:"u3-55", unit:"u3", fam:"u3-moneymarket", term:"CMO (Collateralized Mortgage Obligation)", def:"Pools mortgages into tranches with different maturities/risk; pays monthly principal & interest, highest tranche paid off first.", hint:"Example: a pool of thousands of mortgages gets sliced into different risk/maturity buckets \u2014 the safest, shortest bucket gets paid off first."},
  {id:"u3-56", unit:"u3", fam:"u3-moneymarket", term:"CDO (Collateralized Debt Obligation)", def:"A complex asset-backed security divided into tranches, backed by various debt (auto loans, credit card debt, bonds, etc.); higher risk tranche = higher potential return.", hint:"Example: a bundle backed by a mix of auto loans, credit card debt, and bonds \u2014 not just mortgages \u2014 sliced into risk tranches like the mortgage version."},
  {id:"u1-37", unit:"u1", fam:"u1-common", term:"Board of Directors (BOD)", def:"Elected by common shareholders to oversee company management; sets policy, declares dividends, and hires/fires executives.", hint:"Example: shareholders vote at the annual meeting to elect a slate of directors who then decide whether to declare a dividend that quarter."},
  {id:"u1-38", unit:"u1", fam:"u1-common", term:"Right to information (shareholder)", def:"Common shareholders have the right to receive annual reports, proxy statements, and other financial disclosures about the company.", hint:"Example: before the annual meeting, every shareholder gets a proxy statement in the mail summarizing what's up for vote and the company's financials."},
  {id:"u1-39", unit:"u1", fam:"u1-common", term:"Right to freely transfer shares", def:"Common shareholders can buy, sell, or transfer their shares without needing company approval (unlike restricted stock).", hint:"Example: an investor sells shares on the open market through their broker without ever asking the company for permission."},
  {id:"u1-40", unit:"u1", fam:"u1-dividends", term:"Product dividend", def:"A dividend paid in the form of a company's own product or a subsidiary's shares, rather than cash or stock.", hint:"Example: a beverage company pays shareholders a case of its soda instead of a cash check."},
  {id:"u1-41", unit:"u1", fam:"u1-preferred", term:"Preferred stock voting/preemptive rights", def:"Preferred stockholders normally do NOT have voting rights or preemptive rights, unlike common shareholders (an exception: some preferred can carry voting rights if specified).", hint:"Example: a preferred shareholder gets a fixed dividend check but doesn't get a ballot for the board election like common shareholders do."},
  {id:"u2-25", unit:"u2", fam:"u2-splits", term:"Even vs. uneven forward split", def:"An even split (e.g., 2:1, 3:1) results in a whole-number ratio of new shares to old; an uneven split (e.g., 5:4) does not reduce evenly and can require cash for fractional shares.", hint:"Example: a 2:1 split turns 100 shares into 200 evenly, but a 5:4 split can leave fractional shares that get paid out in cash instead of a whole share."},
  {id:"u2-26", unit:"u2", fam:"u2-rightswarrants", term:"Warrant units", def:"Warrants are often issued attached to a bond or preferred stock as a \"sweetener\" to make the offering more attractive, and can be detached and traded separately.", hint:"Example: a company issues bonds with warrants attached to sweeten the deal; investors can later strip off the warrant and sell it on its own."},
  {id:"u2-27", unit:"u2", fam:"u2-corpactions", term:"Buyback vs. tender offer", def:"A buyback is a company repurchasing its own shares on the open market; a tender offer is a formal offer to all shareholders to buy shares at a set price, often above market, within a window.", hint:"Example: a company quietly buys back shares on the exchange over months (buyback), versus publicly offering to buy any shares tendered at $50 each by a certain date (tender offer)."},
  {id:"u2-28", unit:"u2", fam:"u2-adr", term:"ADR benefits", def:"ADRs let U.S. investors buy shares of foreign companies in dollars, trade on U.S. exchanges, and receive dividends in dollars without dealing with foreign currency conversion or overseas trading.", hint:"Example: a U.S. investor buys shares of a European company through an ADR on the NYSE, gets dividend checks in dollars, and never touches euros."},
  {id:"u2-29", unit:"u2", fam:"u2-adr", term:"ADR taxation", def:"Foreign governments may withhold taxes on dividends paid to ADR holders; U.S. investors may be able to claim a foreign tax credit to offset this.", hint:"Example: a foreign country withholds 15% tax on the dividend before it reaches the ADR holder, who can then claim a credit on their U.S. tax return for the amount withheld."},
  {id:"u3-57", unit:"u3", fam:"u3-corporate", term:"\"Series\" bond (trick term)", def:"\"Series\" is NOT a bond maturity type (unlike term/serial/balloon) \u2014 on the exam, \"series bond\" normally refers to savings bonds (like Series EE or Series I), not a maturity structure or collateral type.", hint:"Example: if a question mentions a \"series bond,\" don't try to fit it into term/serial/balloon \u2014 think Series EE or Series I savings bonds instead, since that's what \"series\" actually points to."},
  {id:"u3-58", unit:"u3", fam:"u3-govt", term:"Savings bond", def:"A non-marketable U.S. government bond (e.g., Series EE, Series I) purchased directly from the Treasury; cannot be traded on the secondary market and is redeemed directly with the government.", hint:"Example: a parent buys a Series EE savings bond for a child directly from TreasuryDirect.gov \u2014 it can't be sold to another investor, only redeemed with the Treasury."},
  {id:"u3-59", unit:"u3", fam:"u3-corporate", term:"Sinking fund", def:"Money a corporation sets aside regularly to redeem term bonds at or before maturity, reducing default risk for bondholders.", hint:"Example: a company sets aside cash every year into a fund specifically earmarked to pay off a large bond issue when it matures in 2035."},
  {id:"u3-60", unit:"u3", fam:"u3-ratings", term:"Nonrated bond", def:"A bond that has not been evaluated by a rating agency (like Moody's or S&P) \u2014 this does NOT necessarily mean it's low quality, just unrated, and it typically carries higher perceived risk due to the lack of information.", hint:"Example: a small municipality issues bonds but never pays for a Moody's rating \u2014 investors have no agency opinion to rely on, so the bonds may be harder to sell."},
  {id:"u3-61", unit:"u3", fam:"u3-risks", term:"Administrative claimants (bankruptcy)", def:"In a corporate bankruptcy liquidation, administrative claimants (attorneys, courts, appraisers, auctioneers, liquidators — the people running the liquidation itself) are paid AFTER secured creditors but BEFORE any other unsecured debt or stockholders.", hint:"Example: the lawyers and liquidators running the bankruptcy case get paid right after the secured lenders collect from their collateral, but before the regular unsecured bondholders and stockholders see a dime."},
  {id:"u3-62", unit:"u3", fam:"u3-corporate", term:"Equipment trust certificate", def:"A bond secured by specific equipment (like railroad cars or airplanes) that the issuer pledges as collateral; commonly used by transportation companies.", hint:"Example: an airline issues bonds backed specifically by a fleet of new planes \u2014 if the airline defaults, bondholders have a claim on those planes."},
  {id:"u3-63", unit:"u3", fam:"u3-govt", term:"Treasury receipts", def:"A privately created zero-coupon product backed by Treasury securities held in custody by a broker-dealer (unlike STRIPS, which are created and backed directly by the U.S. Treasury).", hint:"Example: a brokerage firm buys T-bonds, strips the coupons, and repackages them as zero-coupon \"Treasury receipts\" \u2014 backed by the broker's custody, not directly guaranteed by the Treasury like STRIPS."},
  {id:"u3-64", unit:"u3", fam:"u3-muni", term:"Territory bonds", def:"Bonds issued by U.S. territories (Puerto Rico, Guam, U.S. Virgin Islands) that are triple tax-exempt (federal, state, and local) for all U.S. investors regardless of residency.", hint:"Example: an investor in California buys a Puerto Rico territory bond and owes no federal, California state, or local tax on the interest \u2014 unlike most munis, which are only state-tax-free for residents of that state."},
  {id:"u3-65", unit:"u3", fam:"u3-muni", term:"Variable-Rate Demand Note (VRDN)", def:"A long-term municipal security with an interest rate that resets periodically and a \"put\" feature letting the holder sell it back to the issuer/agent at par on short notice, functioning like a short-term instrument.", hint:"Example: an investor holds a muni VRDN and, whenever they want cash, can put the note back to the remarketing agent at par with just a few days' notice, even though the bond's stated maturity is decades away."},
  {id:"u3-66", unit:"u3", fam:"u3-moneymarket", term:"Negotiable vs. nonnegotiable CD", def:"A negotiable (jumbo) CD is $100,000+, can be traded on the secondary market before maturity, and doesn't need an early-withdrawal penalty since you sell it instead; a nonnegotiable CD cannot be sold and incurs a penalty for early withdrawal.", hint:"Example: an investor with a $250,000 negotiable CD who needs cash early sells it to another investor on the secondary market, while someone with a small nonnegotiable bank CD would have to pay an early-withdrawal penalty instead."},
  {id:"u1-42", unit:"u1", fam:"u1-common", term:"Form 10-K (Annual Report)", def:"The audited annual report a company must file with the SEC, containing its full-year financial statements and business disclosures.", hint:"Example: at year-end, a public company's accountants audit the books and the company files a 10-K with the SEC so investors can see the full financial picture."},
  {id:"u2-30", unit:"u2", fam:"u2-corpactions", term:"Beneficial owner (street name)", def:"When stock is held in \"street name,\" the broker-dealer is the nominal/record owner on the company's books, but the customer remains the beneficial owner who keeps all economic rights (dividends, sale proceeds, and — subject to proxy rules — voting).", hint:"Example: your shares show up on the company's records under your brokerage firm's name, but the dividends, gains, and (usually) the vote are still yours."},
  {id:"u3-67", unit:"u3", fam:"u3-corporate", term:"Mortgage bond", def:"A secured bond backed by real estate the corporation owns; if the issuer defaults, the pledged property can be sold to repay bondholders.", hint:"Example: a company pledges its headquarters building as collateral for a bond issue — if it defaults, that real estate can be sold to pay bondholders back."},
  {id:"u3-68", unit:"u3", fam:"u3-corporate", term:"Collateral trust bond", def:"A secured bond backed by a portfolio of securities (often from another issuer, like Treasuries) held in trust; the securities must be liquid, worth more than the loan, and mature as long as the bond or longer.", hint:"Example: a company backs its bond issue by placing a stack of Treasury securities in a trust account — those securities can't be touched except to repay the bond if the company defaults."},
  {id:"u3-69", unit:"u3", fam:"u3-basics", term:"Accrued interest day-count convention", def:"Corporate and municipal bonds calculate accrued interest using a 30-day month / 360-day year; U.S. Treasury securities use actual calendar days instead. Both settle T+1.", hint:"Example: figuring accrued interest on a corporate bond trade treats every month as exactly 30 days, but the same calculation on a Treasury note counts the real number of days on the calendar."},
  {id:"u3-70", unit:"u3", fam:"u3-govt", term:"Farm Credit System (FCS)", def:"A government-sponsored, privately-owned network of lending institutions that provides agricultural financing, funded by selling Farm Credit debt securities; overseen (not owned) by the Farm Credit Administration (FCA), a government agency.", hint:"Example: a farmer gets a loan through a local Farm Credit lending institution, and that institution raised the money by selling Farm Credit debt securities to investors."},
  {id:"u3-71", unit:"u3", fam:"u3-muni", term:"TRAN (Tax and Revenue Anticipation Note)", def:"A short-term municipal note combining the features of a TAN and a RAN — issued in anticipation of both future tax receipts and future project revenue.", hint:"Example: a city expects both an upcoming property tax collection AND toll revenue from a new bridge, so it issues a single TRAN anticipating both income sources."},
  {id:"u3-72", unit:"u3", fam:"u3-muni", term:"GAN (Grant Anticipation Note)", def:"A short-term municipal note issued in anticipation of receiving grant money, usually from the federal government.", hint:"Example: a town is approved for a federal infrastructure grant that won't arrive for months, so it issues a GAN to fund the project now and repay it once the grant money comes in."},
  {id:"u3-73", unit:"u3", fam:"u3-muni", term:"Construction Loan Note (CLN)", def:"A short-term municipal note issued to provide interim financing for the construction of housing projects.", hint:"Example: a housing authority issues a CLN to pay contractors while a public housing project is being built, before longer-term financing is arranged."},
  {id:"u3-74", unit:"u3", fam:"u3-muni", term:"Tax-exempt commercial paper (muni)", def:"A short-term (up to 270 days, usually 30/60/90-day) municipal financing tool often used in place of a BAN or TAN.", hint:"Example: instead of issuing a formal bond anticipation note, a municipality raises quick short-term cash by issuing tax-exempt commercial paper due in 60 days."}
];

  {id:"q-u1-1", unit:"u1", q:"What is the formula for outstanding shares?", choices:["Issued − Treasury","Authorized − Issued","Issued + Treasury","Authorized − Treasury"], answer:0, explain:"Outstanding = Issued shares minus Treasury shares."},
  {id:"q-u1-2", unit:"u1", q:"A company issued 600,000 shares and holds 40,000 in treasury. How many shares are outstanding?", choices:["640,000","600,000","560,000","40,000"], answer:2, explain:"600,000 − 40,000 = 560,000 outstanding shares."},

  {id:"q-u1-4", unit:"u1", q:"A stock trading at $3.50/share with no exchange listing is classified as a:", choices:["Blue-chip stock","Mid cap stock","Penny stock","Treasury stock"], answer:2, explain:"Penny stocks are unlisted securities trading below $5/share."},
  {id:"q-u1-5", unit:"u1", q:"Before a customer's first SOLICITED penny stock transaction, they must receive:", choices:["A prospectus only","A penny stock risk disclosure document","Nothing, it's unregulated","A margin agreement"], answer:1, explain:"Customers must receive a penny stock risk disclosure document and sign/date an acknowledgment."},

  {id:"q-u1-7", unit:"u1", q:"Do UNSOLICITED penny stock transactions require a suitability statement?", choices:["Yes, always","No — unsolicited trades are exempt","Only if over $5,000","Only for new accounts"], answer:1, explain:"Suitability/disclosure rules apply only to solicited (recommended) transactions."},
  {id:"q-u1-8", unit:"u1", q:"To receive a stock's next dividend, an investor must buy the stock:", choices:["On the record date","On the payable date","Before the ex-dividend date","After the declaration date, anytime"], answer:2, explain:"Buying before the ex-dividend date entitles the buyer to the dividend."},
  {id:"q-u1-9", unit:"u1", q:"Who sets the ex-dividend date?", choices:["The company's CEO","FINRA or the exchange","The SEC","The shareholder"], answer:1, explain:"The ex-dividend date is set by FINRA or the relevant exchange."},
  {id:"q-u1-10", unit:"u1", q:"What is the correct order of dividend dates (DERP)?", choices:["Ex-dividend, Declaration, Record, Payable","Declaration, Record, Ex-dividend, Payable","Declaration, Ex-dividend, Record, Payable","Record, Declaration, Payable, Ex-dividend"], answer:2, explain:"DERP = Declaration, Ex-dividend, Record, Payable."},
  {id:"q-u1-11", unit:"u1", q:"With 100 shares and statutory voting for 3 board seats, what's the max votes a shareholder can cast for ONE seat?", choices:["100","300","33","1"], answer:0, explain:"Statutory voting: 1 vote per share per seat, votes can't be combined — max 100 for any one seat."},
  {id:"q-u1-12", unit:"u1", q:"With 100 shares and cumulative voting for 3 board seats, how many total votes can the shareholder cast?", choices:["100","300","3","33"], answer:1, explain:"Cumulative voting: 100 shares × 3 seats = 300 total votes, combinable any way."},
  {id:"q-u1-13", unit:"u1", q:"Preemptive rights allow existing shareholders to:", choices:["Vote twice per share","Sell shares without restriction","Buy newly issued shares first to maintain their ownership %","Receive dividends before preferred stockholders"], answer:2, explain:"Preemptive rights protect a shareholder's proportionate ownership when new shares are issued."},
  {id:"q-u1-14", unit:"u1", q:"At corporate dissolution, what is the correct payout order among bondholders, preferred stockholders, and common stockholders?", choices:["Common, preferred, bondholders","Bondholders, preferred, common","Preferred, bondholders, common","All paid equally"], answer:1, explain:"Debt is paid first, then preferred stock, then common stock (if anything remains)."},
  {id:"q-u1-15", unit:"u1", q:"On the SIE exam, assume preferred stock's par value is:", choices:["$1,000","$50","$100","$25"], answer:2, explain:"Assume $100 par for preferred stock (vs. $1,000 for bonds)."},
  {id:"q-u1-16", unit:"u1", q:"A 6% preferred stock (par $100) pays how much per year?", choices:["$0.60","$6.00","$60.00","$16.00"], answer:1, explain:"6% × $100 par = $6.00 per year."},
  {id:"q-u1-17", unit:"u1", q:"Which preferred stock type requires missed dividends to be paid (in arrears) before common stockholders get anything?", choices:["Straight preferred","Cumulative preferred","Callable preferred","Adjustable-rate preferred"], answer:1, explain:"Cumulative preferred dividends accrue and must be paid before common receives dividends."},
  {id:"q-u1-18", unit:"u1", q:"Which preferred stock type's price moves most in line with the issuer's common stock?", choices:["Straight preferred","Callable preferred","Convertible preferred","Adjustable-rate preferred"], answer:2, explain:"Convertible preferred can be exchanged for common shares, so its price tracks the common stock."},
  {id:"q-u1-19", unit:"u1", q:"Which type of preferred stock is generally NOT appropriate for an investor seeking fixed, predictable income?", choices:["Straight preferred","Cumulative preferred","Adjustable-rate (variable) preferred","Participating preferred"], answer:2, explain:"Adjustable-rate preferred dividends move with a benchmark, so they aren't fixed."},
  {id:"q-u1-20", unit:"u1", q:"Is a stock dividend taxable when received?", choices:["Yes, as ordinary income","Yes, as a capital gain","No, it's not taxable when received","Only if over 10%"], answer:2, explain:"Stock dividends are not taxable; they lower the cost basis per share instead."},

  {id:"q-u2-2", unit:"u2", q:"ADRs trade and pay dividends to U.S. investors in:", choices:["The foreign country's currency","U.S. dollars","Gold-backed credits","Euros only"], answer:1, explain:"The depositary bank converts foreign dividends into USD for investors."},
  {id:"q-u2-3", unit:"u2", q:"Rule 144 covers trading restrictions on:", choices:["Only municipal bonds","Restricted stock and control stock","Only mutual funds","Only options"], answer:1, explain:"Rule 144 covers both restricted (unregistered) stock and control stock held by insiders."},
  {id:"q-u2-4", unit:"u2", q:"Restricted stock must generally be held or fully paid for at least:", choices:["30 days","6 months","1 year","5 years"], answer:1, explain:"Restricted securities have a 6-month minimum holding period before they can be sold."},
