  {id:"q-u1-1", unit:"u1", q:"ABC Corporation has issued 500,000 shares of its common stock and currently holds 40,000 shares in its treasury. How many shares does ABC have outstanding?", choices:["540,000 shares","500,000 shares","460,000 shares","40,000 shares"], answer:2, explain:"Outstanding = Issued − Treasury: 500,000 − 40,000 = 460,000 shares outstanding."},
  {id:"q-u1-2", unit:"u1", q:"A company issued 600,000 shares and holds 40,000 in treasury. How many shares are outstanding?", choices:["640,000","600,000","560,000","40,000"], answer:2, explain:"600,000 − 40,000 = 560,000 outstanding shares."},
  {id:"q-u1-3", unit:"u1", q:"A company's market capitalization is calculated by multiplying its current market price per share by which of the following?", choices:["Authorized shares","Outstanding shares","Issued shares plus treasury shares","Par value per share"], answer:1, explain:"Market cap = outstanding shares × current market value (CMV) per share."},
  {id:"q-u1-4", unit:"u1", q:"Ted's Wholesale Produce, Inc., trades at $3.75 per share and is not listed on a national exchange. Ted's Wholesale common stock would be classified as a:", choices:["Blue-chip stock","Mid-cap stock","Penny stock","Treasury stock"], answer:2, explain:"Penny stocks are unlisted securities trading below $5/share — Ted's Wholesale fits both criteria."},
  {id:"q-u1-5", unit:"u1", q:"A customer calls a representative and requests to purchase 20,000 shares of Ted's Wholesale common stock, a $3.75 penny stock. This is the customer's first trade in the security. Before entering this SOLICITED trade, the representative must ensure the customer has received:", choices:["A prospectus only","A penny stock risk disclosure document, signed and dated","Nothing — the order may be entered as-is","A margin agreement"], answer:1, explain:"Customers must receive a penny stock risk disclosure document and sign/date an acknowledgment before a solicited penny stock trade."},
  {id:"q-u1-6", unit:"u1", q:"A customer has held a brokerage account for 14 months and made a deposit of funds during that time. Under penny stock rules, this customer is considered an \"established customer,\" which means they are exempt from which requirement?", choices:["The risk disclosure document","The suitability statement","Monthly account statements","Commission disclosure"], answer:1, explain:"Established customers are exempt from the suitability statement, but disclosure rules still apply."},
  {id:"q-u1-7", unit:"u1", q:"A customer calls their representative out of the blue and instructs them to buy shares of a penny stock — the representative made no recommendation. Does this UNSOLICITED transaction require a signed suitability statement?", choices:["Yes, always required","No — unsolicited trades are exempt from suitability and disclosure rules","Only if the trade exceeds $5,000","Only for new accounts"], answer:1, explain:"The customer called the representative, so this is unsolicited — penny stock suitability/disclosure rules don't apply to unsolicited trades."},
  {id:"q-u1-8", unit:"u1", q:"DEF, Inc.'s board of directors declares a $1-per-share dividend payable to shareholders of record on Tuesday, August 4. To receive this dividend, an investor must purchase DEF shares:", choices:["On the record date itself","On the payable date","Before the ex-dividend date","Anytime after the declaration date"], answer:2, explain:"Buying before the ex-dividend date entitles the buyer to the dividend; buying on or after it means the seller keeps it."},
  {id:"q-u1-9", unit:"u1", q:"DEF, Inc. shares trade on a national exchange. The board declares a $1-per-share dividend payable to shareholders of record on August 4. Which of the following would set the ex-dividend date?", choices:["DEF's board of directors","The exchange where DEF shares trade","The SEC","The shareholder"], answer:1, explain:"The ex-dividend date is set by FINRA, or by the exchange if the stock is listed on one."},
  {id:"q-u1-10", unit:"u1", q:"Which of the following correctly lists the order in which dividend-related dates occur (remember DERP)?", choices:["Ex-dividend, Declaration, Record, Payable","Declaration, Record, Ex-dividend, Payable","Declaration, Ex-dividend, Record, Payable","Record, Declaration, Payable, Ex-dividend"], answer:2, explain:"DERP = Declaration, Ex-dividend, Record, Payable."},
  {id:"q-u1-11", unit:"u1", q:"XYZ Corporation is electing 3 directors at its annual meeting under statutory voting. A shareholder who owns 100 shares may cast a maximum of how many votes for any ONE board seat?", choices:["100 votes","300 votes","33 votes","1 vote"], answer:0, explain:"Statutory voting: 1 vote per share per seat, votes can't be combined — max 100 votes for any one seat."},
  {id:"q-u1-12", unit:"u1", q:"XYZ Corporation is electing 3 directors at its annual meeting under cumulative voting. A shareholder who owns 100 shares has how many total votes to allocate however they choose?", choices:["100 votes","300 votes","3 votes","33 votes"], answer:1, explain:"Cumulative voting: 100 shares × 3 seats = 300 total votes, combinable any way the shareholder wants."},
  {id:"q-u1-13", unit:"u1", q:"An investor owns 10% of ABC Corporation. ABC announces it will issue additional shares. Which shareholder right allows this investor to buy enough of the new shares to keep their ownership at 10%?", choices:["Statutory voting","The right to freely transfer shares","Preemptive rights","The right to information"], answer:2, explain:"Preemptive rights protect a shareholder's proportionate ownership when new shares are issued."},
  {id:"q-u1-14", unit:"u1", q:"ABC Corporation enters bankruptcy. Which of the following correctly ranks the payout order among its bondholders, preferred stockholders, and common stockholders?", choices:["Common, preferred, bondholders","Bondholders, preferred, common","Preferred, bondholders, common","All three are paid equally"], answer:1, explain:"Debt is paid first as senior securities, then preferred stock, then common stock (if anything remains)."},
  {id:"q-u1-15", unit:"u1", q:"Unless a question states otherwise, the SIE exam assumes preferred stock has a par value of:", choices:["$1,000","$50","$100","$25"], answer:2, explain:"Assume $100 par for preferred stock (vs. $1,000 for bonds) unless told otherwise."},
  {id:"q-u1-16", unit:"u1", q:"RST Corporation has 6% preferred stock outstanding with a $100 par value. How much does this preferred stock pay per year?", choices:["$0.60","$6.00","$60.00","$16.00"], answer:1, explain:"6% × $100 par = $6.00 per year."},
  {id:"q-u1-17", unit:"u1", q:"RST Corporation suspends its preferred dividend for two years due to financial trouble, then resumes payments. If the preferred stock is CUMULATIVE, what must RST do before paying common stockholders again?", choices:["Nothing — missed dividends are simply forgiven","Pay the two years of dividends in arrears plus the current year's dividend first","Pay only the current year's dividend","Convert the arrears into additional common shares"], answer:1, explain:"Cumulative preferred dividends accrue and must be paid in full — plus the current dividend — before common receives anything."},
  {id:"q-u1-18", unit:"u1", q:"A preferred stock is convertible at $40 into ABC common stock. Once ABC common rises above $40, this preferred stock's price will most likely:", choices:["Stay fixed regardless of the common stock's price","Track the value of ABC's common stock","Immediately drop to zero","Only move with interest rates, not the common stock"], answer:1, explain:"Convertible preferred can be exchanged for common shares, so once conversion becomes attractive, its price tracks the common stock."},
  {id:"q-u1-19", unit:"u1", q:"A registered representative is working with a client who specifically wants fixed, predictable income. Which type of preferred stock would be the LEAST appropriate recommendation?", choices:["Straight preferred","Cumulative preferred","Adjustable-rate (variable) preferred","Participating preferred"], answer:2, explain:"Adjustable-rate preferred dividends move with a benchmark like T-bills, so they aren't fixed — a poor fit for this client."},
  {id:"q-u1-20", unit:"u1", q:"ABC Corporation declares that shareholders of record on a certain date will receive one additional share for every 10 shares they already own. Is this distribution taxable to the shareholder when received?", choices:["Yes, as ordinary income","Yes, as a capital gain","No — it's a stock dividend and isn't taxable when received","Only if the distribution exceeds 10%"], answer:2, explain:"Stock dividends are not taxable when received; they lower the investor's cost basis per share instead."},
  {id:"q-u1-21", unit:"u1", q:"Who is responsible for overseeing company management and voting to declare dividends?", choices:["The SEC","The Board of Directors","FINRA","The transfer agent"], answer:1, explain:"The BOD, elected by common shareholders, oversees management and declares dividends."},
  {id:"q-u1-22", unit:"u1", q:"Which document must a public company file annually with the SEC, containing its audited full-year financial statements?", choices:["Form 10-Q","Form 8-K","Form 10-K","A proxy statement"], answer:2, explain:"The 10-K is the annual report filed with the SEC containing audited financials."},
  {id:"q-u1-23", unit:"u1", q:"Which of the following is an advantage common shareholders have that preferred shareholders typically do NOT?", choices:["Priority dividend payments","Voting rights for the board of directors","Priority over common in liquidation","A callable feature"], answer:1, explain:"Preferred stock generally lacks voting rights; that's the trade-off for its fixed dividend priority."},
  {id:"q-u1-24", unit:"u1", q:"A beverage company pays shareholders a case of its newest soda flavor instead of a cash payment. This is an example of a:", choices:["Cash dividend","Stock dividend","Product dividend","Liquidating dividend"], answer:2, explain:"A product dividend distributes the company's own goods instead of cash or stock."},
  {id:"q-u1-25", unit:"u1", q:"An investor sells shares on the open market through their broker without ever needing the issuing company's permission. This illustrates a common shareholder's:", choices:["Preemptive right","Right to freely transfer shares","Right to inspect corporate books","Cumulative voting right"], answer:1, explain:"Common shareholders can freely transfer/sell shares without needing issuer approval."},
  {id:"q-u1-26", unit:"u1", q:"XYZ 6% preferred stock is described as \"participating to 9%.\" In a highly profitable year, what is the MOST this preferred stock could pay?", choices:["6% only, regardless of profits","Up to 9% total, if the board approves the extra amount","15% (6% + 9%)","Whatever common stock pays that year"], answer:1, explain:"Participating preferred receives its fixed dividend plus a possible extra dividend, up to the stated participation cap, if the board approves it."},
  {id:"q-u1-27", unit:"u1", q:"Members of a corporation's Board of Directors are typically elected by:", choices:["The SEC","FINRA","A vote of common shareholders","The preferred shareholders only"], answer:2, explain:"Common shareholders elect the board of directors, typically via statutory or cumulative voting."},
  {id:"q-u1-28", unit:"u1", q:"A shareholder wants to review a list of fellow shareholders for a credible business reason. This request falls under the shareholder's:", choices:["Right to transfer shares","Right to information","Preemptive right","Right to a dividend"], answer:1, explain:"Shareholders have a right to certain corporate records/information, such as shareholder lists and financial disclosures."},
  {id:"q-u1-29", unit:"u1", q:"Which of the following corporate actions would most likely require shareholder approval?", choices:["Declaring a quarterly dividend","Firing the CEO","Hiring a new CFO","Changing the corporation's name"], answer:3, explain:"Routine management decisions like declaring dividends or hiring/firing executives are within the board's power. A significant change like renaming the corporation typically requires shareholder approval."},
  // ---- Unit 2 ----
  {id:"q-u2-1", unit:"u2", q:"A U.S. depositary bank purchases shares of a Japanese electronics company, holds them at a foreign branch, and issues a receipt against them to U.S. investors. This receipt is best described as a(n):", choices:["U.S. Treasury security","American Depositary Receipt (ADR)","Municipal bond","Mutual fund share class"], answer:1, explain:"ADRs let U.S. investors hold foreign company shares via a U.S. depositary bank, trading in USD on U.S. markets."},
  {id:"q-u2-2", unit:"u2", q:"A U.S. investor holding ADRs of a French company receives dividends. In what currency are those dividends paid to the investor?", choices:["Euros","U.S. dollars","Whatever currency the investor requests","Gold-backed credits"], answer:1, explain:"The depositary bank converts foreign dividends into USD before paying ADR holders."},
  {id:"q-u2-3", unit:"u2", q:"Your client holds ADRs of Daikon Motors, an automobile manufacturer based in Asia. All of the following are true about this position EXCEPT:", choices:["They will receive dividends in U.S. dollars","The security may be traded in U.S. markets","They have the same voting rights as a direct owner of Daikon's common stock","They have the right to request the underlying common shares be issued to them directly"], answer:2, explain:"Depositary banks are not required to pass voting rights through to ADR holders — so an ADR holder generally does NOT have the same voting rights as a direct shareholder."},
  {id:"q-u2-4", unit:"u2", q:"Rule 144, part of the Securities Act of 1933, places trading restrictions on which two categories of stock?", choices:["Only municipal bonds","Restricted (unregistered) stock and control stock","Only mutual fund shares","Only listed options"], answer:1, explain:"Rule 144 covers both restricted (unregistered) stock and control stock held by insiders."},
  {id:"q-u2-5", unit:"u2", q:"A customer purchases newly issued shares of a company through a private placement. The certificates carry a restrictive legend. Generally, how long must the customer hold these shares (fully paid) before they may be sold?", choices:["30 days","6 months","1 year","5 years"], answer:1, explain:"Restricted securities have a 6-month minimum holding period before they can be sold."},
  {id:"q-u2-6", unit:"u2", q:"An unaffiliated individual owns 7% of XYZ Corporation's voting stock. That person's spouse separately owns 4% of the same stock. Under Rule 144, are either of them considered control persons?", choices:["No — neither individually owns 10% or more","Yes — combined family holdings of 11% make BOTH of them control persons","Only the spouse who owns the larger amount","Only if they are both officers of the company"], answer:1, explain:"Family holdings are combined when counting toward the 10% control-person threshold — together they own 11%, so both are control persons."},
  {id:"q-u2-7", unit:"u2", q:"Ron owns 4% of Copper Mountain Metals Corporation; his spouse Lori owns 8%. Copper Mountain has 2.4 million shares outstanding. The average weekly trading volume over the last 4 weeks was 24,500 shares. Under Form 144, what is the maximum number of shares Ron may sell in the next 90 days?", choices:["24,000 shares","24,500 shares","32,000 shares","48,500 shares"], answer:1, explain:"1% of 2.4 million shares = 24,000. The 4-week average volume is 24,500. The volume limit is the GREATER of the two, so 24,500 shares."},
  {id:"q-u2-8", unit:"u2", q:"Under Rule 144, which of the following sales are subject to volume limitations on the number of shares sold?\n\nI. A control person selling registered stock held for one year\nII. A control person selling restricted stock held for two years\nIII. A nonaffiliate selling registered stock held for one month\nIV. A nonaffiliate selling restricted stock held for more than six months", choices:["I and II only","I and III only","III and IV only","I, II, III, and IV"], answer:0, explain:"Control persons are always subject to Rule 144 volume limits, whether their stock is registered or restricted (I and II). Nonaffiliates have no volume limits on registered stock, and none on restricted stock once the 6-month hold has passed."},
  {id:"q-u2-9", unit:"u2", q:"American Liquidators Corporation (Ticker LQDT) has 100 million shares outstanding and wants to raise capital by selling 100 million new shares to the public. To let existing shareholders maintain their proportionate ownership first, LQDT would most likely:", choices:["Offer warrants to existing shareholders","Suggest existing shareholders double their position on the open market","Offer stock rights to existing shareholders","Perform a reverse stock split"], answer:2, explain:"Stock rights (preemptive rights) let existing shareholders buy newly issued shares below market price before the general public can, preserving their ownership percentage."},
  {id:"q-u2-10", unit:"u2", q:"Seabird Shipping, Inc. has 1 million shares outstanding, trading at $50. Seabird raises capital via a rights offering, allowing shareholders to buy new shares for 10 rights plus $48/share. Is the $48 subscription price above or below Seabird's current $50 market price?", choices:["Above the current market price","Below the current market price","Exactly equal to the current market price","Rights don't have a subscription price"], answer:1, explain:"Rights let shareholders buy new shares at a discount to the current market price — $48 is below Seabird's $50 market price."},
  {id:"q-u2-11", unit:"u2", q:"Squidco, Inc. issues $100 million in bonds. Buyers of the bonds also receive an additional security allowing them to purchase 20 shares of Squidco common stock at $50/share anytime in the next 10 years, even though Squidco stock currently trades at $29.95. This additional security is an example of a:", choices:["Stock right","Warrant","Follow-on offering","Call feature"], answer:1, explain:"This is a warrant: long-term, attached to a bond as a sweetener, with an exercise price currently above the market price."},
  {id:"q-u2-12", unit:"u2", q:"Nokamura Industries issues bonds with 10 warrants attached to each bond as a sweetener. These warrants can later be:", choices:["Only exercised, never sold separately","Detached and traded separately from the bond","Converted into preferred stock only","Redeemed only if Nokamura goes bankrupt"], answer:1, explain:"Warrants attached to a bond or preferred stock as a sweetener can be detached and traded separately on their own."},
  {id:"q-u2-13", unit:"u2", q:"A customer owns 100 shares of ABC Corp. common stock, purchased at $60/share, now trading at $150/share. ABC declares a 3-for-1 forward split. What is the value of the customer's position immediately after the split?", choices:["$45,000","$4,500","$5,000","$15,000"], answer:3, explain:"A split doesn't change total position value: 100 shares × $150 = $15,000 before, and 300 shares × $50 = $15,000 after."},
  {id:"q-u2-14", unit:"u2", q:"An investor holds 100 shares at $5/share before a 1-for-4 reverse split. After the split, they hold:", choices:["400 shares at $1.25","25 shares at $20","25 shares at $5","100 shares at $20"], answer:1, explain:"1:4 reverse split: 100 × 1/4 = 25 shares; total value stays $500, so $500 ÷ 25 = $20/share."},
  {id:"q-u2-15", unit:"u2", q:"Sea/Air Services and Bird Flights combine to form a brand-new company, Seabird Airlines. Shareholders of both original airlines receive Seabird shares, and their old Sea/Air and Bird shares are canceled. This is an example of a:", choices:["Spin-off","Merger","Tender offer","Stock buyback"], answer:1, explain:"In a merger, two or more companies combine into a new company; old shares are canceled and replaced with shares of the combined company."},
  {id:"q-u2-16", unit:"u2", q:"Seabird Airlines later acquires Short Hop Air, a small regional carrier. Short Hop's shareholders receive Seabird shares, and Short Hop's own shares are canceled. This is an example of a(n):", choices:["Merger","Acquisition","Spin-off","Tender offer"], answer:1, explain:"In an acquisition, one company takes over another's operations and assets; the acquired company's shares are canceled for shares of the acquirer."},
  {id:"q-u2-17", unit:"u2", q:"Seabird Airlines forms a new subsidiary, Seagull Air, and distributes Seagull shares to its existing shareholders — who ALSO keep their original Seabird shares. This corporate action is a:", choices:["Merger","Acquisition","Spin-off","Tender offer"], answer:2, explain:"In a spin-off, shareholders receive new company shares AND keep their original shares in the parent company."},
  {id:"q-u2-18", unit:"u2", q:"Which of the following corporate actions is normally an all-CASH offer that creates a taxable event for the shareholder?", choices:["A stock dividend distribution","A stock buyback or tender offer","A stock-for-stock merger","A forward stock split"], answer:1, explain:"Buybacks and tender offers are typically cash transactions, treated as a taxable sale of the security."},
  {id:"q-u2-19", unit:"u2", q:"ABC Corporation acquires LMN, Inc. in an all-stock offer — LMN shareholders receive 1 share of ABC for each LMN share. What are the tax implications for LMN's shareholders?", choices:["LMN shareholders owe capital gains tax immediately","LMN shareholders have no tax consequences from this stock-for-stock exchange","LMN shareholders must pay ordinary income tax on the full value","ABC shareholders, not LMN shareholders, owe the tax"], answer:1, explain:"Receiving stock (no cash) in a merger is generally not a taxable event for the shareholders who received it."},
  {id:"q-u2-20", unit:"u2", q:"An issuer must generally notify shareholders of a corporate action (like a dividend or stock split) how many days before the record date, at minimum?", choices:["1 day","10 days","30 days","90 days"], answer:1, explain:"Notice must generally be given at least 10 days before the record date."},
  {id:"q-u2-21", unit:"u2", q:"A proxy given by a shareholder to another party is best described as which of the following?", choices:["A type of preferred stock","A limited power of attorney to vote on the shareholder's behalf","A corporate merger document","A dividend reinvestment plan"], answer:1, explain:"A proxy works like an absentee ballot / limited power of attorney for voting at the shareholder meeting."},
  {id:"q-u2-22", unit:"u2", q:"A customer's stock is held in street name. The company is voting on a proposed merger — a MAJOR matter — and the customer never returns a proxy by the 10th day before the meeting. What must the member firm do?", choices:["Vote however it believes is in the customer's best interest","Not vote the shares at all","Vote against the merger by default","Vote with whatever the majority of other shareholders decide"], answer:1, explain:"On major matters, an undirected member firm may NEVER vote the customer's shares — they simply go unvoted."},
  {id:"q-u2-23", unit:"u2", q:"A customer's stock is held in street name. The company is voting on a routine, MINOR matter, and the customer never returns a proxy by the 10th day before the meeting. What may the member firm do?", choices:["Vote the shares as recommended by the issuer's management","Not vote the shares under any circumstances","Call the customer and demand instructions before the meeting","Automatically vote against the proposal"], answer:0, explain:"On minor matters, an undirected member firm may vote the shares as it sees fit — typically following management's recommendation."},
  {id:"q-u2-24", unit:"u2", q:"When a customer's stock is held in \"street name\" by a broker-dealer, who is considered the beneficial owner of the shares?", choices:["The broker-dealer","The customer","The transfer agent","The SEC"], answer:1, explain:"The broker-dealer is the nominal/record owner on the company's books, but the customer remains the beneficial owner with all economic rights."},
  {id:"q-u2-25", unit:"u2", q:"A foreign government withholds tax on dividends paid to a U.S. investor's ADR holdings. The investor may be able to offset this by claiming a:", choices:["Foreign tax credit","Capital loss deduction","Wash sale adjustment","Alternative minimum credit"], answer:0, explain:"Investors can often claim a foreign tax credit on their U.S. tax return for taxes withheld abroad."},
  {id:"q-u2-26", unit:"u2", q:"A company executes a 3-for-2 forward split. An investor holding 100 shares at $60 will now hold:", choices:["150 shares at $40","150 shares at $60","200 shares at $30","100 shares at $90"], answer:0, explain:"3:2 split: 100 × 3/2 = 150 shares; price adjusts to $60 × 2/3 = $40, keeping total position value the same ($6,000)."},
  {id:"q-u2-27", unit:"u2", q:"A company offers to buy shares directly from any shareholder willing to sell, at a stated price, within a set window of time. This is best described as a:", choices:["Stock buyback","Tender offer","Rights offering","Stock split"], answer:1, explain:"A tender offer is a formal, public offer to all shareholders to purchase shares at a set price during a specific window."},
  {id:"q-u2-28", unit:"u2", q:"Selling restricted or control securities above certain thresholds under Rule 144 requires filing which form with the SEC?", choices:["Form 144","Form 10-K","A proxy statement","Form 8-K"], answer:0, explain:"Form 144 is filed with the SEC when selling restricted/control securities above certain thresholds under Rule 144."},
  {id:"q-u2-29", unit:"u2", q:"A corporation makes a tender offer for its own outstanding bonds. Why would a corporation most likely do this?", choices:["To increase its total debt load","To retire the debt early","To convert the debt into new equity","To avoid ever repaying the principal"], answer:1, explain:"Corporations sometimes make a tender offer for their own debt as a way to retire it early."},
  {id:"q-u2-30", unit:"u2", q:"A customer signs and returns a proxy statement for stock held in street name but leaves one item on the ballot blank. What must the member firm do with that specific item?", choices:["Leave those shares unvoted on that item","Vote as recommended by the issuer's management","Call the customer before voting","Vote against the proposal by default"], answer:1, explain:"When a signed proxy is returned without voting instructions on an item, the member firm must vote as recommended by the issuer's management — regardless of whether the matter is major or minor."},
  {id:"q-u2-31", unit:"u2", q:"A depositary bank issues an ADR and later receives a shareholder voting proxy from the foreign issuer. Is the bank required to pass that vote along to the ADR holder?", choices:["Yes, always required by law", "No — the bank is not required to pass voting proxies through to ADR holders","Only if the ADR holder owns more than 1,000 shares","Only for ADRs traded on the NYSE"], answer:1, explain:"Depositary banks are not required to pass voting proxies or preemptive rights through to ADR holders."},
  // ---- Unit 3 ----
  {id:"q-u3-1", unit:"u3", q:"A corporate bond issue is structured so that the ENTIRE principal of the issue matures on a single date, with a sinking fund set aside to help cover that payment. This describes a:", choices:["Serial bond","Term bond","Balloon bond","Zero-coupon bond"], answer:1, explain:"A term bond's entire principal matures on a single date (may have a sinking fund to help pay it off)."},
  {id:"q-u3-2", unit:"u3", q:"In bond pricing, 1 point equals what dollar amount on a standard $1,000 par bond?", choices:["$1","$10","$100","$1,000"], answer:1, explain:"1 point = 1% of $1,000 par value = $10."},
  {id:"q-u3-3", unit:"u3", q:"A customer is told a trade to purchase 20 bonds at 100 has been executed for their account. Before commission, how much did the customer pay?", choices:["$2,000","$200,000","$20,000","$1,000"], answer:2, explain:"20 bonds × $1,000 par (quoted at 100 = par) = $20,000."},
  {id:"q-u3-4", unit:"u3", q:"If market interest rates rise, bond prices in the secondary market will generally:", choices:["Rise","Fall","Stay exactly the same","Double"], answer:1, explain:"Bond prices and interest rates move inversely — rising rates push existing bond prices down."},
  {id:"q-u3-5", unit:"u3", q:"A bond is quoted at 90. What is its dollar price?", choices:["$90","$900","$9,000","$90,000"], answer:1, explain:"90 points × $10/point = $900."},
  {id:"q-u3-6", unit:"u3", q:"The formula for a bond's Current Yield is:", choices:["Par value ÷ market price","Annual coupon payment ÷ market price","Market price ÷ annual coupon","Coupon rate × par value"], answer:1, explain:"Current Yield = annual coupon payment ÷ current market price."},
  {id:"q-u3-7", unit:"u3", q:"A bond is trading at a DISCOUNT to par. Which of the following correctly ranks its yields from LOWEST to HIGHEST?", choices:["YTC < YTM < CY < Coupon","Coupon < CY < YTM < YTC","CY < Coupon < YTC < YTM","Coupon = CY = YTM = YTC"], answer:1, explain:"For a discount bond: Coupon < Current Yield < YTM < YTC."},
  {id:"q-u3-8", unit:"u3", q:"100 basis points is equivalent to:", choices:["0.1%","1%","10%","100%"], answer:1, explain:"1 basis point = 1/100 of 1%, so 100 basis points = 1%."},
  {id:"q-u3-9", unit:"u3", q:"A 6% corporate bond is described as \"trading on a basis of 7%.\" This means the bond is trading:", choices:["At a premium, with a YTM of 7%","At a discount, with a YTM of 7%","With a current yield below the coupon rate","With a coupon rate that has changed to 7%"], answer:1, explain:"\"Trading on a basis of\" refers to YTM. A YTM of 7% above a 6% coupon means the bond is trading at a discount (YTM rises as price falls below par)."},
  {id:"q-u3-10", unit:"u3", q:"A bond's call feature, which allows the ISSUER to redeem the bond before maturity, primarily benefits the:", choices:["Investor","Issuer","Underwriter","Transfer agent"], answer:1, explain:"Call features let the issuer redeem debt early (usually when rates fall) — this benefits the issuer, not the investor."},
  {id:"q-u3-11", unit:"u3", q:"A bond's put feature, which allows the INVESTOR to force early repayment, primarily benefits the:", choices:["Issuer","Bondholder (investor)","SEC","Underwriter"], answer:1, explain:"Put features let the investor force early repayment, typically exercised when rates rise — this benefits the bondholder."},
  {id:"q-u3-12", unit:"u3", q:"Lonsdale Corporation issues a zero-coupon bond at a price of 50 ($500/bond), maturing in 20 years at $1,000 par. How is the annual interest on this bond taxed to the investor?", choices:["Never taxed, since no cash interest is ever paid","All at once, when the bond matures","Annually as it accretes toward par, even though no cash is received yet","Only if the bond is sold before maturity"], answer:2, explain:"Zero-coupon bond interest accretes annually and is taxed each year as \"phantom income,\" even though the investor doesn't receive cash until maturity."},
  {id:"q-u3-13", unit:"u3", q:"According to Standard & Poor's rating system, what are the four highest bond rating grades, from best to lowest?", choices:["Aaa, Aa, A, Baa","A, Aa, Aaa, B","B, A, AA, AAA","AAA, AA, A, BBB"], answer:3, explain:"S&P's top four ratings, highest to lowest, are AAA, AA, A, BBB. (Aaa, Aa, A, Baa would be Moody's equivalent.)"},
  {id:"q-u3-14", unit:"u3", q:"Bonds rated BB/Ba or lower are commonly referred to as:", choices:["Investment grade bonds","High-yield (junk) bonds","Municipal bonds","Treasury bonds"], answer:1, explain:"BB/Ba and below = high-yield/junk bonds, with greater default risk and higher volatility."},
  {id:"q-u3-15", unit:"u3", q:"Which of the following debt securities would experience the HIGHEST price volatility if interest rates change?", choices:["A 3% coupon bond maturing in 10 years","A zero-coupon bond maturing in 10 years","A zero-coupon bond maturing in 5 years","A 3% coupon bond maturing in 5 years"], answer:1, explain:"Longer maturity AND lower coupon both increase volatility — a 10-year zero-coupon bond combines both traits, making it the most volatile of these four."},
  {id:"q-u3-16", unit:"u3", q:"ABC Corporation enters bankruptcy liquidation. Which creditor class is paid FIRST, ahead of everyone else?", choices:["Common stockholders","Subordinated debt holders","Secured debt holders","Preferred stockholders"], answer:2, explain:"Secured debt holders are paid first, from the sale of their specific collateral."},
  {id:"q-u3-17", unit:"u3", q:"A bond backed only by the issuer's full faith and credit, with no collateral pledged, is best described as a:", choices:["Mortgage bond secured by real estate","Debenture — unsecured but senior among unsecured debt","A type of municipal note","A bond guaranteed by a third party"], answer:1, explain:"Debentures are unsecured bonds — the most senior unsecured debt a corporation can issue."},
  {id:"q-u3-18", unit:"u3", q:"Which Treasury securities are issued at a discount with no stated interest rate?", choices:["T-notes and T-bonds","TIPS and T-notes","T-bills and STRIPS","GNMA and FNMA"], answer:2, explain:"T-bills and STRIPS are issued at a discount with no stated coupon rate, similar to zero-coupon bonds."},
  {id:"q-u3-19", unit:"u3", q:"Treasury notes (T-notes) have a maturity range of approximately:", choices:["Less than 1 year","2–10 years","10–30 years","30–50 years"], answer:1, explain:"T-notes are intermediate-term, maturing in 2–10 years."},
  {id:"q-u3-20", unit:"u3", q:"Which of the following agency securities is the ONLY one backed by the full faith and credit of the U.S. government?", choices:["FNMA (Fannie Mae)","FHLMC (Freddie Mac)","GNMA (Ginnie Mae)","The Farm Credit System"], answer:2, explain:"GNMA (Ginnie Mae) is the only agency security backed by the full faith and credit of the U.S. government."},
  {id:"q-u3-21", unit:"u3", q:"A city issues bonds to build a new public park, which produces no revenue, and repays bondholders through property tax collections. This is an example of a:", choices:["Revenue bond","General Obligation (GO) bond","Corporate debenture","Money market instrument"], answer:1, explain:"GO bonds are backed by the issuer's taxing power and used for non-revenue-producing projects like parks and schools."},
  {id:"q-u3-22", unit:"u3", q:"A city issues bonds to build a toll bridge and repays bondholders only from the tolls that bridge collects. This is an example of a:", choices:["General Obligation (GO) bond","Revenue bond","Federal agency bond","Guaranteed bond"], answer:1, explain:"Revenue bonds are self-supporting, backed by the revenue from the specific project financed."},
  {id:"q-u3-23", unit:"u3", q:"Municipal bond interest is generally exempt from which type of tax?", choices:["State tax for all investors, everywhere","Federal income tax","Capital gains tax on the sale of the bond","All taxes with no exceptions whatsoever"], answer:1, explain:"Muni interest is usually federally tax-exempt (and state-exempt for residents of the issuing state); capital gains from selling the bond are still taxable."},
  {id:"q-u3-24", unit:"u3", q:"An investor in the 30% tax bracket is comparing a taxable bond to a municipal bond yielding 7%. What is the muni's taxable-equivalent yield?", choices:["7.7%","10%","4.9%","21%"], answer:1, explain:"Tax-equivalent yield = 7% ÷ (100% − 30%) = 7% ÷ 0.70 = 10%."},
  {id:"q-u3-25", unit:"u3", q:"By definition, a money market instrument has a maturity of:", choices:["1 year or less","1–5 years","5–10 years","10+ years"], answer:0, explain:"Money market securities, by definition, mature in 1 year or less."},
  {id:"q-u3-26", unit:"u3", q:"What is the maximum maturity commercial paper can have and still qualify for its usual exemption?", choices:["90 days","180 days","270 days","365 days"], answer:2, explain:"Commercial paper matures in 1–270 days, though most is issued for 90 days or less."},
  {id:"q-u3-27", unit:"u3", q:"A dealer buys securities from an investor today and agrees to sell them back later at a higher price. From the dealer's side, this transaction is called a:", choices:["Repurchase agreement (repo)","Reverse repurchase agreement (reverse repo)","Banker's acceptance","Federal funds transaction"], answer:1, explain:"In a reverse repo, the dealer buys securities from an investor and agrees to resell them later at a higher price."},
  {id:"q-u3-28", unit:"u3", q:"On the exam, the term \"series bond\" most likely refers to:", choices:["A bond maturity type, alongside term/serial/balloon bonds","A type of collateral, like an equipment trust certificate", "A savings bond, such as a Series EE or Series I bond","A municipal revenue bond"], answer:2, explain:"\"Series\" is not a bond maturity structure or collateral type — it's a common exam trick, since \"series bond\" normally points to savings bonds like Series EE or Series I."},
  {id:"q-u3-29", unit:"u3", q:"Series EE and Series I savings bonds differ from Treasury notes/bonds in that they:", choices:["Trade actively on the secondary market","Are non-marketable and redeemed directly with the Treasury","Pay dividends instead of interest","Are issued by municipalities"], answer:1, explain:"Savings bonds are non-marketable — they can't be sold to other investors, only redeemed with the Treasury."},
  {id:"q-u3-30", unit:"u3", q:"A corporation sets aside cash every year to help retire a large bond issue when it matures. This dedicated cash reserve is called a:", choices:["Sinking fund","Repurchase agreement","Escrow account","Debenture reserve"], answer:0, explain:"A sinking fund sets aside cash periodically to help retire term bonds, reducing default risk."},
  {id:"q-u3-31", unit:"u3", q:"A small municipality issues bonds but has never paid a rating agency to evaluate them. What does this \"nonrated\" status tell an investor about the bonds' quality?", choices:["The bonds are guaranteed to default","Nothing definitive — no rating exists, though this may raise perceived risk", "The bonds are automatically exempt from federal tax","The bonds have no stated maturity date"], answer:1, explain:"Nonrated simply means no agency has evaluated the bond — it doesn't automatically mean poor quality, but the lack of information often raises perceived risk."},
  {id:"q-u3-32", unit:"u3", q:"In a corporate bankruptcy liquidation, administrative claimants (attorneys, courts, appraisers, liquidators) are paid:", choices:["Before secured creditors, ahead of everyone", "After secured creditors, but before any other unsecured debt or stockholders", "Only after all other creditors and stockholders are paid", "At the same time as common stockholders"], answer:1, explain:"Administrative claimants are paid after secured creditors collect from their collateral, but before general unsecured creditors, subordinated debt, and stockholders."},
  {id:"q-u3-33", unit:"u3", q:"An airline issues bonds backed specifically by a fleet of new planes it owns. If the airline defaults, bondholders have a claim on those planes. This type of secured bond is called a(n):", choices:["Debenture","Equipment trust certificate","Income bond","Guaranteed bond"], answer:1, explain:"Equipment trust certificates pledge specific equipment (like railcars or aircraft) as collateral, common with transportation companies."},
  {id:"q-u3-34", unit:"u3", q:"A brokerage firm buys Treasury bonds, strips the coupons from the principal, and repackages the pieces as zero-coupon products backed by its own custody of the underlying securities. Unlike STRIPS, this product is called a:", choices:["Treasury receipt, privately created by the broker-dealer","STRIPS, created directly by the U.S. Treasury","A municipal instrument","A Treasury bill"], answer:0, explain:"Treasury receipts are privately created by broker-dealers; STRIPS are created and backed directly by the Treasury itself."},
  {id:"q-u3-35", unit:"u3", q:"An investor living in California buys a bond issued by Puerto Rico. Compared to a typical in-state municipal bond, how is the interest on this territory bond taxed?", choices:["Taxable at the federal level only","Triple tax-exempt — federal, state, and local — for all U.S. investors","Subject to California state tax only","Fully taxable like a corporate bond"], answer:1, explain:"Bonds issued by U.S. territories (Puerto Rico, Guam, U.S. Virgin Islands) are triple tax-exempt for all U.S. investors, regardless of the investor's home state."},
  {id:"q-u3-36", unit:"u3", q:"A Variable-Rate Demand Note (VRDN) has a stated maturity of 30 years, yet investors treat it like a short-term instrument. Why?", choices:["It converts into common stock after 1 year","It has a put feature letting the holder sell it back to the issuer/agent at par on short notice","It pays a fixed rate for its entire 30-year life","It has zero interest rate risk regardless of holding period"], answer:1, explain:"VRDNs have a put feature letting holders sell back at par on short notice, despite a long stated maturity — that's what makes them behave like short-term instruments."},
  {id:"q-u3-37", unit:"u3", q:"Which best describes a negotiable (jumbo) CD?", choices:["Cannot be sold before maturity, no exceptions","Typically under $10,000 and only FDIC-insured up to face value","Usually $100,000+ and tradable on the secondary market before maturity","Issued only directly by the U.S. Treasury"], answer:2, explain:"Negotiable/jumbo CDs are large ($100k+) and can be sold on the secondary market instead of incurring an early-withdrawal penalty."},
  {id:"q-u3-38", unit:"u3", q:"A corporation backs a bond issue by placing a portfolio of Treasury securities into a trust account, to be used only to repay bondholders if the company defaults. This is best described as a:", choices:["Mortgage bond","Equipment trust certificate","Collateral trust bond","Debenture"], answer:2, explain:"A collateral trust bond is secured by a portfolio of securities (often from another issuer) held in trust, not by real estate or equipment."},
  {id:"q-u3-39", unit:"u3", q:"A corporation pledges its headquarters building as collateral for a bond issue. If the corporation defaults, that real estate can be sold to repay bondholders. This is a:", choices:["Collateral trust bond","Mortgage bond","Income bond","Guaranteed bond"], answer:1, explain:"A mortgage bond is backed specifically by real estate the corporation owns."},
  {id:"q-u3-40", unit:"u3", q:"When calculating accrued interest on a CORPORATE bond trade, which day-count convention is used?", choices:["Actual days elapsed / 365-day year","30-day month / 360-day year","Actual days elapsed / 360-day year","30-day month / 365-day year"], answer:1, explain:"Corporate (and municipal) bonds use a 30-day month / 360-day year convention for accrued interest."},
  {id:"q-u3-41", unit:"u3", q:"When calculating accrued interest on a U.S. TREASURY note trade, which day-count convention is used?", choices:["30-day month / 360-day year","Actual calendar days elapsed","15-day month / 180-day year","Treasuries don't accrue interest between coupon dates"], answer:1, explain:"Treasury securities use actual calendar days elapsed, unlike the 30/360 convention used for corporate and municipal bonds."},
  {id:"q-u3-42", unit:"u3", q:"A privately-owned, government-sponsored network of lending institutions raises money by selling debt securities specifically to fund agricultural loans. This is the:", choices:["GNMA","Farm Credit System","FHLMC","Municipal bond market"], answer:1, explain:"The Farm Credit System raises funds through Farm Credit debt securities to provide agricultural financing, overseen by the Farm Credit Administration (FCA)."},
  {id:"q-u3-43", unit:"u3", q:"Compared to a direct Treasury security, how is interest from GNMA, FNMA, and FHLMC securities taxed?", choices:["Exempt from federal tax only","Exempt from state and local tax only, like a Treasury","Taxable at both the federal and state/local level","Fully tax-exempt at all levels"], answer:2, explain:"Unlike direct Treasury securities, agency securities (GNMA, FNMA, FHLMC) are taxable at both the federal and state/local level."},
  {id:"q-u3-44", unit:"u3", q:"A city expects both an upcoming property tax collection AND toll revenue from a new bridge, so it issues a single short-term note anticipating both income sources. This note is a:", choices:["TAN","RAN","TRAN","BAN"], answer:2, explain:"A TRAN (Tax and Revenue Anticipation Note) combines the features of a TAN and a RAN."},
  {id:"q-u3-45", unit:"u3", q:"A town has been approved for a federal infrastructure grant that won't arrive for several months. To fund the project now, it issues a short-term note anticipating that future grant money. This note is called a:", choices:["BAN","GAN","CLN","TRAN"], answer:1, explain:"A GAN (Grant Anticipation Note) is issued in anticipation of grant money, usually from the federal government."},
  {id:"q-u3-46", unit:"u3", q:"A housing authority issues a short-term note to pay contractors while a public housing project is under construction, before longer-term financing is arranged. This note is a:", choices:["Construction Loan Note (CLN)","Tax Anticipation Note (TAN)","Equipment trust certificate","Collateral trust bond"], answer:0, explain:"A CLN provides interim financing specifically for the construction of housing projects."},
  {id:"q-u3-47", unit:"u3", q:"The risk that a bond issuer simply stops paying interest or principal when due is called:", choices:["Purchasing power risk","Default (credit) risk","Interest rate risk","Reinvestment risk"], answer:1, explain:"Default (credit) risk is the risk that the issuer fails to make interest or principal payments — generally the worst outcome of owning a bond."},
  {id:"q-u3-48", unit:"u3", q:"A retiree holds a 30-year bond paying a fixed 4% coupon. During a period of high inflation, this bond is MOST exposed to which risk?", choices:["Default risk","Purchasing power risk","Call risk","Currency risk"], answer:1, explain:"Purchasing power (inflation) risk affects any fixed payment — as prices rise, that fixed 4% coupon buys less and less over time."},
  {id:"q-u3-49", unit:"u3", q:"Which of the following is generally considered the primary reason an investor purchases bonds rather than stocks?", choices:["Long-term capital appreciation potential","Steady, predictable income","Guaranteed tax-free growth in all cases","Voting control of the issuing company"], answer:1, explain:"Bonds are considered the best way to produce steady, predictable current income, since the issuer is contractually obligated to make interest payments or default."}
];

const TIPS = [
  {unit:"u1", mnemonic:"DERP", note:"Dividend dates always happen in this order: Declaration → Ex-dividend → Record → Payable. Buy before the Ex-date to get the dividend."},
  {unit:"u1", mnemonic:"Outstanding = Issued − Treasury", note:"Treasury stock is bought-back stock sitting in the company's pocket — it doesn't vote and doesn't count as outstanding."},
  {unit:"u1", mnemonic:"Statutory = STATic", note:"Statutory voting locks your votes per seat (1 share = 1 vote per seat, can't combine). Cumulative voting lets you stack all your votes on one seat — better for small holders."},
  {unit:"u1", mnemonic:"Debt → Preferred → Common", note:"At bankruptcy, that's the payout order for the 'ownership' side of the balance sheet. Common stockholders are paid last and often get nothing."},
  {unit:"u1", mnemonic:"Preferred par = $100, Bond par = $1,000", note:"Easy mix-up on the exam — preferred stock defaults to $100 par, bonds default to $1,000 par."},
  {unit:"u1", mnemonic:"Cumulative = accumulates, Straight = straight-up lost", note:"Cumulative preferred banks missed dividends as 'arrears' that must be paid later. Straight (noncumulative) just loses them forever."},
  {unit:"u2", mnemonic:"Rights are Quick, Warrants Wait", note:"Rights: short subscription window (30–45 days) to protect existing shareholders' %. Warrants: long-term sweeteners bundled with bonds/preferred stock."},
  {unit:"u2", mnemonic:"Restricted = 6 months, Control = Form 144", note:"Restricted stock just needs a 6-month hold. Control (insider) stock needs Form 144 + the volume limit — the greater of 1% of shares outstanding or the last 4 weeks' average weekly volume."},
  {unit:"u2", mnemonic:"Spin-off = keep AND get", note:"Merger/Acquisition: old shares are canceled, you get new ones. Spin-off: you keep your original shares AND get shares in the new company too."},
  {unit:"u2", mnemonic:"Stock is free, Cash costs you", note:"Receiving stock in a corporate action is generally not taxable. Receiving cash (buybacks, tender offers) is a taxable event."},
  {unit:"u3", mnemonic:"Discount? Climb. Premium? Plunge.", note:"Discount bond: yields climb — Coupon < CY < YTM < YTC. Premium bond: yields fall — Coupon > CY > YTM > YTC. At par, all four are equal."},
  {unit:"u3", mnemonic:"'On a basis of' = YTM", note:"Any time the exam says a bond is quoted 'on a basis of X%,' that X% is the Yield to Maturity."},
  {unit:"u3", mnemonic:"Long & Low = Whoa", note:"Longer maturity + lower coupon rate = more price volatility. A long-term zero-coupon bond is the most volatile of all."},
  {unit:"u3", mnemonic:"Secured, Admin, Unsecured, Subordinated, Preferred, Common", note:"Corporate bankruptcy payout order. Secured debt is paid first from its own collateral, then administrative claims (legal/liquidator costs of running the case), then general unsecured creditors, then subordinated debt, then preferred stock, and common stockholders last."},
  {unit:"u3", mnemonic:"T-bills & STRIPS = discount only", note:"They're the only Treasury securities issued at a discount with no stated interest rate — all the 'interest' shows up at maturity."},
  {unit:"u3", mnemonic:"GNMA is Genuine", note:"Ginnie Mae (GNMA) is the only agency security backed by the full faith and credit of the U.S. government. Fannie and Freddie are not."},
  {unit:"u3", mnemonic:"GO = taxes, Revenue = the project pays", note:"General Obligation bonds are backed by the municipality's taxing power. Revenue bonds are self-supporting from the specific project's income."},
  {unit:"u3", mnemonic:"Tax-equivalent yield: divide by what's left", note:"Municipal yield ÷ (100% − tax bracket). A 7% muni yield at a 30% bracket = 7% ÷ 0.70 = 10% taxable-equivalent yield."}
];

// Facts tested in QUIZ mode that don't have a matching TERMS entry, so they

const GAPS = [
  {id:"gap-1", unit:"u1", title:"Penny stock risk disclosure (solicited trades)", fact:"Before a customer's FIRST solicited penny stock transaction, the broker-dealer must give them a written risk disclosure document and get back a signed, dated acknowledgment. This is separate from — and in addition to — the suitability determination.", quizRef:"Tested in Quiz: q-u1-5"},
  {id:"gap-2", unit:"u1", title:"Who actually sets the ex-dividend date", fact:"A lot of students assume the company sets its own ex-dividend date. It's actually set by FINRA or the relevant exchange, not the issuer. Buy before that date and you get the dividend; buy on or after it and the seller keeps it.", quizRef:"Tested in Quiz: q-u1-9"},
  {id:"gap-3", unit:"u1", title:"Statutory vs. cumulative voting — the max-votes trap", fact:"With statutory voting, votes CANNOT be combined: shares × 1 vote per open seat is your max for any single seat. With cumulative voting, you multiply shares × total open seats, then stack ALL of those votes on one seat if you want. Same share count, very different math depending on which system applies.", quizRef:"Tested in Quiz: q-u1-11, q-u1-12"},
  {id:"gap-4", unit:"u1", title:"Participating preferred — how the bonus actually gets split", fact:"Participating preferred gets its fixed stated dividend PLUS a proportional share of any extra dividend the board declares on top of what common receives — it doesn't just get an arbitrary bonus, the extra amount is tied to what common shareholders are getting.", quizRef:"Tested in Quiz: q-u1-26"},
  {id:"gap-5", unit:"u2", title:"Control person's 10% includes family holdings", fact:"When counting whether someone crosses the 10% ownership threshold that makes them a \"control person,\" shares held by their immediate family are combined with their own — you can't split ownership across relatives to dodge the control-person rules.", quizRef:"Tested in Quiz: q-u2-5"},
  {id:"gap-6", unit:"u2", title:"Form 144 volume limit — only the last 4 weeks count", fact:"When calculating the average weekly trading volume for the Form 144 limit, only the most recent 4 weeks of data are used — older volume figures are ignored even if they were higher. The limit is the GREATER of that 4-week average or 1% of shares outstanding.", quizRef:"Tested in Quiz: q-u2-6"},
  {id:"gap-7", unit:"u2", title:"Proxy voting: major matters vs. minor matters", fact:"If a customer doesn't return a proxy, a member firm CAN vote street-name shares on routine/minor matters (following management's recommendation), but CANNOT vote them on major matters like a merger or a new stock issuance — the firm must leave those shares unvoted.", quizRef:"Tested in Quiz: q-u2-18, q-u2-19"},
  {id:"gap-8", unit:"u2", title:"Beneficial owner vs. record (street name) owner", fact:"When shares are held in \"street name,\" the brokerage firm is the name on the company's books (the record/nominal owner), but the customer is the beneficial owner — they still keep the dividends, sale proceeds, and (subject to the proxy rules above) generally the vote.", quizRef:"Tested in Quiz: q-u2-20"},
  {id:"gap-9", unit:"u2", title:"Rights vs. Warrants — short vs. long", fact:"Rights are short-term (a 30–45 day subscription window) and protect existing shareholders from dilution during a new offering. Warrants are long-term (often years) and are usually bundled with a bond or preferred stock issue as a sweetener. Easy to mix up since both let you buy stock at a set price.", quizRef:"Tested in Quiz: q-u2-9"},
  {id:"gap-10", unit:"u2", title:"ADR voting rights are limited", fact:"The depositary bank that holds the foreign shares behind an ADR is NOT required to pass voting rights through to ADR holders — so compared to a direct shareholder, an ADR holder generally has limited or no effective vote.", quizRef:"Tested in Quiz: q-u2-28"},
  {id:"gap-11", unit:"u3", title:"Bond prices move inversely to interest rates", fact:"When market interest rates rise, existing bond prices fall (their fixed coupon looks less attractive vs. new higher-rate bonds); when rates fall, existing bond prices rise. This relationship drives almost every bond-pricing question on the exam.", quizRef:"Tested in Quiz: q-u3-3 · also shown in the Tips & Visuals seesaw"},
  {id:"gap-12", unit:"u3", title:"\"Quoted on a basis of X%\"", fact:"Any time a bond is described as quoted \"on a basis of\" a percentage, that percentage IS the Yield to Maturity — it's just exam phrasing for YTM.", quizRef:"Tested in Quiz: q-u3-8"},
  {id:"gap-13", unit:"u3", title:"The full yield-order ladder in one place", fact:"Discount bond (below par): Coupon < Current Yield < YTM < YTC — yields climb. Premium bond (above par): Coupon > Current Yield > YTM > YTC — yields fall. At par: all four yields are equal. Knowing which direction the ladder runs is tested constantly.", quizRef:"Tested in Quiz: q-u3-6"},
  {id:"gap-14", unit:"u3", title:"Call feature vs. Put feature — who benefits", fact:"A call feature lets the ISSUER redeem the bond early (usually when rates fall) — callable bonds pay a slightly HIGHER coupon to compensate the investor for that risk. A put feature lets the INVESTOR force early repayment (usually when rates rise) — put bonds pay a slightly LOWER coupon since the investor holds the advantage.", quizRef:"Tested in Quiz: q-u3-9, q-u3-10"},
  {id:"gap-15", unit:"u3", title:"Secured vs. unsecured vs. subordinated, side by side", fact:"Secured debt is backed by specific collateral (mortgage bonds, equipment trust certificates) and is paid first among creditors. Unsecured debentures rely only on the issuer's general credit. Subordinated debt is unsecured AND explicitly ranked below regular debentures — last among the bondholders, so it typically pays the highest coupon of the three to compensate for that risk.", quizRef:"Tested in Quiz: q-u3-15, q-u3-16"},
  {id:"gap-16", unit:"u3", title:"Only 2 Treasuries are pure discount instruments", fact:"T-bills and Treasury STRIPS are the only Treasury securities issued at a discount with no stated interest rate — all the \"interest\" just shows up as the difference between purchase price and par at maturity. T-notes, T-bonds, and TIPS all pay a stated semiannual coupon.", quizRef:"Tested in Quiz: q-u3-17"},
  {id:"gap-17", unit:"u3", title:"Treasury maturity ladder at a glance", fact:"T-bill: up to 52 weeks. T-note: 2–10 years. T-bond: 10–30 years. The exam often asks you to identify a security purely from its maturity range, so having all three side by side helps more than studying them one at a time.", quizRef:"Tested in Quiz: q-u3-18"},
  {id:"gap-18", unit:"u3", title:"Municipal bond tax nuances", fact:"Muni interest is exempt from federal tax for everyone, and exempt from state/local tax ONLY if the investor lives in the state that issued the bond (\"triple exempt\" muni bonds — like territory bonds — are the exception, exempt everywhere). Capital GAINS on munis, though, are still fully taxable even though the interest is exempt.", quizRef:"Tested in Quiz: q-u3-22"}
];

function activeUnitKey(){ return [...state.activeUnits].sort().join(","); }

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function normalizeText(s){
  return (s||"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function isCloseMatch(input, target){
  const a = normalizeText(input), b = normalizeText(target);
  if(!a) return false;
  if(a===b) return true;
  if(a.length>=4 && b.includes(a)) return true;
  if(b.length>=4 && a.includes(b)) return true;
  const bWords = b.split(" ").filter(w=>w.length>2);
  if(bWords.length===0) return false;
  const aWords = new Set(a.split(" ").filter(w=>w.length>2));
  const overlap = bWords.filter(w=>aWords.has(w)).length;
  return overlap/bWords.length >= 0.6;
}

  else if(state.mode==="flashcards") html += renderFlashcards();

  state.fc.index = 0;

}

/* ---- Matching ---- */
function startMatching(){
  const terms = getActiveTerms();
  const n = Math.min(8, terms.length);
  const chosen = shuffle(terms).slice(0, n);
  let cards = [];
  chosen.forEach(t=>{
    cards.push({key:t.id+"-term", pairId:t.id, type:"term", text:t.term});
    cards.push({key:t.id+"-def", pairId:t.id, type:"def", text:t.hint || t.def});
  });
  cards = shuffle(cards);
  state.m = {cards, selected:null, matchedPairs:0, totalPairs:n, moves:0, startTime:Date.now(), timer:null, elapsed:0, done:false};
  if(state.m.timer) clearInterval(state.m.timer);
  state.m.timer = setInterval(()=>{
    if(!state.m.done){
      state.m.elapsed = Math.floor((Date.now()-state.m.startTime)/1000);
      const t = document.getElementById("match-timer");
      if(t) t.textContent = state.m.elapsed + "s";
    }
  }, 250);
}
function renderMatching(){
  if(getActiveTerms().length===0) return `<div class="center"><p>No terms available. Select at least one unit above.</p></div>`;
  if(state.m.cards.length===0) startMatching();
  const m = state.m;
  const cardsHtml = m.cards.map((c,i)=>{
    const matched = c.matched ? "matched":"";
    const selected = (m.selected && m.selected.key===c.key) ? "selected":"";
    const wrong = c.wrong ? "wrong":"";
    const typeClass = c.type==="def" ? "def":"";
    return `<div class="match-card ${typeClass} ${matched} ${selected} ${wrong}" data-key="${c.key}">${c.text}</div>`;
  }).join("");
  return `
    <div class="match-stats">
      <div>⏱️ <span id="match-timer">${m.elapsed}s</span></div>
      <div>🎯 ${m.matchedPairs} / ${m.totalPairs}</div>
      <div>🔁 ${m.moves} moves</div>
    </div>
    <div class="match-grid">${cardsHtml}</div>
    <div class="row">
      <button class="btn secondary small" id="match-restart">🔄 New round</button>
    </div>
    ${m.done ? renderMatchDone() : ""}
  `;
}
function renderMatchDone(){
  const key = activeUnitKey();
  const best = progress.matchBest[key];
  const isBest = !best || state.m.elapsed < best;
  return `
    <div class="card-panel" style="margin-top:16px; text-align:center;">
      <h3>🎉 Matched them all!</h3>
      <p>Time: ${state.m.elapsed}s in ${state.m.moves} moves ${isBest?"— new best time! 🏆":""}</p>
      <button class="btn" id="match-again">Play again</button>
    </div>
  `;
}

/* ---- Quiz ---- */
function startQuiz(){
  const pool = shuffle(getActiveQuiz());
  const choice = state.q.countChoice || "auto";
  let n;
  if(choice==="all"){
    n = pool.length;
  } else if(choice==="auto"){
    // Scale round length with how many units are active: ~20 questions per
    // active unit (minimum 12 for a single unit), capped by however many
    // questions actually exist in the pool.
    n = Math.min(Math.max(12, state.activeUnits.size * 20), pool.length);
  } else {
    n = Math.min(parseInt(choice,10), pool.length);
  }
  const selected = pool.slice(0,n).map(q=>{
    const choiceOrder = shuffle(q.choices.map((c,i)=>({text:c, correct:i===q.answer})));
    return {...q, shuffledChoices:choiceOrder};
  });
  state.q = {questions:selected, index:0, score:0, answered:false, selectedIdx:null, wrong:[], awaitingStart:false, countChoice:choice};
}
function renderQuizSetup(){
  const poolSize = getActiveQuiz().length;
  const choice = state.q.countChoice || "auto";
  const options = [
    {val:"auto", label:"Auto (scales with units)"},
    {val:"12", label:"12 questions"},
    {val:"20", label:"20 questions"},
    {val:"30", label:"30 questions"},

    {val:"all", label:`All (${poolSize})`}
  ].filter(o => o.val==="auto" || o.val==="all" || parseInt(o.val,10) <= poolSize);
  const optsHtml = options.map(o=>`<button class="btn ${choice===o.val?"":"secondary"} small quiz-count-btn" data-count="${o.val}">${o.label}</button>`).join("");
  return `

function renderQuiz(){

/* ---- Learn (bite-sized lessons) ---- */
function startLesson(fam){
  const meta = LESSON_META.find(l=>l.fam===fam);
  if(!meta) return;
  const terms = TERMS.filter(t=>t.fam===fam);
  const termIds = new Set(terms.map(t=>t.id));

  // Build a list of "extra" steps (visual/example first, then checks, in the
  // order they're defined), each tagged with the term id it must follow.
  // Checks are randomly sampled from a larger candidate pool each time the
  // lesson is started, so questions show up more often and in a different
  // mix on replay — but every single one is still anchored to a concept
  // card that's already been shown, so nothing gets asked before it's taught.
  const extras = [];
  if(meta.visual) extras.push({type:"visual", viz:meta.visual.key, after:meta.visual.after});
  if(meta.example){
    const m = MATH_PROBLEMS.find(x=>x.id===meta.example.mathId);
    if(m) extras.push({type:"example", math:m, after:meta.example.after});
  }
  const checkCandidates = (meta.checks||[]).map(c=>{
    const q = QUIZ.find(x=>x.id===c.id);
    return q ? {type:"check", quiz:q, after:c.after} : null;
  }).filter(Boolean);
  const targetChecks = Math.min(checkCandidates.length, Math.max(3, Math.round(terms.length/2)), 8);
  shuffle(checkCandidates).slice(0, targetChecks).forEach(c=>extras.push(c));

  const deck = [];
  const used = new Set();
  terms.forEach(t=>{
    deck.push({type:"concept", term:t});
    extras.forEach(ex=>{
      if(ex.after===t.id && !used.has(ex)){
        deck.push(ex);
        used.add(ex);
      }
    });
  });
  // Safety net: any extra whose anchor term wasn't found in this fam (e.g. a
  // typo) still gets shown, just at the end rather than being silently lost.
  extras.forEach(ex=>{
    if(!used.has(ex) && !termIds.has(ex.after)) deck.push(ex);
  });
  deck.push({type:"done"});
  state.learn = {activeFam:fam, deck, stepIdx:0, checkSelected:null, checkAnswered:false, exampleRevealed:0};
}
function advanceLearn(){
  state.learn.stepIdx++;
  state.learn.checkSelected = null;
  state.learn.checkAnswered = false;
  state.learn.exampleRevealed = 0;
  render();
}
function goBackLearn(){
  if(state.learn.stepIdx <= 0){
    state.learn.activeFam = null;
  } else {
    state.learn.stepIdx--;
    state.learn.checkSelected = null;
    state.learn.checkAnswered = false;
    state.learn.exampleRevealed = 0;
  }
  render();
}
function handleLearnCheck(idx){
  state.learn.checkSelected = idx;
  state.learn.checkAnswered = true;
  render();
}
function goToNextLesson(){
  const lessons = getActiveLessons();
  const i = lessons.findIndex(l=>l.fam===state.learn.activeFam);
  if(i>=0 && i+1<lessons.length) startLesson(lessons[i+1].fam);
  else state.learn.activeFam = null;
  render();
}
function revealExampleStep(totalSteps){
  if(state.learn.exampleRevealed < totalSteps) state.learn.exampleRevealed++;
  render();
}
const VIZ_RENDERERS = {
  seesaw: renderVizSeesaw, derp: renderVizDerp, waterfall: renderVizWaterfall,
  yield: renderVizYield, split: renderVizSplit, marketcap: renderVizMarketCap, ratings: renderVizRatings
};
function renderLearn(){
  const lessons = getActiveLessons();
  if(lessons.length===0) return `<div class="center"><p>Select at least one unit above to see its lessons.</p></div>`;
  if(!state.learn.activeFam){
    const cardsHtml = lessons.map(l=>{
      const done = progress.learnedLessons.includes(l.fam);
      return `
        <div class="lesson-card ${done?"done":""}" data-fam="${l.fam}">
          <div class="lesson-num">${UNIT_META[l.unit].split(":")[0]} · Lesson ${l.num} ${done?"✅":""}</div>
          <div class="lesson-title">${l.title}</div>
          <p>${l.intro}</p>
        </div>
      `;
    }).join("");
    return `
      <div class="section-title">📖 Learn</div>
      <p class="gap-intro">Short, bite-sized lessons — a handful of concepts at a time with a quick check mixed in, so you never have to sit and read a wall of text.</p>
      <div class="lessons-grid">${cardsHtml}</div>
    `;
  }
  const meta = LESSON_META.find(l=>l.fam===state.learn.activeFam);
  const deck = state.learn.deck;
  const step = deck[state.learn.stepIdx];
  const stepsTotal = deck.length - 1; // exclude the "done" step from the count
  const progressBar = `<div class="learn-progress">${meta.title} · Step ${Math.min(state.learn.stepIdx+1, stepsTotal)} of ${stepsTotal}</div>`;
  const backBtn = `<button class="btn secondary" id="learn-back">← Back</button>`;

  if(!step || step.type==="done"){
    if(!progress.learnedLessons.includes(state.learn.activeFam)){
      progress.learnedLessons.push(state.learn.activeFam);
      saveProgress();
    }
    const lessons = getActiveLessons();
    const i = lessons.findIndex(l=>l.fam===state.learn.activeFam);
    const hasNext = i>=0 && i+1<lessons.length;
    return `
      <div class="center">
        <h3>✅ Lesson complete!</h3>
        <p>${meta.title}</p>
        <div class="row">
          ${hasNext ? `<button class="btn" id="learn-next-lesson">Next lesson →</button>` : ""}
          <button class="btn secondary" id="learn-back-list">Back to lessons</button>
        </div>
      </div>
    `;
  }

  if(step.type==="concept"){
    const t = step.term;
    return `
      ${progressBar}
      <div class="learn-card">
        <div class="learn-term">${t.term}</div>
        <p class="learn-def">${t.def}</p>
        <div class="learn-example">💡 ${t.hint}</div>
      </div>
      <div class="row">${backBtn}<button class="btn" id="learn-next">Next →</button></div>
    `;
  }

  if(step.type==="visual"){
    const fn = VIZ_RENDERERS[step.viz];
    return `
      ${progressBar}
      <div class="learn-visual-label">🎬 See it in action</div>
      <div class="viz-grid">${fn ? fn() : ""}</div>
      <div class="row">${backBtn}<button class="btn" id="learn-next">Next →</button></div>
    `;
  }

  if(step.type==="example"){
    const m = step.math;
    const revealed = state.learn.exampleRevealed;
    const totalSteps = m.steps.length;
    const stepsHtml = m.steps.slice(0, revealed).map((s,i)=>`<div class="example-step"><span class="example-step-num">${i+1}</span>${s}</div>`).join("");
    const allRevealed = revealed >= totalSteps;
    return `
      ${progressBar}
      <div class="learn-visual-label">🧮 Worked example</div>
      <div class="example-box">
        <div class="example-prompt">${m.prompt}</div>
        ${stepsHtml ? `<div class="example-steps">${stepsHtml}</div>` : ""}
        ${allRevealed ? `<div class="example-answer">✅ Answer: ${m.prefix||""}${m.answer}${m.suffix?" "+m.suffix:""}</div>` : ""}
      </div>
      <div class="row">
        ${backBtn}
        ${allRevealed
          ? `<button class="btn" id="learn-next">Next →</button>`
          : `<button class="btn" id="learn-reveal-step" data-total="${totalSteps}">${revealed===0?"Show first step":"Show next step"}</button>`}
      </div>
    `;
  }

  // check step
  const q = step.quiz;
  const choicesHtml = q.choices.map((c,i)=>{
    let cls = "quiz-choice";
    if(state.learn.checkAnswered){
      cls += " disabled";
      if(i===q.answer) cls += " correct";
      else if(i===state.learn.checkSelected) cls += " incorrect";
    }
    return `<button class="${cls} learn-check-choice" data-idx="${i}" ${state.learn.checkAnswered?"disabled":""}>${c}</button>`;
  }).join("");
  return `
    ${progressBar}
    <div class="learn-check-label">✏️ Quick check</div>
    <div class="quiz-q">${q.q}</div>
    <div>${choicesHtml}</div>
    ${state.learn.checkAnswered ? `<div class="quiz-explain">💡 ${q.explain}</div>` : ""}
    <div class="row">${backBtn}${state.learn.checkAnswered ? `<button class="btn" id="learn-next">Next →</button>` : ""}</div>
  `;
}

/* ---- Math Word Problems ---- */

function renderMathDone(){

function numbersClose(a,b,tol){ return Math.abs(a-b) <= (tol||0) + 1e-9; }

/* ---- Term Recall (word bank shown, but you have to type the match yourself) ---- */
function prepRecallBank(){
  const r = state.recall;
  const card = r.deck[r.index];
  const pool = getActiveTerms().filter(t=>t.id!==card.id);
  const distractorCount = Math.min(4, pool.length);
  // Prefer distractors from the same concept family (e.g. other market-cap tiers,
  // other preferred stock types) so the bank is genuinely confusable, capped so
  // it doesn't get overwhelming, then top up with random terms if needed.
  const sameFamily = shuffle(pool.filter(t=>t.fam===card.fam));
  const others = shuffle(pool.filter(t=>t.fam!==card.fam));
  const maxSameFamily = Math.min(3, sameFamily.length, distractorCount);
  const picked = sameFamily.slice(0, maxSameFamily);
  const remainingNeeded = distractorCount - picked.length;
  picked.push(...others.slice(0, remainingNeeded));
  const distractors = picked.map(t=>t.term);
  r.currentBank = shuffle([card.term, ...distractors]);
  r.checked = false;
  r.lastInput = "";
  r.showHint = false;
}
function startRecall(){
  state.recall = {deck: shuffle(getActiveTerms()), index:0, score:0, checked:false, wasCloseMatch:false, currentBank:[], lastInput:"", showHint:false};
  if(state.recall.deck.length) prepRecallBank();
}
function renderRecall(){
  if(getActiveTerms().length===0) return `<div class="center"><p>No terms available. Select at least one unit above.</p></div>`;
  if(state.recall.deck.length===0) startRecall();
  const r = state.recall;
  if(r.index >= r.deck.length) return renderRecallDone();
  const card = r.deck[r.index];
  const known = progress.known.includes(card.id);
  const bankHtml = r.currentBank.map(t=>`<div class="bank-chip">${t}</div>`).join("");
  return `
    <div class="math-progress">
      <div>Term ${r.index+1} of ${r.deck.length} · Score ${r.score} ${known?"· ✅ previously mastered":""}</div>
    </div>
    <div class="math-card">
      <div class="math-prompt">🔎 ${card.def}</div>
      <div class="bank-label">Word bank — one of these matches. Type it out below:</div>
      <div class="word-bank">${bankHtml}</div>
      <div class="math-input-row">
        <input type="text" class="math-input" id="recall-input" style="width:280px;" placeholder="Type the matching term..." ${r.checked?"disabled":""} value="${r.checked ? (r.lastInput||"") : ""}"/>
        ${r.checked ? "" : `<button class="btn" id="recall-check">Check</button><button class="btn secondary small" id="recall-hint">💡 ${r.showHint?"Hide hint":"Hint"}</button>`}
      </div>
      ${(r.showHint && !r.checked) ? `<div class="hint-box">💡 ${card.hint || "No extra hint for this one — the definition above is your best clue."}</div>` : ""}
      ${r.checked ? `
        <div class="math-feedback ${r.wasCloseMatch?"correct":"incorrect"}">
          ${r.wasCloseMatch ? "✅ Correct!" : "🤔 Not quite."} The term is: <strong>${card.term}</strong>
        </div>
        ${!r.wasCloseMatch ? `<div class="hint-box">💡 Why: ${card.hint || card.def}</div>` : ""}
        <div class="row">
          <button class="btn" id="recall-know">✅ I knew it</button>
          <button class="btn secondary" id="recall-learning">📚 Still learning</button>
        </div>
      ` : ""}
    </div>
  `;
}
function renderRecallDone(){
  const r = state.recall;
  return `
    <div class="center">
      <h3>Recall practice complete!</h3>
      <div class="big-score">${r.score} / ${r.deck.length}</div>
      <div class="row">
        <button class="btn" id="recall-retry">Try again</button>
        <button class="btn secondary" id="recall-home">Back to home</button>
      </div>
    </div>
  `;
}
function checkRecallAnswer(){
  const r = state.recall;
  const card = r.deck[r.index];
  const inputEl = document.getElementById("recall-input");
  const raw = inputEl ? inputEl.value.trim() : "";
  r.lastInput = raw;
  r.checked = true;
  r.wasCloseMatch = isCloseMatch(raw, card.term);
  render();
}
function advanceRecall(markKnown){
  const r = state.recall;
  const card = r.deck[r.index];
  if(markKnown){
    if(!progress.known.includes(card.id)) progress.known.push(card.id);
    r.score++;
  } else {
    progress.known = progress.known.filter(id=>id!==card.id);
  }
  saveProgress();
  r.index++;
  if(r.index < r.deck.length) prepRecallBank();
  render();
  if(markKnown && r.score>0 && r.score%5===0) spawnConfetti();
}

/* ---- Confetti ---- */
function spawnConfetti(){
  const colors = ["#818cf8","#a78bfa","#f472b6","#22d3ee","#fbbf24","#22c55e"];
  for(let i=0;i<40;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random()*100 + "vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.8 + Math.random()*1.4) + "s";
    el.style.opacity = String(0.7 + Math.random()*0.3);
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3400);
  }
}
