<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIE Study Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1e1b4b; --bg2:#312e81; --accent:#818cf8; --accent2:#a78bfa;
    --card:#ffffff; --card-back:#4f46e5; --text:#1e1b2e; --muted:#6b7280;
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --gold:#fbbf24;
    --pink:#f472b6; --cyan:#22d3ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(120deg,var(--bg1),var(--bg2) 45%,#5b21b6 75%,#3730a3);
    background-size:300% 300%;
    animation:bgShift 18s ease infinite;
    background-attachment:fixed;
    min-height:100vh; color:#f1f5f9;
    overflow-x:hidden;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(129,140,248,.18), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(244,114,182,.14), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(34,211,238,.12), transparent 45%);
  }
  #app{max-width:1000px; margin:0 auto; padding:20px 16px 60px; position:relative; z-index:1;}
  h1{
    font-size:2.1rem; font-weight:900; margin:6px 0 2px; text-align:center; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--cyan),var(--accent2),var(--pink),var(--gold));
    background-size:300% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:titleGlow 6s linear infinite;
    filter:drop-shadow(0 2px 12px rgba(129,140,248,.35));
  }
  @keyframes titleGlow{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }
  .subtitle{text-align:center; color:#c7d2fe; margin-bottom:18px; font-size:.95rem;}
  .unit-bar{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px;
  }
  .unit-chip{
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.25);
    padding:7px 14px; border-radius:20px; cursor:pointer; font-size:.85rem;
    user-select:none; transition:.15s; color:#e0e7ff;
  }
  .unit-chip.active{background:var(--accent); border-color:var(--accent); color:#1e1b4b; font-weight:600; box-shadow:0 0 14px rgba(129,140,248,.6);}
  .unit-chip.locked{background:#6b7280; border-color:#6b7280; color:#e5e7eb; cursor:not-allowed; box-shadow:none; opacity:.85;}
  .nav-bar{display:flex; gap:10px; justify-content:center; margin-bottom:22px; flex-wrap:wrap;}
  .nav-btn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.2); color:#f1f5f9;
    padding:9px 17px; border-radius:12px; cursor:pointer; font-size:.9rem; font-weight:600;
    transition:.2s; font-family:inherit;
  }
  .nav-btn:hover{background:rgba(255,255,255,.14); transform:translateY(-2px);}
  .nav-btn.active{
    background:linear-gradient(135deg,var(--accent2),var(--pink));
    color:#1e1b4b; font-weight:800; border-color:transparent;
    box-shadow:0 4px 18px rgba(167,139,250,.5); transform:translateY(-2px);
  }
  .card-panel{
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.14);
    border-radius:20px; padding:24px; backdrop-filter:blur(8px);
    box-shadow:0 8px 40px rgba(0,0,0,.25);
  }
  .home-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;}
  .mode-card{
    background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:22px; text-align:center;
    cursor:pointer; transition:.25s cubic-bezier(.34,1.56,.64,1); position:relative; overflow:hidden;
  }
  .mode-card::after{
    content:""; position:absolute; inset:0; border-radius:18px; padding:1px;
    background:linear-gradient(135deg,var(--cyan),var(--pink),var(--gold));
    opacity:0; transition:.25s;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  .mode-card:hover{transform:translateY(-6px) scale(1.02); box-shadow:0 12px 30px rgba(129,140,248,.35);}
  .mode-card:hover::after{opacity:1;}
  .mode-card .emoji{font-size:2.6rem; display:block; margin-bottom:8px; filter:drop-shadow(0 2px 8px rgba(0,0,0,.3));}
  .mode-card h3{margin:4px 0 6px;}
  .mode-card p{color:#c7d2fe; font-size:.85rem; margin:0 0 8px;}
  .mode-card .stat{font-size:.8rem; color:var(--gold); font-weight:700;}
  .btn{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1e1b4b; border:none; padding:11px 22px;
    border-radius:12px; font-weight:800; cursor:pointer; font-size:.9rem;
    transition:.18s; box-shadow:0 4px 14px rgba(129,140,248,.35); font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03); box-shadow:0 6px 20px rgba(129,140,248,.55);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn.secondary{background:rgba(255,255,255,.1); color:#f1f5f9; border:1px solid rgba(255,255,255,.28); box-shadow:none;}
  .btn.secondary:hover{background:rgba(255,255,255,.18); box-shadow:0 4px 14px rgba(255,255,255,.12);}
  .btn.small{padding:7px 14px; font-size:.8rem;}
  .btn:disabled{opacity:.4; cursor:default; transform:none; box-shadow:none;}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
  .top-controls{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;}
  .progress-bar{background:rgba(255,255,255,.12); border-radius:8px; height:8px; overflow:hidden; margin:10px 0;}
  .progress-fill{background:var(--gold); height:100%; transition:.3s;}

  /* Flashcards */
  .flash-wrap{display:flex; flex-direction:column; align-items:center;}
  .flashcard{
    width:100%; max-width:520px; height:280px; perspective:1200px; cursor:pointer; margin:10px auto;
  }
  .flashcard-inner{
    position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; width:100%; height:100%; backface-visibility:hidden;
    border-radius:18px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:28px; font-size:1.25rem; font-weight:600; color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .flash-face.front{background:linear-gradient(145deg,#fff,#e0e7ff);}
  .flash-face.back{background:linear-gradient(145deg,#c7d2fe,#a5b4fc); transform:rotateY(180deg); font-weight:500; font-size:1.05rem;}
  .flash-tag{position:absolute; top:12px; left:16px; font-size:.7rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .flash-hint{color:#c7d2fe; font-size:.8rem; margin-top:8px;}

  /* Matching */
  .match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;}
  @media(max-width:640px){.match-grid{grid-template-columns:repeat(2,1fr);}}
  .match-card{
    background:var(--card); color:var(--text); border-radius:12px; padding:12px;
    min-height:90px; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:.82rem; font-weight:600; cursor:pointer; border:3px solid transparent;
    transition:.15s; box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .match-card.def{font-weight:400; font-size:.78rem; background:#eef2ff;}
  .match-card.selected{border-color:var(--accent); transform:scale(1.03);}
  .match-card.wrong{border-color:var(--bad); animation:shake .3s;}
  .match-card.matched{background:var(--good); color:#fff; opacity:.55; cursor:default; box-shadow:none;}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .match-stats{display:flex; justify-content:center; gap:24px; margin-bottom:6px; font-weight:700; color:var(--gold);}

  /* Quiz */
  .quiz-q{font-size:1.1rem; font-weight:600; margin-bottom:16px;}
  .quiz-choice{
    display:block; width:100%; text-align:left; background:rgba(255,255,255,.07);
    border:1.5px solid rgba(255,255,255,.2); color:#f1f5f9; padding:12px 16px;
    border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:.92rem;
  }
  .quiz-choice.correct{background:var(--good); border-color:var(--good); color:#fff; font-weight:700;}
  .quiz-choice.incorrect{background:var(--bad); border-color:var(--bad); color:#fff; font-weight:700;}
  .quiz-choice.disabled{cursor:default;}
  .quiz-explain{background:rgba(255,255,255,.08); border-radius:10px; padding:12px 16px; margin-top:8px; font-size:.85rem; color:#e0e7ff;}
  .quiz-progress{color:#c7d2fe; font-size:.85rem; margin-bottom:8px;}

  .results-list{text-align:left; margin-top:14px;}
  .result-item{background:rgba(255,255,255,.06); border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:.85rem;}
  .result-item .rq{font-weight:700; margin-bottom:4px;}
  .result-item .ra{color:var(--bad);}
  .result-item .rc{color:var(--good);}
  .big-score{font-size:2.6rem; font-weight:800; text-align:center; color:var(--gold); margin:8px 0;}
  .center{text-align:center;}
  footer{text-align:center; color:#a5b4fc; font-size:.75rem; margin-top:24px;}

  /* Tips & Visuals */
  .section-title{font-size:1.05rem; font-weight:700; margin:6px 0 12px; color:#fff;}
  .tips-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:28px;}
  .tip-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:14px 16px;}
  .tip-card .tip-unit{font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; color:#a5b4fc; font-weight:700;}
  .tip-card .tip-mnemonic{font-weight:800; color:var(--gold); font-size:.95rem; margin:4px 0 6px;}
  .tip-card p{margin:0; font-size:.82rem; color:#e0e7ff; line-height:1.4;}
  .gap-intro{font-size:.85rem; color:#c7d2fe; line-height:1.5; margin:0 0 18px;}
  .gaps-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;}
  .gap-card{background:rgba(255,255,255,.06); border:1px solid rgba(244,114,182,.35); border-radius:14px; padding:14px 16px;}
  .gap-card .gap-unit{font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; color:var(--pink); font-weight:700;}
  .gap-card .gap-title{font-weight:800; color:#fff; font-size:.95rem; margin:4px 0 6px;}
  .gap-card p{margin:0 0 8px; font-size:.82rem; color:#e0e7ff; line-height:1.4;}
  .gap-card .gap-ref{font-size:.7rem; color:#a5b4fc; font-style:italic;}
  .lessons-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px;}
  .lesson-card{background:rgba(255,255,255,.06); border:1px solid rgba(129,140,248,.35); border-radius:14px; padding:14px 16px; cursor:pointer; transition:transform .15s, background .15s;}
  .lesson-card:hover{background:rgba(255,255,255,.1); transform:translateY(-2px);}
  .lesson-card.done{border-color:rgba(34,197,94,.5);}
  .lesson-card .lesson-num{font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; color:#a5b4fc; font-weight:700;}
  .lesson-card .lesson-title{font-weight:800; color:#fff; font-size:1rem; margin:4px 0 6px;}
  .lesson-card p{margin:0; font-size:.82rem; color:#e0e7ff; line-height:1.4;}
  .learn-progress{font-size:.78rem; color:#a5b4fc; margin-bottom:10px; font-weight:600; letter-spacing:.3px;}
  .learn-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:28px 24px; text-align:center; margin-bottom:16px;}
  .learn-card .learn-term{font-size:1.5rem; font-weight:800; color:var(--gold); margin-bottom:10px;}
  .learn-card .learn-def{font-size:1rem; color:#e0e7ff; line-height:1.5; margin:0 0 16px;}
  .learn-card .learn-example{background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.3); border-radius:10px; padding:12px 14px; font-size:.85rem; color:#cffafe; text-align:left;}
  .learn-check-label{font-size:.8rem; color:var(--pink); font-weight:700; margin-bottom:6px;}

  .viz-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;}
  .viz-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:16px; padding:16px;}
  .viz-card h4{margin:0 0 4px; font-size:.95rem;}
  .viz-card .viz-desc{font-size:.78rem; color:#c7d2fe; margin:0 0 10px;}
  .viz-stage{
    background:rgba(0,0,0,.22); border-radius:12px; padding:16px 10px 10px;
    min-height:180px; display:flex; align-items:flex-end; justify-content:center;
    gap:16px; position:relative; overflow:hidden;
  }
  .viz-controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px;}

  /* seesaw bars */
  .bar-col{display:flex; flex-direction:column; align-items:center; gap:6px; width:64px;}
  .bar{width:36px; background:linear-gradient(180deg,var(--accent2),var(--accent)); border-radius:6px 6px 0 0; transition:height .8s cubic-bezier(.4,0,.2,1); height:40px;}
  .bar-label{font-size:.68rem; color:#c7d2fe; text-align:center;}
  .bar-val{font-size:.68rem; font-weight:700; color:#fff;}

  /* DERP timeline */
  .timeline{display:flex; align-items:flex-start; justify-content:space-between; width:100%; padding:20px 6px 0; position:relative;}
  .timeline::before{content:""; position:absolute; top:37px; left:24px; right:24px; height:3px; background:rgba(255,255,255,.2);}
  .tl-node{display:flex; flex-direction:column; align-items:center; gap:6px; z-index:1; width:25%;}
  .tl-dot{width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.75rem; transition:.4s; border:2px solid rgba(255,255,255,.3); color:#fff;}
  .tl-dot.hit{background:var(--gold); color:#1e1b4b; border-color:var(--gold); transform:scale(1.2);}
  .tl-label{font-size:.62rem; color:#c7d2fe; text-align:center;}

  /* waterfall */
  .waterfall{display:flex; flex-direction:column; gap:7px; width:100%;}
  .tier{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:8px 10px; font-size:.75rem; text-align:left; position:relative; overflow:hidden;}
  .tier .fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:rgba(34,197,94,.55); transition:width 1s ease;}
  .tier span{position:relative; z-index:1;}

  /* split visualizer */
  .split-grid{display:grid; gap:5px; transition:.5s;}
  .split-sq{background:var(--gold); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:800; color:#1e1b4b; transition:.5s; aspect-ratio:1;}
  .split-info{font-size:.8rem; color:#fff; font-weight:700; margin-top:8px; text-align:center;}

  /* ratings ladder */
  .rating-ladder{display:flex; flex-direction:column; gap:4px;}
  .rating-rung{display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:8px; cursor:pointer; font-size:.78rem; font-weight:700; color:#fff; border:2px solid transparent; transition:.2s;}
  .rating-rung.investment{background:rgba(34,197,94,.18);}
  .rating-rung.junk{background:rgba(239,68,68,.18);}
  .rating-rung.selected{border-color:#fff;}
  .rating-rung .rr-sp{width:40px;}
  .rating-rung .rr-moody{width:40px; opacity:.75;}
  .rating-rung .rr-cutoff{font-size:.65rem; font-weight:600; color:var(--gold); margin-left:auto;}

  .learn-visual-label{font-size:.8rem; color:var(--cyan); font-weight:700; margin-bottom:6px;}
  .example-box{background:rgba(255,255,255,.06); border:1px solid rgba(251,191,36,.35); border-radius:14px; padding:16px;}
  .example-prompt{font-size:.9rem; color:#fff; margin-bottom:10px; line-height:1.4;}
  .example-steps{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
  .example-step{display:flex; gap:8px; font-size:.82rem; color:#e0e7ff; background:rgba(0,0,0,.18); border-radius:8px; padding:8px 10px; align-items:flex-start;}
  .example-step-num{background:var(--gold); color:#1e1b4b; font-weight:800; font-size:.7rem; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
  .example-answer{font-size:.9rem; font-weight:800; color:var(--good); margin-top:4px;}

  /* Math word problems */
  .math-progress{color:#c7d2fe; font-size:.85rem; margin-bottom:6px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;}
  .math-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:20px;}
  .math-prompt{font-size:1.02rem; line-height:1.5; margin-bottom:16px; font-weight:500;}
  .math-input-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center;}
  .math-input{
    font-family:'Space Mono',monospace; font-size:1.1rem; padding:10px 14px; border-radius:10px;
    border:1.5px solid rgba(255,255,255,.3); background:rgba(255,255,255,.9); color:#1e1b2e;
    width:160px; text-align:center;
  }
  .math-input:focus{outline:2px solid var(--accent2);}
  .math-feedback{margin-top:14px; padding:12px 16px; border-radius:12px; font-weight:700; text-align:center;}
  .math-feedback.correct{background:rgba(34,197,94,.2); border:1px solid var(--good); color:#bbf7d0;}
  .math-feedback.incorrect{background:rgba(239,68,68,.2); border:1px solid var(--bad); color:#fecaca;}
  .math-steps{background:rgba(255,255,255,.07); border-radius:12px; padding:14px 18px; margin-top:12px; font-size:.85rem; color:#e0e7ff;}
  .math-steps ol{margin:6px 0 0; padding-left:20px;}
  .math-steps li{margin-bottom:5px;}
  .streak-badge{display:inline-block; background:linear-gradient(135deg,var(--gold),#f59e0b); color:#1e1b4b; font-weight:800; padding:4px 12px; border-radius:20px; font-size:.78rem;}

  /* Term Recall word bank */
  .bank-label{font-size:.72rem; color:#c7d2fe; text-align:center; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
  .word-bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px;}
  .bank-chip{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); border-radius:10px;
    padding:8px 14px; font-size:.85rem; font-weight:600; color:#e0e7ff;
  }
  .hint-box{background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.5); border-radius:10px; padding:10px 14px; margin:10px 0; font-size:.82rem; color:#fde68a; text-align:left;}

  /* Confetti */
  .confetti-piece{
    position:fixed; top:-20px; width:9px; height:14px; z-index:999; pointer-events:none;
    animation:confettiFall linear forwards; border-radius:2px;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(720deg); opacity:.2; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>🎮 SIE Study Arcade</h1>
  <div class="subtitle">Flashcards · Matching · Quiz — built from your notes</div>
  <div id="screen"></div>
  <footer>Progress is saved in this browser. Ask for more units to be added anytime.</footer>
</div>

<script>
/* ================= DATA ================= */
const UNIT_META = {
  u1: "Unit 1: Equity Securities",
  u2: "Unit 2: Equity Types & Corporate Actions",
  u3: "Unit 3: Debt Securities"
};

const TERMS = [
  // ---- Unit 1 ----
  {id:"u1-1", unit:"u1", fam:"u1-common", term:"Security", def:"An intangible financial asset that can be bought, sold, or gifted between people — represented by a paper certificate or an electronic record. Covers stocks, bonds, mutual funds, LPs, options, and muni-backed securities.", hint:"If it's a financial asset you could sell or gift, it's probably this. Commodities, currency, futures, and real estate are NOT securities."},
  {id:"u1-2", unit:"u1", fam:"u1-common", term:"Common stock", def:"Basic ownership in a company, sold to raise capital for the business. Comes with voting rights, a shot at dividends, and capital appreciation. One unit of stock = one share.", hint:"Example: own 10 of a company's 1,000 shares? You're a 10% owner with a vote at the annual meeting."},
  {id:"u1-3", unit:"u1", fam:"u1-common", term:"Preferred stock", def:"Equity with debt-like features. Usually no voting rights, but pays a fixed dividend before common stockholders and sits ahead of common in a liquidation.", hint:"Picture a stock that acts almost like a bond: pays a set amount every quarter, but you rarely get a vote."},
  {id:"u1-4", unit:"u1", fam:"u1-common", term:"Capital appreciation", def:"Increase in an investment's market value over time (e.g., stock price rising) — one of the two main ways stockholders make money, alongside dividends.", hint:"Example: you buy a stock at $40, it climbs to $65 — that $25 jump is this kind of gain. Also called growth."},
  {id:"u1-5", unit:"u1", fam:"u1-common", term:"Market capitalization", def:"A company's value: outstanding shares × current market value (CMV) per share. Used to bucket companies into large/mid/small/penny-cap.", hint:"Example: 2 million shares trading at $50 each = one of these worth $100 million."},
  {id:"u1-6", unit:"u1", fam:"u1-common", term:"Authorized stock", def:"The max number of shares a company's corporate charter allows it to issue, set when the founders file the charter with the state. Raising the cap later needs a shareholder vote to amend the charter.", hint:"Think of it as a hard ceiling in the company's founding paperwork — they issue just enough shares now and hold the rest in reserve."},
  {id:"u1-7", unit:"u1", fam:"u1-common", term:"Issued stock", def:"Authorized shares that have actually been sold to investors, who've paid for them and received full ownership rights.", hint:"Example: of a company's legal share ceiling, this is the slice actually handed out to real investors."},
  {id:"u1-8", unit:"u1", fam:"u1-common", term:"Outstanding stock", def:"Shares issued and currently in investors' hands. Outstanding = Issued − Treasury — not all issued stock stays outstanding once a company buys some back.", hint:"Example: sold 500,000 shares, bought back 50,000 — 450,000 remain in investors' hands. No mention of buybacks? Assume the two numbers match."},
  {id:"u1-9", unit:"u1", fam:"u1-common", term:"Treasury stock", def:"Shares a company issued and later bought back from the market. Can be held indefinitely, reissued, or retired. No voting rights, no dividends, and not counted as outstanding or in market cap.", hint:"Picture a company buying its own stock off the open market and just holding onto it — no vote, no dividend, just sitting in the corporate vault."},
  {id:"u1-10", unit:"u1", fam:"u1-common", term:"Large cap stock", def:"Market cap over $10B. Ranges from fast-growing tech names to big, long-established firms. Large caps with a long history of steady dividends are often called blue-chip stocks.", hint:"Example: a household-name company worth $50 billion falls here. \"Blue chip\" is a flavor of this size bucket, not a separate one."},
  {id:"u1-11", unit:"u1", fam:"u1-common", term:"Mid cap stock", def:"Market cap of $2B–$10B — too big for small cap, not big enough for large cap. Tends to blend growth potential with more stability.", hint:"Example: a company worth around $5 billion — bigger than a startup, smaller than a giant — lands here."},
  {id:"u1-12", unit:"u1", fam:"u1-common", term:"Small cap stock", def:"Market cap of $250M–$2B — the smallest companies still large enough to list on a national exchange. Growth-oriented, usually pays few or no dividends. (Below this is \"micro-cap,\" not tested.)", hint:"Example: a scrappy $800 million company plowing cash into growth instead of dividends fits here."},
  {id:"u1-13", unit:"u1", fam:"u1-common", term:"Penny stock", def:"An unlisted security (not on a national exchange) trading under $5/share. Considered highly speculative — SEC rules require a risk disclosure document before a customer's first purchase, a signed/dated acknowledgment of it, and monthly account statements showing value/shares/issuer for any penny stock held.", hint:"Example: a stock trading at $1.20 with no exchange listing — high risk, high speculation territory."},
  {id:"u1-14", unit:"u1", fam:"u1-common", term:"Established customer (penny stock rules)", def:"Someone who's held an account with the broker-dealer for 1+ year and deposited funds/securities, OR made 3+ penny stock purchases of different issuers on different days. Exempt from the suitability statement — disclosure rules still apply.", hint:"Example: someone with 14 months of deposits in their account qualifies — skips one requirement, not the risk disclosure."},
  {id:"u1-15", unit:"u1", fam:"u1-common", term:"Unsolicited penny stock transaction", def:"A trade the customer initiates themselves, with no rep recommendation — exempt from BOTH the suitability statement and disclosure requirements that apply to solicited trades.", hint:"Picture a customer calling their broker unprompted to buy a penny stock — no recommendation, so none of the paperwork kicks in."},
  {id:"u1-37", unit:"u1", fam:"u1-common", term:"Board of Directors (BOD)", def:"Elected by common shareholders (usually at the annual meeting) to oversee company management; sets policy, declares dividends, and hires/fires executives on the company's behalf.", hint:"Example: shareholders elect this group at the annual meeting; they oversee the company and decide whether to declare a dividend."},
  {id:"u1-38", unit:"u1", fam:"u1-common", term:"Right to information (shareholder)", def:"Common shareholders have the right to receive annual reports, proxy statements, and other financial disclosures — and, depending on state law, may inspect BOD meeting minutes or the shareholder list for a credible reason.", hint:"Example: before the annual meeting, every owner gets a mailed summary of what's up for vote plus the company's financials."},
  {id:"u1-39", unit:"u1", fam:"u1-common", term:"Right to freely transfer shares", def:"Common shareholders can buy, sell, or gift their shares to anyone without needing company approval — this is literally what makes a stock market possible.", hint:"Example: an investor sells shares on the open market through their broker, no company permission needed."},
  {id:"u1-42", unit:"u1", fam:"u1-common", term:"Form 10-K (Annual Report)", def:"The audited annual report a company must file with the SEC, containing its full-year financial statements and business disclosures. Usually bundled into the annual report shareholders receive.", hint:"Example: at year-end, a company's audited books get filed with the SEC so investors see the full financial picture."},
  {id:"u1-16", unit:"u1", fam:"u1-dividends", term:"Cash dividend", def:"Distributed by check (if you hold a paper certificate) or auto-deposited into your brokerage account (if held in street name). Assume quarterly unless stated otherwise; taxed in the year it's actually distributed.", hint:"Example: $50 shows up in your account every quarter, no extra shares. \"Dividend from stock\" on the exam usually means this."},
  {id:"u1-17", unit:"u1", fam:"u1-dividends", term:"Qualified dividend", def:"A dividend taxed at the lower, favorable long-term capital-gains rate set by IRS tax code, rather than ordinary income rates. Exact rates aren't tested — just know qualified is generally the better deal for the investor.", hint:"This type gets taxed at the friendlier long-term capital-gains rate instead of your regular income rate."},
  {id:"u1-18", unit:"u1", fam:"u1-dividends", term:"Nonqualified dividend", def:"A dividend taxed as ordinary income, at the investor's regular income tax bracket.", hint:"This type gets taxed exactly like your paycheck — no special rate break."},
  {id:"u1-19", unit:"u1", fam:"u1-dividends", term:"Stock dividend", def:"Extra shares issued instead of cash, often by growth companies reinvesting profits (e.g., into R&D) rather than paying cash out. Not taxable when received — instead it lowers the investor's cost basis per share, which matters when the shares are eventually sold.", hint:"Example: buy 200 shares at $60 ($12,000 total). A 20% dividend of this kind gives 40 more shares — no tax now, cost basis drops to $50/share."},
  {id:"u1-20", unit:"u1", fam:"u1-dividends", term:"DERP (dividend dates)", def:"The order of dividend dates: Declaration, Ex-dividend, Record, Payable. The board sets the declaration, record, and payable dates; a regulator (FINRA or the exchange) sets the ex-dividend date, which normally lands the same day as the record date.", hint:"Think of the 4 letters as a to-do list: announce it, cut it off, snapshot the owners, then pay."},
  {id:"u1-21", unit:"u1", fam:"u1-dividends", term:"Declaration date", def:"The date the board of directors approves a dividend and announces the amount, along with the record date and payable date — first date in the DERP sequence.", hint:"Picture the board in a meeting saying \"we're paying $1/share, here's the schedule\" — that announcement is this."},
  {id:"u1-22", unit:"u1", fam:"u1-dividends", term:"Ex-dividend date", def:"Set by FINRA (or the exchange, if listed) based on the record date, and normally falls the same day as the record date. Since trades settle T+1, you must buy at least one business day before the record date — i.e., before the ex-date — to qualify for the dividend.", hint:"Example: buy the day before this date, you get paid; buy on or after, the seller keeps the dividend."},
  {id:"u1-23", unit:"u1", fam:"u1-dividends", term:"Record date", def:"Investors who are shareholders of record (owners on the company's books) as of end-of-day on this date receive the dividend distribution.", hint:"Picture a company snapshotting its shareholder list at end-of-day on this date — whoever's in the photo gets paid."},
  {id:"u1-24", unit:"u1", fam:"u1-dividends", term:"Payable date", def:"The date the dividend disbursing agent actually sends payment to shareholders of record; investors are taxed based on the year of this date, not the declaration date.", hint:"This is the day the dividend check or deposit actually shows up, not just when it was announced."},
  {id:"u1-25", unit:"u1", fam:"u1-dividends", term:"Statutory voting", def:"Shareholder gets 1 vote per share for each open board seat, and can't combine/stack those votes onto a single candidate. A board candidate just needs a simple majority. Benefits larger shareholders.", hint:"Example: with 100 shares and 3 board seats, you can cast up to 100 votes per seat — max 100 for any one candidate, no stacking allowed."},
  {id:"u1-26", unit:"u1", fam:"u1-dividends", term:"Cumulative voting", def:"Shareholder's total votes = shares owned × open seats, allocated however they want — all on one candidate, or split up. Benefits smaller shareholders who want more sway.", hint:"Example: with 100 shares and 3 board seats, you get 300 total votes and could dump all 300 on one candidate to guarantee them a seat."},
  {id:"u1-27", unit:"u1", fam:"u1-dividends", term:"Preemptive rights", def:"The right of existing shareholders to buy newly issued shares first (before the general public), to maintain their proportionate ownership when a company raises more capital.", hint:"Example: you own 10% of a company; it issues new shares, and you get first crack at buying enough to stay at 10%."},
  {id:"u1-28", unit:"u1", fam:"u1-dividends", term:"Limited liability", def:"Shareholders can only lose the amount they invested; personal assets are never at risk to cover company debts. Contrast with a general partner or sole proprietor, who CAN be personally on the hook.", hint:"Example: the company goes bankrupt owing millions — the most a shareholder loses is what they paid for their shares, nothing more."},
  {id:"u1-29", unit:"u1", fam:"u1-dividends", term:"Equity bankruptcy priority", def:"At dissolution, debtholders (bonds) are paid first as senior securities, then preferred stockholders, then common stockholders last — common only gets residual assets, if any remain.", hint:"Picture a liquidation line: bondholders first, then preferred stockholders, then common stockholders if anything's left."},
  {id:"u1-40", unit:"u1", fam:"u1-dividends", term:"Product dividend", def:"A rare dividend paid in the company's own product rather than cash or stock — the value received is still taxable to the shareholder, just like a cash dividend.", hint:"Example: a beverage company once mailed shareholders a case of its newest soda flavor instead of a cash check."},
  {id:"u1-30", unit:"u1", fam:"u1-preferred", term:"Preferred stock par value", def:"Assume $100 par value for preferred stock on the exam (vs. $1,000 for bonds) unless a question says otherwise. A preferred's dividend is stated either as a flat dollar amount ($4 preferred = $4/year) or as a % of par (6% preferred = $6/year on $100 par).", hint:"On this exam, assume this stock's face value is $100 — not the $1,000 bonds use, unless told otherwise."},
  {id:"u1-31", unit:"u1", fam:"u1-preferred", term:"Straight (noncumulative) preferred", def:"No special features beyond the stated dividend; missed dividends are lost forever and never made up to the shareholder.", hint:"Example: the company skips your dividend this quarter — with this type, that payment is gone for good."},
  {id:"u1-32", unit:"u1", fam:"u1-preferred", term:"Cumulative preferred", def:"Unpaid dividends accrue as \"dividends in arrears\" on the company's books and must be paid in full — plus the current year's dividend — before common stockholders can receive anything.", hint:"Example: the company skips 4 years of $2 dividends, then resumes — it owes $8 in arrears plus the current $2 before common gets paid."},
  {id:"u1-33", unit:"u1", fam:"u1-preferred", term:"Callable preferred", def:"Lets the issuer buy the stock back at a stated price after a specific date — usually so the company can swap a high fixed dividend for a lower one once rates fall. Dividends stop on the call date. If a question doesn't mention a premium, assume the call happens at par.", hint:"Example: the issuer announces it's buying the stock back at $103 next year — dividends stop the day it actually happens."},
  {id:"u1-34", unit:"u1", fam:"u1-preferred", term:"Convertible preferred", def:"Can be exchanged for a fixed number of common shares. Usually carries a LOWER stated dividend than a similar nonconvertible preferred, because the conversion feature itself has value — the shot at extra capital gains.", hint:"Example: trade one share for 4 shares of common stock anytime — once the common's price climbs, this starts tracking it instead of acting fixed-income."},
  {id:"u1-35", unit:"u1", fam:"u1-preferred", term:"Adjustable-rate (variable) preferred", def:"Pays a dividend that resets periodically based on a benchmark like T-bill rates. Because the payout tracks current rates, the stock's price tends to stay relatively stable — but that also makes it a poor fit for an investor who specifically wants fixed, predictable income.", hint:"Example: this stock's dividend resets every quarter with T-bill rates — not fixed, so it's the wrong pick for someone wanting reliable income."},
  {id:"u1-36", unit:"u1", fam:"u1-preferred", term:"Participating preferred", def:"Pays its normal fixed dividend PLUS a possible extra dividend on top in profitable years, as spelled out when the stock was first issued.", hint:"Example: \"6% preferred, extra up to 9%\" pays its usual 6%, plus more in a great year if the board approves."},
  {id:"u1-41", unit:"u1", fam:"u1-preferred", term:"Preferred stock voting/preemptive rights", def:"Preferred stockholders normally do NOT have voting rights or preemptive rights, unlike common shareholders — the trade-off for getting a fixed, prioritized dividend. (Rare exception: some preferred issues are specifically written to carry voting rights.)", hint:"Example: a preferred shareholder gets a fixed dividend check but doesn't get a ballot for the board election like common shareholders do."},

  // ---- Unit 2 ----
  {id:"u2-1", unit:"u2", fam:"u2-adr", term:"ADR (American Depositary Receipt)", def:"A U.S. security representing shares of a foreign company. A U.S. depositary bank buys the foreign shares, deposits them at a foreign branch, and issues a receipt (the ADR) against them — denominated in USD, trading and settling like a U.S. common stock.", hint:"Example: want shares of a Japanese company without opening a Japanese brokerage account? A U.S. bank packages it for you in USD."},
  {id:"u2-28", unit:"u2", fam:"u2-adr", term:"ADR benefits", def:"Ease of use — trades OTC or on an exchange, settles like a U.S. stock, dividends arrive already converted to USD. Many ADR issuers also file periodic reports with the SEC, giving buyers extra visibility into the company.", hint:"Example: buy shares of a European company via this, get dividend checks in dollars, and never have to touch euros."},
  {id:"u2-2", unit:"u2", fam:"u2-adr", term:"ADR risks", def:"Currency risk and political risk of the foreign country, plus normal market/business/value risk. The bank converts foreign-currency dividends to USD, so exchange-rate swings change what you actually receive — and the ADR's value rises and falls with the underlying foreign stock.", hint:"Example: bought in USD on a U.S. exchange, but if the foreign currency crashes, your investment still takes the hit."},
  {id:"u2-29", unit:"u2", fam:"u2-adr", term:"ADR taxation", def:"Foreign governments may withhold tax on dividends paid to ADR holders. U.S. investors may be able to claim a foreign tax credit against their U.S. tax liability to offset this; capital gains from trading the ADR are only taxable in the U.S.", hint:"Example: a foreign country withholds 15% tax on a dividend; the investor can claim a U.S. tax credit for it."},
  {id:"u2-3", unit:"u2", fam:"u2-adr", term:"ADR voting rights", def:"The depositary bank is not required to pass through voting proxies or preemptive rights to ADR holders — if a proxy or right is issued, the bank may dispose of it however it chooses, including selling it. (An ADR holder CAN request the bank cancel the ADR and deliver the underlying foreign shares directly.)", hint:"Example: the foreign company holds a shareholder vote, but the U.S. bank isn't required to pass your vote along — a classic EXCEPT-style trap."},
  {id:"u2-4", unit:"u2", fam:"u2-rule144", term:"Rule 144", def:"An SEC rule under the Securities Act of 1933 covering two related but distinct things: trading restrictions on unregistered (restricted) stock, and trading restrictions on stock held by control persons/insiders. Watch for exam questions that combine both parts.", hint:"Think of this as the rulebook the SEC wrote to control how private-deal stock and company insiders can sell shares."},
  {id:"u2-5", unit:"u2", fam:"u2-rule144", term:"Restricted stock", def:"Securities acquired other than through a registered public offering — e.g., a private placement. Must be held fully paid for at least 6 months before they can be sold. Selling the shares for the first time effectively \"registers\" them going forward.", hint:"Example: bought shares in a private placement — stuck holding them for at least 6 months before you can sell."},
  {id:"u2-6", unit:"u2", fam:"u2-rule144", term:"Restrictive legend", def:"Wording printed on a restricted stock certificate warning of the holding-period restriction — why these are sometimes called \"legended certs.\" The issuer must remove the legend before the shares can be sold.", hint:"Picture a stamp of fine print on the certificate warning \"can't be sold for 6 months\" — stuck until it comes off."},
  {id:"u2-7", unit:"u2", fam:"u2-rule144", term:"Control stock", def:"REGISTERED shares held by control persons/insiders (officers, directors, 10%+ owners) — even though they're registered, selling them is still capped by Rule 144 volume limits because of who owns them.", hint:"Example: the company's CFO owns registered shares — selling them is still capped because of who owns them."},
  {id:"u2-8", unit:"u2", fam:"u2-rule144", term:"Control person (affiliate)", def:"An officer, director, or anyone who owns/controls 10%+ of a company's voting stock. Immediate family holdings are combined when counting toward that 10% — so a spouse's shares count too.", hint:"Example: a director owns 6% and their spouse owns 5% — combined, that's 11%, so BOTH of them get this label, even though neither hits 10% alone."},
  {id:"u2-9", unit:"u2", fam:"u2-rule144", term:"Form 144", def:"Filed with the SEC when a control person wants to sell shares (registered or restricted); used to calculate the maximum number of shares that may be sold during a rolling 90-day period.", hint:"Picture an insider filling out SEC paperwork before they're allowed to sell a big chunk of their shares — that filing itself is this."},
  {id:"u2-10", unit:"u2", fam:"u2-rule144", term:"Form 144 volume limit", def:"The GREATER of: 1% of the company's outstanding shares, OR the average weekly trading volume over the most recent 4 weeks (not 5 — using an extra week of data is a common exam trick).", hint:"Example: 1% of shares is 24,000, but the 4-week average is 24,500 — the higher number wins as the cap."},
  {id:"u2-11", unit:"u2", fam:"u2-rightswarrants", term:"Stock rights (preemptive rights)", def:"Short-term instruments (30–45 day subscription period) letting existing shareholders buy new shares below current market price during an additional public offering (APO), so they can maintain their proportionate ownership. Each shareholder gets one right per share owned; a set number of rights (plus cash) buys one new share.", hint:"Example: a company offers current shareholders a 30-day window to buy new shares below market price before the public can."},
  {id:"u2-12", unit:"u2", fam:"u2-rightswarrants", term:"Warrant", def:"A long-term certificate letting the holder buy stock from the issuer at a set exercise price, later. The exercise price starts ABOVE the current market value when issued — the holder is betting the stock eventually rises past it.", hint:"Example: buy a corporate bond and get 10 of these for free — each lets you buy stock later at a price currently above market."},
  {id:"u2-26", unit:"u2", fam:"u2-rightswarrants", term:"Warrant units", def:"Warrants are usually offered as \"sweeteners\" bundled with another security (a bond or preferred stock) to make that offering more attractive to buyers — and can later be detached and traded separately from the security they came with.", hint:"Example: a company issues bonds with 10 of these attached to sweeten the deal; investors can strip them off and sell separately."},
  {id:"u2-13", unit:"u2", fam:"u2-splits", term:"Forward stock split", def:"Increases the number of shares and decreases price per share, without changing total position value or cost basis total. Companies do this when a high share price starts discouraging trading.", hint:"Example: 100 shares at $80 ($8,000 total) become 200 shares at $40 — same $8,000 total value, just sliced into smaller, more tradable pieces."},
  {id:"u2-25", unit:"u2", fam:"u2-splits", term:"Even vs. uneven forward split", def:"An even split (2:1, 3:1) gives a whole-number ratio of new shares to old. An uneven split (5:4, 3:2) doesn't divide evenly and can leave the investor with fractional shares, which get paid out in cash instead.", hint:"Example: a 2:1 version turns 100 shares into a clean 200. A 5:4 version can leave a fraction that gets cashed out instead."},
  {id:"u2-14", unit:"u2", fam:"u2-splits", term:"Reverse stock split", def:"Decreases the number of shares and increases price per share, without changing total position value. Used when a stock's price has fallen so low it risks delisting or drifting into penny-stock range.", hint:"Example: 100 shares at $5 become 25 shares at $20 after a 1:4 version of this — same $500 total value."},
  {id:"u2-15", unit:"u2", fam:"u2-corpactions", term:"Merger", def:"Two or more companies combine operations and assets into one new company. Shareholders of BOTH original companies receive shares of the new combined company; their old shares are canceled.", hint:"Example: two airlines combine into a brand-new company — both sets of old shares vanish, replaced by new-company shares."},
  {id:"u2-16", unit:"u2", fam:"u2-corpactions", term:"Acquisition", def:"One company takes over another's operations and assets. The acquired company's shareholders receive shares of the acquiring company; the acquired company's shares are canceled. (\"M&A\" = mergers and acquisitions.)", hint:"Example: Seabird Airlines acquires Short Hop Air — Short Hop's shareholders get Seabird shares, and Short Hop's own shares disappear."},
  {id:"u2-17", unit:"u2", fam:"u2-corpactions", term:"Spin-off", def:"A corporation forms a new company out of some of its own assets/operations and distributes shares of it to existing shareholders — who ALSO keep their original shares in the parent company.", hint:"Example: a company carves off a division into a new company — shareholders get new shares AND keep their original ones."},
  {id:"u2-27", unit:"u2", fam:"u2-corpactions", term:"Buyback vs. tender offer", def:"A buyback is the company quietly repurchasing its own shares on the open market over time. A tender offer is a formal, public offer to ALL shareholders to sell at a set price (often above market) within a specific window — both are normally cash transactions.", hint:"Example: quietly buying back shares on the exchange over months (one type), vs. publicly offering $50/share by June 1 (the other)."},
  {id:"u2-18", unit:"u2", fam:"u2-corpactions", term:"Stock buyback", def:"A company repurchases its own outstanding shares on the open market, shrinking the share supply — often used as an alternative to raising the dividend, since fewer shares outstanding can boost the value of the shares that remain.", hint:"Example: a company spends its own cash to buy back its own stock on the open market, shrinking the share count."},
  {id:"u2-19", unit:"u2", fam:"u2-corpactions", term:"Tender offer", def:"A direct offer to buy securities from shareholders (bypassing the secondary market), usually for cash. Corporations use these both to buy back their own debt early and to acquire another company's shares (friendly or hostile).", hint:"Example: \"We'll pay you $40/share directly, no need to sell on the exchange\" — that direct cash offer straight to shareholders is this."},
  {id:"u2-20", unit:"u2", fam:"u2-corpactions", term:"Tax treatment of corporate actions", def:"Stock splits and stock dividends: never taxable. Mergers/acquisitions/spin-offs: generally not taxable if all-stock, but any cash portion is a taxable capital gain/loss. Buybacks and tender offers: almost always cash, so treated as a taxable sale.", hint:"Example: getting extra shares from a spin-off? No tax bill yet. Getting cash from a buyback or tender offer? That's a taxable sale, full stop."},
  {id:"u2-21", unit:"u2", fam:"u2-corpactions", term:"Corporate action notice timing", def:"Issuers must generally notify shareholders at least 10 days before the record date, listing the security, declaration date, record date, payment date, and the relevant rate/amount. If 10 days isn't practical for a rights/warrants offering, notice must go out on or before the record date and no later than the payment date.", hint:"Example: a company plans to pay a dividend with a record date of the 30th — it generally has to notify shareholders by at least the 20th."},
  {id:"u2-22", unit:"u2", fam:"u2-corpactions", term:"Proxy", def:"A limited power of attorney — like an absentee ballot — letting another person vote on a shareholder's behalf at the annual meeting. Automatically revoked if the shareholder attends the meeting in person or executes a newer proxy.", hint:"Picture mailing in an absentee ballot instead of showing up to the shareholder meeting in person — that's basically this."},
  {id:"u2-23", unit:"u2", fam:"u2-corpactions", term:"Street name stock voting (minor matters)", def:"If a customer does NOT return a proxy at all by the 10th day before the annual meeting on a MINOR/routine matter, the member firm may vote the shares as it sees fit (typically following management's recommendation).", hint:"Example: no proxy returned, deadline passes, routine matter — the firm can go ahead and vote as it sees fit."},
  {id:"u2-24", unit:"u2", fam:"u2-corpactions", term:"Street name stock voting (major matters)", def:"If a customer does NOT return a proxy at all by the 10th day before the annual meeting on a MAJOR matter (e.g., merger, new share issuance), the member firm may NEVER vote the shares — they go unvoted.", hint:"Example: no proxy returned on a merger — no matter the deadline, the firm must leave those shares unvoted."},
  {id:"u2-31", unit:"u2", fam:"u2-corpactions", term:"Signed proxy with no voting instructions", def:"If a customer SIGNS AND RETURNS a proxy but doesn't indicate how to vote on a specific item, the member firm must vote those shares as recommended by the issuer's management — this applies whether the matter is major or minor.", hint:"Example: a customer returns a signed proxy but leaves one item blank — the firm votes it exactly as management recommended."},
  {id:"u2-30", unit:"u2", fam:"u2-corpactions", term:"Beneficial owner (street name)", def:"When stock is held in \"street name,\" the broker-dealer is the nominal/record owner on the company's books, but the customer remains the beneficial owner who keeps all economic rights (dividends, sale proceeds, and — subject to proxy rules — voting).", hint:"Example: shares show up under your brokerage firm's name on the books, but the dividends and vote are still yours."},

  // ---- Unit 3 ----
  {id:"u3-1", unit:"u3", fam:"u3-basics", term:"Par value (bond)", def:"The face/principal value of a bond — assume $1,000 per bond on the exam unless told otherwise. This is the amount the issuer pays back to the investor at maturity.", hint:"Example: hold a bond to maturity and get back exactly $1,000. (Bonds default to $1,000 par, preferred stock to $100 — don't mix them up.)"},
  {id:"u3-2", unit:"u3", fam:"u3-basics", term:"Term bond", def:"A bond where the entire issue's principal matures on one single date. Because the whole balance comes due at once, issuers often set up a sinking fund to accumulate cash ahead of time to cover it.", hint:"Example: a company issues $10 million in bonds, and every dollar of principal comes due the same day in 2036."},
  {id:"u3-3", unit:"u3", fam:"u3-basics", term:"Serial bond", def:"A bond where portions of the principal mature at intervals over a period of years, rather than all at once.", hint:"Example: a $10 million issue where $1 million matures each year from 2027 through 2036 — a little comes due annually until the whole thing is retired."},
  {id:"u3-4", unit:"u3", fam:"u3-basics", term:"Balloon bond", def:"A hybrid of serial and term structures — the issuer repays part of the principal before final maturity (like a serial bond), but the majority comes due all at once at final maturity (like a term bond).", hint:"Example: small chunks mature over 10 years, but 70% comes due all at once in the final year."},
  {id:"u3-5", unit:"u3", fam:"u3-basics", term:"Coupon rate (nominal/stated yield)", def:"The interest rate the issuer has agreed to pay, stated as a % of par value. It's fixed at issuance and never changes, no matter how the bond's market price moves later. (Named after the physical interest coupons old paper bonds used to have attached.)", hint:"Example: a bond promises 6% forever — even if its market price swings wildly, this number never changes."},
  {id:"u3-6", unit:"u3", fam:"u3-basics", term:"Accrued interest", def:"Interest earned since the last coupon payment that the BUYER pays the SELLER when a bond trades between coupon dates — the buyer then collects the full next coupon from the issuer, evening things out. Zero-coupon bonds have none, since they pay no periodic interest.", hint:"Example: buy a bond 3 months after its last payment — you owe the seller those 3 months' worth at settlement."},
  {id:"u3-69", unit:"u3", fam:"u3-basics", term:"Accrued interest day-count convention", def:"Corporate and municipal bonds calculate accrued interest using a 30-day month / 360-day year; U.S. Treasury securities use actual calendar days instead. Both settle T+1.", hint:"Example: a corporate bond trade treats every month as exactly 30 days; a Treasury trade counts the real calendar days."},
  {id:"u3-7", unit:"u3", fam:"u3-basics", term:"Bond point", def:"1% of a bond's face value = $10 in bond pricing (since standard par is $1,000). Multiply the quoted price by $10 to get the dollar amount — a quote of 90 = $900, a quote of 103 = $1,030.", hint:"Example: a bond quoted at 96 means $960 — each one of these equals $10 on a standard $1,000 bond."},
  {id:"u3-8", unit:"u3", fam:"u3-yields", term:"Current Yield (CY)", def:"Annual coupon payment ÷ current market price — one of four ways to look at a bond's yield (alongside nominal, YTM, and YTC).", hint:"Example: a $70/year coupon on a bond trading at $875 works out to about 8% using this measure ($70 ÷ $875 = 8%)."},
  {id:"u3-9", unit:"u3", fam:"u3-yields", term:"Yield to Maturity (YTM)", def:"The annualized return if a bond is held to maturity, factoring in the price paid vs. par received at maturity. Buy at a discount → YTM is boosted by that gain; buy at a premium → YTM is reduced by that loss. No calculations required on the exam, just the concept. Also called the bond's \"basis\" — a bond \"trading on a basis of 5.83\" has a YTM of 5.83%.", hint:"Example: buy a bond at $900 (discount), collect $1,000 at maturity — that extra $100 gain pushes your annualized return (this) above the coupon rate."},
  {id:"u3-10", unit:"u3", fam:"u3-yields", term:"Yield to Call (YTC)", def:"The return on a bond if it's called (redeemed early by the issuer) before maturity — reflects the earlier payoff date and speeds up whatever discount gain or premium loss the investor was on track for.", hint:"Example: the issuer redeems your bond 5 years early instead of the original 20-year term — your return based on that early payoff is this."},
  {id:"u3-11", unit:"u3", fam:"u3-yields", term:"Basis point", def:"1/100 of 1%, used to measure yield changes. 100 basis points = 1%. Don't confuse this with a \"point\" (which measures bond PRICE, not yield, and equals $10).", hint:"Example: a yield moving from 4.25% to 4.60% moved by 35 of these."},
  {id:"u3-12", unit:"u3", fam:"u3-yields", term:"Yield order — discount bond", def:"Coupon < Current Yield < YTM < YTC — all four yields step UP as you move down this list, when a bond trades below par.", hint:"Example: bought at $900 instead of $1,000 par — coupon, current yield, YTM, and YTC each step up a little from the last."},
  {id:"u3-13", unit:"u3", fam:"u3-yields", term:"Yield order — premium bond", def:"Coupon > Current Yield > YTM > YTC — all four yields step DOWN as you move down this list, when a bond trades above par.", hint:"Example: bought at $1,100 instead of $1,000 par — coupon, current yield, YTM, and YTC each come out a little lower than the last."},
  {id:"u3-14", unit:"u3", fam:"u3-yields", term:"Yield order — par bond", def:"Coupon = Current Yield = YTM = YTC — all four yields are identical when a bond trades exactly at par.", hint:"Example: bought at exactly $1,000 — coupon, current yield, YTM, and YTC would all calculate to the identical number."},
  {id:"u3-15", unit:"u3", fam:"u3-yields", term:"Call feature", def:"Lets the issuer redeem a bond before maturity — issuers typically exercise this when rates FALL, so they can refinance at a lower rate. Benefits the issuer, so callable bonds pay a slightly HIGHER coupon to compensate investors for taking on that risk. Assume the call is at par unless a premium is stated.", hint:"Example: rates drop, so the issuer pays the bond off early to refinance cheaper — that early-payoff power is this."},
  {id:"u3-16", unit:"u3", fam:"u3-yields", term:"Put feature", def:"Lets the investor force the issuer to repay a bond early — investors typically exercise this when rates RISE, so they can reinvest at a better rate. Benefits the bondholder, so put bonds pay a slightly LOWER coupon since the feature itself has value.", hint:"Example: rates rise, so the investor forces the issuer to pay them back early to reinvest at a better rate — that power is this."},
  {id:"u3-17", unit:"u3", fam:"u3-yields", term:"Convertible feature", def:"Lets the bondholder convert the bond into a fixed number of the issuer's common shares — a benefit to the investor, since it trades a pure debt instrument for a shot at equity upside.", hint:"Example: the bondholder trades their bond in for 20 shares of common stock instead of cash."},
  {id:"u3-18", unit:"u3", fam:"u3-yields", term:"Parity (convertible bonds)", def:"When a convertible bond's market value exactly equals the value of the common shares it could convert into.", hint:"Example: converting your bond would get you shares worth exactly $1,000, the same as the bond — that break-even point is this."},
  {id:"u3-19", unit:"u3", fam:"u3-yields", term:"Zero-coupon bond", def:"Issued at a deep discount, pays NO periodic interest, matures at full par — the gap between purchase price and par IS the investor's interest. Taxed annually as it accretes toward par (\"phantom income\"), even though the investor doesn't see a dime until maturity. More volatile than similar-maturity coupon bonds since there's no coupon cushioning the price.", hint:"Example: buy it for $500 today, no interest checks, collect $1,000 in 20 years — but you're taxed on a slice of that gain every year (phantom income)."},
  {id:"u3-20", unit:"u3", fam:"u3-ratings", term:"Investment grade debt", def:"Rated BBB/Baa or higher — the top 4 rating tiers. Good liquidity, and generally the only quality eligible for purchase by banks, insurance companies, and other fiduciaries.", hint:"Example: a bond rated A or BBB is safe enough for a bank or insurer to legally buy. Higher rating = lower yield needed."},
  {id:"u3-21", unit:"u3", fam:"u3-ratings", term:"High-yield (junk) bond", def:"Rated BB/Ba or lower. Greater default risk and volatility, so it has to pay a higher yield to compensate — the same risk/reward tradeoff as a person with a low credit score paying a higher interest rate on a loan.", hint:"Example: a bond rated B pays extra interest since there's real default risk — suited to investors chasing bigger returns."},
  {id:"u3-22", unit:"u3", fam:"u3-ratings", term:"S&P/Fitch top 4 ratings", def:"AAA, AA, A, BBB (highest to lowest), using + / − for intermediate grades. Fitch uses this exact same scale as S&P.", hint:"Think alphabet-soup, best to worst: three A's then a B — the top four labels these two agencies share."},
  {id:"u3-23", unit:"u3", fam:"u3-ratings", term:"Moody's top 4 ratings", def:"Aaa, Aa, A, Baa (highest to lowest), using 1, 2, 3 for intermediate grades. Moody's is the only major agency of the three (S&P, Moody's, Fitch) with its own distinct rating alphabet.", hint:"This agency's top labels look like S&P's but lowercase, using 1/2/3 instead of plus/minus — mixing them up is a classic trap."},
  {id:"u3-60", unit:"u3", fam:"u3-ratings", term:"Nonrated bond", def:"A bond that has not been evaluated by a rating agency (Moody's, S&P, Fitch) — often because the issue is too small to justify the cost of getting rated. This does NOT necessarily mean it's low quality, just that there's no agency opinion available, which typically raises perceived risk due to that lack of information.", hint:"Example: a small municipality never pays for a Moody's rating — no agency opinion exists, so the bonds may be harder to sell."},
  {id:"u3-24", unit:"u3", fam:"u3-ratings", term:"Duration", def:"A single measure combining maturity AND coupon rate to gauge a bond's price sensitivity to interest rate changes. Higher duration = more volatile price. Can also measure the aggregate volatility of a whole bond portfolio. (You need to recognize the concept — no calculation required.)", hint:"Example: two bonds, same maturity — whichever has the lower coupon swings more in price when rates move."},
  {id:"u3-25", unit:"u3", fam:"u3-ratings", term:"Bond volatility factors", def:"Two things drive how much a bond's price swings when rates move: longer time to maturity = more volatile, and lower coupon rate = more volatile. Zero-coupon bonds combine both traits, making them the most volatile bond type of all.", hint:"Example: a 20-year zero-coupon bond is far more rate-sensitive than a 5-year 6% bond — longer time and lower coupon both crank this up."},
  {id:"u3-26", unit:"u3", fam:"u3-risks", term:"Default (credit) risk", def:"The risk that a bond issuer fails to pay interest or principal when due — generally considered the worst-case outcome of owning a bond.", hint:"Example: the company running the bond just stops sending interest checks — that worst-case scenario is this."},
  {id:"u3-27", unit:"u3", fam:"u3-risks", term:"Purchasing power risk", def:"The risk that inflation erodes what a bond's (or preferred stock's) fixed payments can actually buy over time — the single biggest risk to any FIXED payment stream.", hint:"Example: a fixed $50/year payment bought two movie tickets in 1990 — today it barely covers one, thanks to this."},
  {id:"u3-61", unit:"u3", fam:"u3-risks", term:"Administrative claimants (bankruptcy)", def:"In a corporate bankruptcy liquidation, administrative claimants (attorneys, courts, appraisers, auctioneers, liquidators — the people running the liquidation itself) are paid AFTER secured creditors but BEFORE any other unsecured debt or stockholders.", hint:"Example: the lawyers and liquidators running a bankruptcy get paid right after secured lenders, but before unsecured bondholders and stockholders."},
  {id:"u3-28", unit:"u3", fam:"u3-corporate", term:"Secured debt", def:"Debt backed by specific collateral the issuer pledges — real estate (mortgage bonds), equipment (equipment trust certificates), or a portfolio of other securities (collateral trust bonds). The strength of the collateral is part of what makes secured debt safer than unsecured.", hint:"Example: a bond backed by a company's real estate — if they can't pay, that property gets sold to cover bondholders."},
  {id:"u3-67", unit:"u3", fam:"u3-corporate", term:"Mortgage bond", def:"A secured bond backed by real estate the corporation owns; if the issuer defaults, the pledged property can be sold to repay bondholders.", hint:"Example: a company pledges its headquarters building as collateral — sellable to repay bondholders if it defaults."},
  {id:"u3-62", unit:"u3", fam:"u3-corporate", term:"Equipment trust certificate", def:"A bond secured by specific equipment (like railroad cars or airplanes) that the issuer pledges as collateral; commonly used by transportation companies.", hint:"Example: an airline issues bonds backed specifically by a fleet of new planes — if the airline defaults, bondholders have a claim on those planes."},
  {id:"u3-68", unit:"u3", fam:"u3-corporate", term:"Collateral trust bond", def:"A secured bond backed by a portfolio of securities (often from another issuer, like Treasuries) held in trust; the securities must be liquid, worth more than the loan, and mature as long as the bond or longer.", hint:"Example: a company backs a bond with a locked-away stack of Treasury securities — untouchable except to repay bondholders if it defaults."},
  {id:"u3-29", unit:"u3", fam:"u3-corporate", term:"Debenture", def:"An unsecured bond backed only by the issuer's full faith and credit — no real estate, no equipment, no securities pledged. Still the most senior (highest priority) unsecured debt a company can issue.", hint:"Example: a bond backed by nothing but the company's word and reputation — no collateral at all, yet still first in line among unsecured creditors."},
  {id:"u3-30", unit:"u3", fam:"u3-corporate", term:"Guaranteed bond", def:"An unsecured bond backed by a third party's promise (often a parent company) to cover payments if the issuer defaults. Still classified as unsecured, since there's no actual collateral — just a guarantee.", hint:"Example: a subsidiary's bond that its parent company promises to cover if the subsidiary can't pay — still zero collateral."},
  {id:"u3-31", unit:"u3", fam:"u3-corporate", term:"Income (adjustment) bond", def:"Pays interest only if the company actually has enough income to cover it, as authorized by the board — not a reliable income source, and generally the riskiest type of corporate bond for income purposes.", hint:"Example: this bond only pays interest in years the company actually turns a profit — some years, nothing at all."},
  {id:"u3-32", unit:"u3", fam:"u3-corporate", term:"Subordinated debt", def:"Unsecured debt that's explicitly ranked BELOW debentures (junior debt) — gets paid only after every other unsecured creditor is made whole. Usually pays a higher coupon to compensate for that extra risk.", hint:"Example: if the company goes bankrupt, this debt is paid only after every other unsecured creditor is made whole — hence the higher coupon."},
  {id:"u3-33", unit:"u3", fam:"u3-corporate", term:"Bankruptcy priority order (corp)", def:"Secured debt → administrative claims (bankruptcy costs, often incl. wages/taxes) → unsecured debt/general creditors (debentures) → subordinated debt → preferred stock → common stock.", hint:"Payout line: secured lenders first, then admin costs, then unsecured creditors, then junior debt, then preferred stock, then common stock last."},
  {id:"u3-57", unit:"u3", fam:"u3-corporate", term:"\"Series\" bond (trick term)", def:"\"Series\" is NOT a bond maturity type (unlike term/serial/balloon) — on the exam, \"series bond\" normally refers to savings bonds (like Series EE or Series I), not a maturity structure or collateral type.", hint:"Example: don't try to fit this into term/serial/balloon — it actually points to Series EE or Series I savings bonds."},
  {id:"u3-59", unit:"u3", fam:"u3-corporate", term:"Sinking fund", def:"Money a corporation sets aside regularly to redeem term bonds at or before maturity, reducing default risk for bondholders by pre-funding that big single payoff date.", hint:"Example: a company sets aside cash every year into a fund specifically earmarked to pay off a large term bond issue when it matures in 2035."},
  {id:"u3-34", unit:"u3", fam:"u3-govt", term:"Treasury bill (T-bill)", def:"Short-term Treasury debt (up to 52 weeks), issued at a discount, matures at par, no periodic interest — works exactly like a zero-coupon bond, just short-term.", hint:"Example: pay $9,800 today, collect $10,000 in 26 weeks — no interest checks in between, just that difference."},
  {id:"u3-35", unit:"u3", fam:"u3-govt", term:"Treasury note (T-note)", def:"Intermediate-term Treasury debt (2–10 years), issued at par, pays semiannual interest.", hint:"Example: a 7-year government IOU that pays you interest twice a year until it matures."},
  {id:"u3-36", unit:"u3", fam:"u3-govt", term:"Treasury bond (T-bond)", def:"Long-term Treasury debt (10–30 years), issued at par, pays semiannual interest — the longest-running Treasury security.", hint:"Example: a 25-year government IOU paying interest twice a year — the longest-running maturity the U.S. government issues."},
  {id:"u3-37", unit:"u3", fam:"u3-govt", term:"Treasury STRIPS", def:"Zero-coupon bonds created by separating a Treasury's interest and principal payments into individually tradable pieces. Backed by the full faith and credit of the U.S. government, since the Treasury itself creates them.", hint:"Example: a bank splits a 10-year Treasury note's interest from its principal, creating a pure zero-coupon piece — still government-backed."},
  {id:"u3-63", unit:"u3", fam:"u3-govt", term:"Treasury receipts", def:"A privately created zero-coupon product backed by Treasury securities held in custody by a broker-dealer (unlike STRIPS, which are created and backed directly by the U.S. Treasury).", hint:"Example: a brokerage firm strips coupons off Treasuries and repackages them itself — backed by the broker's custody, not a direct government guarantee."},
  {id:"u3-58", unit:"u3", fam:"u3-govt", term:"Savings bond", def:"A non-marketable U.S. government bond (e.g., Series EE, Series I) purchased directly from the Treasury; cannot be traded on the secondary market and is redeemed directly with the government, though it is exempt from several securities laws.", hint:"Example: a parent buys a Series EE bond for a child from TreasuryDirect.gov — only redeemable with the government, not resellable."},
  {id:"u3-38", unit:"u3", fam:"u3-govt", term:"TIPS", def:"Treasury Inflation-Protected Securities. Fixed coupon rate, but the PRINCIPAL adjusts every 6 months for inflation — so the actual dollar interest paid rises and falls with it too. Final principal paid at maturity is never less than original par.", hint:"Example: inflation runs hot this year, so this bond's principal balance — and the interest paid on it — both bump up to match."},
  {id:"u3-39", unit:"u3", fam:"u3-govt", term:"GNMA (Ginnie Mae)", def:"The only agency security backed by the full faith and credit of the U.S. government. Pass-through mortgage security paying monthly principal & interest; interest is taxable at both the federal AND state/local level. Early mortgage payoffs create prepayment risk for investors.", hint:"Example: even if every homeowner defaulted, the U.S. government would still make investors whole. Early payoffs create prepayment risk."},
  {id:"u3-40", unit:"u3", fam:"u3-govt", term:"FNMA (Fannie Mae)", def:"A government-sponsored enterprise (GSE), publicly held; buys conventional/insured mortgages and issues MBS (monthly pass-through) as well as regular bonds (semiannual interest). NOT backed by the U.S. Treasury; interest is taxable at both federal AND state/local levels.", hint:"Example: this publicly traded company buys mortgages from banks and repackages them — no government guarantee, fully taxable interest."},
  {id:"u3-41", unit:"u3", fam:"u3-govt", term:"FHLMC (Freddie Mac)", def:"A government-sponsored enterprise (GSE); creates a secondary market for mortgages and issues MBS (monthly pass-through) as well as regular bonds (semiannual interest). NOT backed by the U.S. Treasury; interest is taxable at both federal AND state/local levels.", hint:"Example: this GSE buys mortgages, bundles them, sells the packages, and also issues plain bonds — no government guarantee."},
  {id:"u3-70", unit:"u3", fam:"u3-govt", term:"Farm Credit System (FCS)", def:"A government-sponsored, privately-owned network of lending institutions that provides agricultural financing, funded by selling Farm Credit debt securities; overseen (not owned) by the Farm Credit Administration (FCA), a government agency.", hint:"Example: a farmer gets a loan through a local lending institution funded by selling this network's own debt securities."},
  {id:"u3-42", unit:"u3", fam:"u3-muni", term:"General Obligation (GO) bond", def:"A municipal bond backed by the issuer's taxing power; used for non-revenue-producing projects (parks, schools); usually requires voter approval and is subject to a legal debt limit.", hint:"Example: a city borrows to build a new park (which earns no revenue) and repays it using property tax collections."},
  {id:"u3-43", unit:"u3", fam:"u3-muni", term:"Revenue bond", def:"A municipal bond backed by the revenue of the specific project financed (tolls, utility fees); self-supporting, NOT subject to a debt limit, and usually doesn't need voter approval since taxpayers aren't on the hook.", hint:"Example: a city borrows to build a toll bridge, and repays bondholders only from the tolls that bridge actually collects."},
  {id:"u3-44", unit:"u3", fam:"u3-muni", term:"TAN (Tax Anticipation Note)", def:"Short-term municipal note that finances operations before expected tax receipts come in.", hint:"Example: a city needs cash in March but property taxes aren't due until September — this short-term note bridges that gap."},
  {id:"u3-45", unit:"u3", fam:"u3-muni", term:"RAN (Revenue Anticipation Note)", def:"Short-term municipal note that finances operations before expected project revenues come in.", hint:"Example: a toll road authority needs cash now but the toll income won't arrive until later — this note bridges that specific gap."},
  {id:"u3-71", unit:"u3", fam:"u3-muni", term:"TRAN (Tax and Revenue Anticipation Note)", def:"A short-term municipal note combining the features of a TAN and a RAN — issued in anticipation of both future tax receipts and future project revenue.", hint:"Example: a city expects both a tax collection AND toll income, so it issues one note anticipating both sources at once."},
  {id:"u3-46", unit:"u3", fam:"u3-muni", term:"BAN (Bond Anticipation Note)", def:"Interim municipal financing used to bridge the gap before a long-term bond is formally issued.", hint:"Example: a city needs construction cash right away but won't formally issue its 20-year bond for another 6 months — this note covers the interim."},
  {id:"u3-72", unit:"u3", fam:"u3-muni", term:"GAN (Grant Anticipation Note)", def:"A short-term municipal note issued in anticipation of receiving grant money, usually from the federal government.", hint:"Example: a town gets approved for a federal grant that won't arrive for months, so it issues this to fund the project now."},
  {id:"u3-73", unit:"u3", fam:"u3-muni", term:"Construction Loan Note (CLN)", def:"A short-term municipal note issued to provide interim financing for the construction of housing projects.", hint:"Example: a housing authority issues a CLN to pay contractors while a public housing project is being built, before longer-term financing is arranged."},
  {id:"u3-74", unit:"u3", fam:"u3-muni", term:"Tax-exempt commercial paper (muni)", def:"A short-term (up to 270 days, usually 30/60/90-day) municipal financing tool often used in place of a BAN or TAN.", hint:"Example: instead of a formal note, a municipality raises quick cash by issuing this kind of tax-free IOU due in 60 days."},
  {id:"u3-64", unit:"u3", fam:"u3-muni", term:"Territory bonds", def:"Bonds issued by U.S. territories (Puerto Rico, Guam, U.S. Virgin Islands) that are triple tax-exempt (federal, state, and local) for all U.S. investors regardless of residency.", hint:"Example: a Puerto Rico bond owes no federal, state, or local tax to any U.S. investor — unlike regular munis, which are only state-tax-free in-state."},
  {id:"u3-65", unit:"u3", fam:"u3-muni", term:"Variable-Rate Demand Note (VRDN)", def:"A long-term municipal security with an interest rate that resets periodically and a \"put\" feature letting the holder sell it back to the issuer/agent at par on short notice, functioning like a short-term instrument despite its long stated maturity.", hint:"Example: an investor can sell this muni security back to the remarketing agent at par with a few days' notice, despite a decades-away maturity."},
  {id:"u3-47", unit:"u3", fam:"u3-muni", term:"Tax-equivalent yield", def:"Formula: Municipal yield ÷ (100% − tax bracket). Converts a tax-free muni yield into its taxable equivalent, so you can fairly compare it against a taxable bond.", hint:"Example: a 7% muni yield for someone in the 30% tax bracket works out to a 10% number once you run this conversion: 7% ÷ 0.70 = 10%."},
  {id:"u3-48", unit:"u3", fam:"u3-moneymarket", term:"Money market instrument", def:"Short-term debt with 1 year or less to maturity; high quality, very liquid, low return — the tradeoff for that safety and speed.", hint:"Example: a 6-month T-bill or 90-day commercial paper — any safe debt maturing in a year or less lands in this category."},
  {id:"u3-49", unit:"u3", fam:"u3-moneymarket", term:"Jumbo CD", def:"A bank-issued CD with a minimum face value of $100,000. The negotiable version trades in the secondary market (instead of paying an early-withdrawal penalty) and counts as a money market instrument.", hint:"Example: a $250,000 bank CD that's actually big enough to be resold to another investor before it matures."},
  {id:"u3-66", unit:"u3", fam:"u3-moneymarket", term:"Negotiable vs. nonnegotiable CD", def:"A negotiable (jumbo) CD is $100,000+, can be traded on the secondary market before maturity, and doesn't need an early-withdrawal penalty since you sell it instead; a nonnegotiable CD cannot be sold and incurs a penalty for early withdrawal.", hint:"Example: a $250,000 large-denomination CD can be resold to another investor early; a small bank CD instead pays an early-withdrawal penalty."},
  {id:"u3-50", unit:"u3", fam:"u3-moneymarket", term:"Banker's Acceptance (BA)", def:"A short-term instrument (1–180 days) used to finance international trade; issued at a discount, like a T-bill.", hint:"Example: an importer needs a bank-guaranteed short-term IOU to pay for goods shipping in from overseas — that's this."},
  {id:"u3-51", unit:"u3", fam:"u3-moneymarket", term:"Commercial paper", def:"Unsecured short-term corporate debt (1–270 days, most within 90) used to finance receivables/seasonal needs — only issued by companies with strong enough credit that investors will buy it unsecured.", hint:"Example: a company with excellent credit borrows for 60 days, unsecured, just to cover payroll until customer payments come in."},
  {id:"u3-52", unit:"u3", fam:"u3-moneymarket", term:"Repurchase agreement (Repo)", def:"A sale of securities with an agreement to buy them back later at a higher price; a way for a dealer/bank to raise short-term cash using securities they already own as collateral.", hint:"Example: a bank sells securities today for quick cash, agreeing to buy them back tomorrow at a slightly higher price."},
  {id:"u3-53", unit:"u3", fam:"u3-moneymarket", term:"Reverse repo", def:"The dealer buys securities from an investor and agrees to sell them back later at a higher price — the mirror image of a repo.", hint:"Example: same deal as the standard version, but from the other side — you're buying now, planning to resell later."},
  {id:"u3-54", unit:"u3", fam:"u3-moneymarket", term:"Federal funds", def:"Excess bank reserves held at the Fed that banks loan to OTHER banks, usually overnight, to meet reserve requirements.", hint:"Example: Bank A has extra reserves parked at the Fed and lends them overnight to Bank B, which is a little short."},
  {id:"u3-55", unit:"u3", fam:"u3-moneymarket", term:"CMO (Collateralized Mortgage Obligation)", def:"Pools mortgages into tranches with different maturities/risk; pays monthly principal & interest, with the highest (safest) tranche paid off first.", hint:"Example: a pool of thousands of home loans gets sliced into different risk/maturity buckets — the safest, shortest bucket gets paid off first."},
  {id:"u3-56", unit:"u3", fam:"u3-moneymarket", term:"CDO (Collateralized Debt Obligation)", def:"A complex asset-backed security divided into tranches, backed by a mix of debt types (auto loans, credit card debt, bonds, etc. — not just mortgages); higher risk tranche = higher potential return.", hint:"Example: a bundle backed by a mix of auto loans, credit card debt, and bonds — not just mortgages — sliced into risk tranches."}
];

const QUIZ = [
  // ---- Unit 1 ----
